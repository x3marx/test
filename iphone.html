<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>نظام تدريب بنك الأسئلة - iPhone</title>
<style>
:root{
  --bg:#0b1020;--card:#121a2c;--card2:#172033;--line:#26324a;--text:#f5f7fb;--muted:#aab6c9;
  --brand:#6ee7b7;--brand2:#38bdf8;--good:#34d399;--bad:#fb7185;--warn:#fbbf24;--radius:22px;--tap:48px;
  --shadow:0 18px 60px rgba(0,0,0,.34)
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at top left,rgba(56,189,248,.18),transparent 34rem),radial-gradient(circle at bottom right,rgba(110,231,183,.13),transparent 34rem),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{padding:16px;padding-bottom:calc(94px + env(safe-area-inset-bottom));overflow-x:hidden}
button,input,select{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.app{max-width:1160px;margin:auto}
.hero{display:block;margin-bottom:10px}
.box,.panel,.card{background:rgba(18,26,44,.88);border:1px solid rgba(255,255,255,.1);border-radius:var(--radius);box-shadow:var(--shadow);backdrop-filter:blur(16px)}
.box{padding:18px}
.compactHero{padding:12px 14px;overflow:hidden}
.heroRow{display:block}
h1{margin:0 0 10px;font-size:clamp(1.25rem,4.5vw,2rem);letter-spacing:-.03em;line-height:1.25;text-align:center}
.sub{margin:0;color:var(--muted);line-height:1.8;font-size:.98rem}
.compactMetrics{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;align-items:stretch;max-width:100%}
.formsMini{display:none!important}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pill,.metricChip{border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:999px;color:var(--text);font-size:.78rem;min-width:0;text-align:center}
.pill{padding:7px 12px}.metricChip{padding:6px 8px;line-height:1.15;overflow:hidden;text-overflow:ellipsis}
.pill strong,.metricChip strong{color:var(--brand);font-weight:900}
.metricChip .label{color:var(--muted);font-size:.72rem;margin-inline-end:3px}
.metricChip.status{grid-column:span 2}.metricChip.status strong{color:var(--brand)}.simpleMetric{display:inline-flex;align-items:center;justify-content:center;gap:5px}.metricIcon{line-height:1;font-size:.9rem}
.metricChip.good strong{color:var(--good)}
.metricChip.bad strong{color:var(--bad)}
.metricChip.warn strong{color:var(--warn)}
.actionsTop{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap;justify-content:flex-start}
.btn{min-height:var(--tap);border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.07);color:var(--text);padding:10px 14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.15s transform,.15s border-color,.15s background}
.btn:hover{transform:translateY(-1px);border-color:rgba(110,231,183,.55)}
.btn.primary{background:linear-gradient(135deg,rgba(110,231,183,.22),rgba(56,189,248,.18));border-color:rgba(110,231,183,.5)}
.btn.good{border-color:rgba(52,211,153,.55);background:rgba(52,211,153,.12)}
.btn.bad{border-color:rgba(251,113,133,.55);background:rgba(251,113,133,.11)}
.btn.warn{border-color:rgba(251,191,36,.55);background:rgba(251,191,36,.11)}
.grid{display:grid;grid-template-columns:330px 1fr;gap:14px;align-items:start}
.panel{padding:14px;position:sticky;top:14px}
.sectionTitle{font-weight:900;margin:4px 0 10px;color:#dbeafe}
.field{display:grid;gap:6px;margin-bottom:10px}
label{color:var(--muted);font-size:.86rem}
select,input{width:100%;min-height:46px;border-radius:14px;border:1px solid var(--line);background:#0e1627;color:var(--text);padding:9px 12px;outline:none}
select:focus,input:focus{border-color:var(--brand2)}
.miniStats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.stat{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:16px;padding:10px}
.stat b{display:block;font-size:1.18rem;color:var(--brand)}
.stat span{color:var(--muted);font-size:.82rem}
.navList{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;max-height:310px;overflow:auto;padding-inline-end:2px}
.qchip{min-height:38px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.055);color:var(--text);font-size:.83rem}
.qchip.active{border-color:var(--brand);background:rgba(110,231,183,.16)}
.qchip.done{box-shadow:inset 0 -3px 0 rgba(56,189,248,.8)}
.qchip.ok{box-shadow:inset 0 -3px 0 rgba(52,211,153,.9)}
.qchip.no{box-shadow:inset 0 -3px 0 rgba(251,113,133,.9)}
.card{padding:18px;min-height:560px}
.meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.metaInfo{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.metaRates{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-start;direction:ltr}
.metricBadge{border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:999px;padding:7px 11px;color:var(--brand);font-size:.88rem;font-weight:900;min-width:70px;text-align:center}
.badge{border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:999px;padding:7px 11px;color:#dbeafe;font-size:.88rem}
.badge.good{border-color:rgba(52,211,153,.5);color:#bbf7d0}
.question{font-size:clamp(1.08rem,2.6vw,1.42rem);line-height:2;margin:12px 0 18px;font-weight:800}
.options{display:grid;gap:10px}
.option{width:100%;text-align:right;align-items:flex-start;justify-content:flex-start;line-height:1.75;padding:13px 14px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.055);color:var(--text);display:flex;gap:11px}
.option .letter{flex:0 0 34px;height:34px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);font-weight:900}
.option.selected{border-color:var(--brand2);background:rgba(56,189,248,.13)}
.option.correct{border-color:rgba(52,211,153,.72);background:rgba(52,211,153,.14)}
.option.wrong{border-color:rgba(251,113,133,.72);background:rgba(251,113,133,.13)}
.feedback{display:none;margin-top:14px;border-radius:18px;padding:13px 14px;line-height:1.8;border:1px solid var(--line);background:rgba(255,255,255,.055)}
.feedback.show{display:block}
.feedback.ok{border-color:rgba(52,211,153,.55);background:rgba(52,211,153,.11)}
.feedback.no{border-color:rgba(251,113,133,.55);background:rgba(251,113,133,.11)}
.cardActions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.quickControls{display:grid;grid-template-columns:1fr;gap:8px;margin:12px 0}.quickControls .btn{justify-content:space-between}.quickControls b{min-width:30px;height:30px;border-radius:999px;background:rgba(255,255,255,.1);display:inline-flex;align-items:center;justify-content:center;color:var(--brand)}
.timerBox{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:18px;padding:10px 12px;margin:6px 0 14px}.timerHead{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#dbeafe;font-weight:800}.timerText{direction:rtl;color:var(--warn);font-variant-numeric:tabular-nums}.timerBar{height:9px;border-radius:999px;background:rgba(255,255,255,.09);overflow:hidden;margin-top:9px}.timerFill{display:block;height:100%;width:100%;border-radius:999px;background:linear-gradient(90deg,var(--bad),var(--warn),var(--brand));transition:width .25s linear}.timerDone .timerText{color:var(--bad)}
body.phoneView .app{max-width:460px}body.phoneView{padding:10px;padding-bottom:calc(86px + env(safe-area-inset-bottom))}body.phoneView .hero{grid-template-columns:1fr}body.phoneView .grid{grid-template-columns:1fr}body.phoneView .panel{position:static}body.phoneView .card{min-height:auto;padding:15px}body.phoneView .navList{display:flex;overflow:auto;max-height:none;padding-bottom:4px}body.phoneView .qchip{min-width:48px}body.phoneView .actionsTop{display:none}body.phoneView .bottomBar{display:flex}body.phoneView .bottomBar .btn{flex:1;padding:9px 8px}body.phoneView .question{font-size:1.12rem;line-height:1.9}body.phoneView .option{padding:12px 13px}
.bottomBar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(11,16,32,.82);border-top:1px solid rgba(255,255,255,.1);backdrop-filter:blur(18px);padding:10px calc(12px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));display:none;gap:8px}
.empty{padding:28px;text-align:center;color:var(--muted);line-height:1.8}
.kbd{font-family:ui-monospace,Consolas,monospace;direction:ltr;unicode-bidi:bidi-override}
@media(max-width:860px){
  body{padding:10px;padding-bottom:calc(86px + env(safe-area-inset-bottom))}
  .compactHero{padding:10px}
  h1{margin-bottom:8px;font-size:1.35rem}
  .compactMetrics{width:100%;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
  .metricChip{font-size:.72rem;padding:6px 5px}
  .metricChip .label{display:block;margin:0 0 2px;font-size:.68rem}
  .grid{grid-template-columns:1fr}
  .panel{position:static}
  .card{min-height:auto;padding:15px}
  .navList{display:flex;overflow:auto;max-height:none;padding-bottom:4px}
  .qchip{min-width:48px}
  .actionsTop{display:none}
  .bottomBar{display:flex}
  .bottomBar .btn{flex:1;padding:9px 8px}
}
@media(max-width:430px){.miniStats{grid-template-columns:1fr 1fr}.pill{font-size:.82rem}.question{line-height:1.9}.compactMetrics{grid-template-columns:repeat(2,minmax(0,1fr))}.metricChip.status{grid-column:1 / -1}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

.uploadMini{border:1px solid var(--line);background:rgba(255,255,255,.045);border-radius:18px;padding:10px;margin-bottom:14px;display:grid;gap:9px}
.uploadBtn{width:100%;font-weight:900}
.importStatus{border:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.12);border-radius:14px;padding:10px;color:var(--muted);font-size:.86rem;line-height:1.7}
.importStatus.good{border-color:rgba(52,211,153,.55);background:rgba(52,211,153,.10);color:#bbf7d0}
.importStatus.bad{border-color:rgba(251,113,133,.55);background:rgba(251,113,133,.10);color:#fecdd3}
.emptyUpload{max-width:720px;margin:auto;text-align:center;line-height:1.9;padding:18px}
.emptyUpload h2{margin:0 0 8px;color:#eafff6}
.emptyUpload p{color:var(--muted);margin:0 0 14px}
.templateHint{margin-top:14px;border:1px solid var(--line);background:rgba(255,255,255,.045);border-radius:18px;padding:12px;color:var(--muted);font-size:.86rem;line-height:1.8;text-align:right}

@media(max-width:560px){.meta{align-items:stretch;flex-direction:column}.metaInfo,.metaRates{justify-content:flex-start}.metricBadge{min-width:auto;padding:6px 10px}}

.excelUrlBox{display:grid;gap:8px;margin-top:12px}
.excelUrlRow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.excelUrlRow input{flex:1;min-width:210px}
.excelHint{color:var(--muted);font-size:.82rem;line-height:1.7;margin:0}
@media(max-width:860px){
  .excelUrlRow{display:grid;grid-template-columns:1fr}
  .excelUrlRow input,.excelUrlRow button{width:100%}
}


/* Exam mode */
.examStartBtn{border-color:rgba(110,231,183,.7)!important;background:linear-gradient(135deg,rgba(110,231,183,.22),rgba(56,189,248,.18))!important;font-weight:900}
.examTop{position:sticky;top:0;z-index:4;margin:-4px -4px 12px;padding:10px;border:1px solid rgba(255,255,255,.1);border-radius:18px;background:rgba(14,22,39,.96);backdrop-filter:blur(14px);display:grid;gap:8px}
.examHeaderLine{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.examTimer{font-size:1.1rem;font-weight:900;color:var(--warn);font-variant-numeric:tabular-nums}
.examProgress{color:#dbeafe;font-weight:900}.examProgress b{color:var(--brand)}
.examReviewFlag{border-color:rgba(251,191,36,.65)!important;background:rgba(251,191,36,.15)!important}
.examOption.selected{border-color:var(--brand2);background:rgba(56,189,248,.16)}
.examOption.correct,.examOption.wrong{background:rgba(255,255,255,.055);border-color:var(--line)}
.examActions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}
.examResultBox{border:1px solid var(--line);background:rgba(255,255,255,.045);border-radius:20px;padding:14px;margin:10px 0;line-height:1.8}
.examScore{font-size:1.8rem;font-weight:900;color:var(--brand);text-align:center;margin:8px 0}.examScore small{display:block;color:var(--muted);font-size:.9rem;font-weight:600}
.examLessonTable{width:100%;border-collapse:collapse;margin-top:10px;overflow:hidden;border-radius:14px;font-size:.92rem}.examLessonTable th,.examLessonTable td{border:1px solid rgba(255,255,255,.1);padding:8px;text-align:center}.examLessonTable th{background:rgba(255,255,255,.07);color:#dbeafe}.weakLesson{color:var(--bad);font-weight:900}.okLesson{color:var(--good);font-weight:900}.examNavHint{color:var(--muted);font-size:.82rem;line-height:1.6}
.qchip.review{outline:2px solid rgba(251,191,36,.8);outline-offset:-2px}
.qchip.answeredExam{box-shadow:inset 0 -3px 0 rgba(56,189,248,.8)}
@media(max-width:860px){.examActions{grid-template-columns:1fr 1fr}.examTop{position:static}.examTimer{font-size:1rem}.examLessonTable{font-size:.8rem}.examLessonTable th,.examLessonTable td{padding:6px 4px}}


/* Exam mistake review */
.examMistakes{display:grid;gap:12px;margin-top:14px}
.examMistake{border:1px solid rgba(251,113,133,.45);background:rgba(251,113,133,.08);border-radius:18px;padding:14px;line-height:1.75}
.examMistake.unanswered{border-color:rgba(251,191,36,.5);background:rgba(251,191,36,.08)}
.examMistakeHead{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:9px}
.examMistakeQuestion{font-weight:900;color:#f8fafc;margin:8px 0 10px}
.examAnswerLine{border-radius:13px;padding:9px 11px;margin-top:7px;border:1px solid var(--line);background:rgba(255,255,255,.045)}
.examAnswerLine.user{border-color:rgba(251,113,133,.45);color:#fecdd3}
.examAnswerLine.correct{border-color:rgba(52,211,153,.45);color:#bbf7d0}
.examReviewSummary{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.examReviewToggle{width:100%;margin-top:10px}
@media(max-width:860px){.examMistake{padding:11px}.examMistakeHead{gap:5px}.examAnswerLine{font-size:.9rem}}


/* Exam mistake training + export + review navigation */
.examTools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.examTools .btn{width:100%}
.examReviewJump{grid-column:1 / -1}
@media(max-width:860px){.examTools{grid-template-columns:1fr}}

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js">
/* Excel URL loader added */
async function readExcelFromArrayBuffer(arrayBuffer, sourceName){
  if (typeof XLSX === "undefined") {
    throw new Error("مكتبة قراءة Excel غير محملة. تأكد من اتصال الإنترنت أو استخدم نسخة Offline.");
  }
  const workbook = XLSX.read(arrayBuffer, {type:"array"});
  const firstSheetName = workbook.SheetNames[0];
  const sheet = workbook.Sheets[firstSheetName];
  const rows = XLSX.utils.sheet_to_json(sheet, {defval:""});
  if (!rows.length) throw new Error("ملف Excel لا يحتوي على أسئلة.");

  // Use the page's own importer if available.
  if (typeof importRows === "function") {
    importRows(rows, sourceName || "Excel");
    return;
  }
  if (typeof loadQuestionsFromRows === "function") {
    loadQuestionsFromRows(rows, sourceName || "Excel");
    return;
  }
  if (typeof buildQuestionsFromRows === "function") {
    QUESTIONS = buildQuestionsFromRows(rows);
    if (typeof afterExcelLoaded === "function") afterExcelLoaded(sourceName || "Excel");
    else if (typeof render === "function") render();
    return;
  }

  // Generic fallback for the current template columns.
  const pick = (row, names) => {
    for (const n of names) {
      if (row[n] !== undefined && String(row[n]).trim() !== "") return row[n];
    }
    return "";
  };
  const qs = rows.map((row, idx) => {
    const form = String(pick(row, ["Form","form","النموذج","Model"]) || "form1").trim();
    const formTitle = String(pick(row, ["Form Title","formTitle","FormTitle","عنوان النموذج"]) || form || "النموذج").trim();
    const id = Number(pick(row, ["Question No.","Question No","QuestionNo","No","ID","رقم السؤال","السؤال"])) || (idx + 1);
    const lesson = String(pick(row, ["Lesson","lesson","Category","التصنيف","الدرس"]) || "").trim();
    const question = String(pick(row, ["Question","question","نص السؤال","السؤال"]) || "").trim();
    const a = String(pick(row, ["Option A","A","الخيار أ","الخيار A"]) || "").trim();
    const b = String(pick(row, ["Option B","B","الخيار ب","الخيار B"]) || "").trim();
    const c = String(pick(row, ["Option C","C","الخيار ج","الخيار C"]) || "").trim();
    const d = String(pick(row, ["Option D","D","الخيار د","الخيار D"]) || "").trim();
    const answerRaw = pick(row, ["Correct Answer","Answer","correct","الإجابة الصحيحة","الاجابة الصحيحة"]);
    const answer = typeof normalizeAnswer === "function" ? normalizeAnswer(answerRaw) : String(answerRaw || "").trim().toUpperCase();
    return {
      id, form, formTitle, lesson, question, answer,
      options:[
        {key:"A",letter:"أ",text:a},
        {key:"B",letter:"ب",text:b},
        {key:"C",letter:"ج",text:c},
        {key:"D",letter:"د",text:d}
      ]
    };
  }).filter(q => q.question && q.answer && q.options.every(o => o.text));

  if (!qs.length) throw new Error("لم يتم العثور على أسئلة صالحة في Excel.");
  QUESTIONS = qs;

  if (typeof onQuestionsLoaded === "function") onQuestionsLoaded(sourceName || "Excel");
  else {
    const status = document.getElementById("status");
    if (status) {
      status.className = "status good";
      status.textContent = "تم تحميل " + QUESTIONS.length + " سؤال من " + (sourceName || "Excel");
    }
    const loadState = document.getElementById("loadState");
    if (loadState) loadState.textContent = "تم تحميل Excel";
    const totalPill = document.getElementById("totalPill");
    if (totalPill) totalPill.textContent = QUESTIONS.length;
    if (typeof rebuildFormFilter === "function") rebuildFormFilter();
    if (typeof rebuildLessonFilter === "function") rebuildLessonFilter();
    if (typeof saveImportedQuestions === "function") saveImportedQuestions();
    if (typeof render === "function") render();
    if (typeof renderQuestion === "function") renderQuestion();
  }
}

async function loadExcelFromUrl(){
  const input = document.getElementById("excelUrl");
  const status = document.getElementById("status");
  const url = input ? input.value.trim() : "";
  if (!url) {
    if (status) {
      status.className = "status";
      status.textContent = "يرجى إدخال رابط Excel أولاً.";
    }
    return;
  }
  try {
    if (status) {
      status.className = "status";
      status.textContent = "جاري تحميل ملف Excel من الرابط...";
    }
    const res = await fetch(url, {cache:"no-store"});
    if (!res.ok) throw new Error("تعذر تحميل الرابط. رمز الاستجابة: " + res.status);
    const buffer = await res.arrayBuffer();
    await readExcelFromArrayBuffer(buffer, url.split("/").pop() || "Excel URL");
  } catch (err) {
    if (status) {
      status.className = "status bad";
      status.textContent = "تعذر تحميل Excel من الرابط: " + (err && err.message ? err.message : err);
    } else {
      alert("تعذر تحميل Excel من الرابط: " + (err && err.message ? err.message : err));
    }
  }
}

document.addEventListener("DOMContentLoaded", function(){
  const btn = document.getElementById("loadExcelUrlBtn");
  const input = document.getElementById("excelUrl");
  if (btn) btn.addEventListener("click", loadExcelFromUrl);
  if (input) input.addEventListener("keydown", function(e){
    if (e.key === "Enter") loadExcelFromUrl();
  });
});


/* Safe file upload reader added */
document.addEventListener("DOMContentLoaded", function(){
  const fileInput = document.getElementById("excelUpload");
  if (!fileInput || fileInput.dataset.urlPatchBound === "1") return;
  fileInput.dataset.urlPatchBound = "1";
  fileInput.addEventListener("change", async function(e){
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    // If the original page already handled this event, this second handler will reload the same content safely.
    try {
      const buffer = await file.arrayBuffer();
      await readExcelFromArrayBuffer(buffer, file.name);
    } catch(err) {
      const status = document.getElementById("status");
      if (status && !/تم تحميل|تم اختيار|سؤال/.test(status.textContent || "")) {
        status.className = "status bad";
        status.textContent = "تعذر قراءة ملف Excel: " + (err && err.message ? err.message : err);
      }
    }
  });
});

</script>

  updateExamTimer();
  if(!exam.timerId){exam.timerId=setInterval(()=>{updateExamTimer();if(examRemaining()<=0)finishExam(true);},1000);}
}
function updateExamTimer(){const el=$("examTimer");if(el)el.textContent="⏱ "+secondsToClock(examRemaining());}
function renderExamNav(){

  const frag=document.createDocumentFragment();
  exam.questions.forEach((q,i)=>{const k=examQuestionKey(q);const b=document.createElement("button");b.className="qchip"+(i===exam.index?" active":"")+(exam.answers[k]?" answeredExam":"")+(exam.review[k]?" review":"");b.textContent=i+1;b.title="اختبار - سؤال "+(i+1);b.onclick=()=>{exam.index=i;render();};frag.appendChild(b);});

function renderExamCard(){

  parts.push(`<div class="examTop"><div class="examHeaderLine"><div class="examProgress">اختبار ${exam.questions.length} سؤال — <b>${exam.index+1}</b> / ${exam.questions.length}</div><div class="examTimer" id="examTimer">⏱ ${secondsToClock(examRemaining())}</div></div><div class="examNavHint">لن تظهر الإجابات الصحيحة إلا بعد انتهاء الاختبار.</div></div>`);
  parts.push(`<div class="meta"><div class="metaInfo"><span class="badge">${escapeHtml(FORM_TITLE[q.form]||q.form)}</span><span class="badge">سؤال ${escapeHtml(String(q.id))}</span>${q.lesson?`<span class="badge">${escapeHtml(q.lesson)}</span>`:""}${exam.review[k]?'<span class="badge good">للمراجعة لاحقاً</span>':""}</div></div>`);
  parts.push(`<div class="question">${escapeHtml(q.question)}</div><div class="options">`);
  (q.__examOptions||q.options).forEach(o=>{let cls="option examOption"+(selected===o.key?" selected":"");parts.push(`<button class="${cls}" data-exam-pick="${o.key}"><span class="letter">${escapeHtml(o.letter)}</span><span>${escapeHtml(o.text)}</span></button>`);});
  const reviewCount=Object.keys(exam.review).length;
  parts.push(`</div><div class="examActions"><button class="btn" id="examPrevBtn">السابق</button><button class="btn primary" id="examNextBtn">التالي</button><button class="btn warn ${exam.review[k]?"examReviewFlag":""}" id="examReviewBtn">${exam.review[k]?"إزالة المراجعة":"مراجعة لاحقاً"}</button><button class="btn examReviewJump" id="examNextReviewBtn">الانتقال للمراجعة التالية (${reviewCount})</button><button class="btn bad" id="examFinishBtn">إنهاء الاختبار</button></div>`);
  card.innerHTML=parts.join("");

  $("examPrevBtn").onclick=examPrev; $("examNextBtn").onclick=examNext; $("examReviewBtn").onclick=toggleExamReview; $("examNextReviewBtn").onclick=jumpToNextExamReview; $("examFinishBtn").onclick=()=>finishExam(false);
  updateExamTimer();
}
function examPick(selected){const q=exam.questions[exam.index];if(!q)return;exam.answers[examQuestionKey(q)]={selected,ts:Date.now()};render();}
function examNext(){if(!exam.active||exam.finished)return;exam.index=(exam.index+1)%exam.questions.length;render();}
function examPrev(){if(!exam.active||exam.finished)return;exam.index=(exam.index-1+exam.questions.length)%exam.questions.length;render();}
function toggleExamReview(){const q=exam.questions[exam.index];if(!q)return;const k=examQuestionKey(q);exam.review[k]?delete exam.review[k]:exam.review[k]=true;render();}
function jumpToNextExamReview(){const marked=exam.questions.map((q,i)=>({q,i,k:examQuestionKey(q)})).filter(x=>exam.review[x.k]);if(!marked.length){alert("لا توجد أسئلة معلّمة للمراجعة حالياً.");return;}const next=marked.find(x=>x.i>exam.index)||marked[0];exam.index=next.i;render();}
function finishExam(auto){
  if(!exam.active||exam.finished)return;
  if(!auto){const answeredCount=Object.keys(exam.answers).length;if(!confirm("هل تريد إنهاء الاختبار الآن؟\nتمت الإجابة على "+answeredCount+" من "+exam.questions.length+" سؤال."))return;}
  exam.finished=true;exam.endedAt=Date.now();
  state.examMistakeKeys=examMistakeRows().map(r=>key(r.q));
  save();
  clearInterval(exam.timerId);exam.timerId=null;render();
}
function examResultsData(){
  const lessonMap={}; let correct=0;
  exam.questions.forEach(q=>{const lesson=q.lesson||"بدون درس";const ans=exam.answers[examQuestionKey(q)];const ok=!!ans&&ans.selected===q.answer;if(ok)correct++;if(!lessonMap[lesson])lessonMap[lesson]={total:0,correct:0,wrong:0,unanswered:0};lessonMap[lesson].total++;if(ok)lessonMap[lesson].correct++;else if(ans)lessonMap[lesson].wrong++;else lessonMap[lesson].unanswered++;});
  return {correct,total:exam.questions.length,lessons:lessonMap};
}
function examMistakeRows(){
  return exam.questions.map((q,i)=>{
    const ans=exam.answers[examQuestionKey(q)];
    const selected=ans?.selected||"";
    const correct=selected===q.answer;
    return {q,index:i,selected,correct,unanswered:!selected};
  }).filter(r=>!r.correct);
}
function answerText(q,keyValue){
  if(!keyValue)return "لم تتم الإجابة";
  const o=(q.__examOptions||q.options||[]).find(x=>x.key===keyValue)||(q.options||[]).find(x=>x.key===keyValue);
  return (AR[keyValue]||keyValue)+(o?" - "+o.text:"");
}
function renderMistakeReview(){
  const box=$("examMistakeReview"); if(!box)return;
  const mistakes=examMistakeRows();
  if(!mistakes.length){box.innerHTML='<div class="examResultBox" style="text-align:center;color:var(--good)">ممتاز، لا توجد إجابات خاطئة أو أسئلة غير مجابة.</div>';return;}
  box.innerHTML='<div class="examMistakes">'+mistakes.map((r,n)=>{

  }).join("")+'</div>';
}

function startExamMistakePractice(){
  document.body.classList.remove("examActive");
  const keys=[...new Set(state.examMistakeKeys||[])].filter(k=>QUESTIONS.some(q=>key(q)===k));
  if(!keys.length){alert("لا توجد أخطاء محفوظة من آخر اختبار.");return;}
  view.mode="examMistakes"; view.index=0; view.forceShow=false; view.retry=false;
  view.examMistakeOrder=shuffleArray(keys); view.examMistakeOptionOrder={};
  QUESTIONS.filter(q=>keys.includes(key(q))).forEach(q=>{view.examMistakeOptionOrder[key(q)]=shuffleArray(q.options);});
  const f=$("modeFilter"); if(f)f.value="examMistakes";
  render();
}
function examMistakeQuestions(){
  const set=new Set(state.examMistakeKeys||[]);
  return QUESTIONS.filter(q=>set.has(key(q)));
}
function exportExamMistakes(){
  const list=examMistakeQuestions();
  if(!list.length){alert("لا توجد أخطاء محفوظة من آخر اختبار لتصديرها.");return;}
  if(typeof XLSX==="undefined"){alert("مكتبة Excel غير متاحة حالياً.");return;}
  const rows=list.map(q=>({
    "Form":q.form,
    "Form Title":q.formTitle||FORM_TITLE[q.form]||q.form,
    "Question No.":q.id,
    "Lesson":q.lesson||"",
    "Question":q.question,
    "Option A":q.options.find(o=>o.key==="A")?.text||"",
    "Option B":q.options.find(o=>o.key==="B")?.text||"",
    "Option C":q.options.find(o=>o.key==="C")?.text||"",
    "Option D":q.options.find(o=>o.key==="D")?.text||"",
    "Correct Answer":q.answer
  }));
  const ws=XLSX.utils.json_to_sheet(rows);
  ws['!cols']=[{wch:12},{wch:22},{wch:14},{wch:22},{wch:60},{wch:38},{wch:38},{wch:38},{wch:38},{wch:16}];
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"Exam Mistakes");
  XLSX.writeFile(wb,"exam-mistakes.xlsx");
}

function pick(selected){
  if(exam.active&&!exam.finished){examPick(selected);return;}
  const q=current(); if(!q)return;
  const elapsed=Math.max(0,Math.min(60,60-Number(view.timerLeft||0)));
  const k=key(q), record={selected,correct:selected===q.answer,elapsed,ts:Date.now()};
  if(view.retry&&view.mode==="wrong") view.retryAnswers[k]=record;
  state.answers[k]=record;
  view.forceShow=true; save(); render();
}

function ensureTimer(){

function updateTimer(){
  const txt=$("timerText"), fill=$("timerFill"), box=$("timerBox");
  if(!txt||!fill)return;
  const left=Math.max(0,view.timerLeft);
  txt.textContent=left>0?left+" ثانية":"انتهى الوقت";

  if(box)box.classList.toggle("timerDone",left===0);
}

function cleanHeader(value){return String(value||"").toLowerCase().replace(/[إأآا]/g,"ا").replace(/[ىي]/g,"ي").replace(/ة/g,"ه").replace(/[\s_\-\.]+/g," ").trim();}
function getVal(row,names){
  const wanted=names.map(cleanHeader);
  for(const k of Object.keys(row)){if(wanted.includes(cleanHeader(k)))return row[k];}
  return "";
}
function normalizeAnswer(value){
  const v=String(value||"").trim().toUpperCase();
  const map={"A":"A","B":"B","C":"C","D":"D","1":"A","2":"B","3":"C","4":"D","أ":"A","ا":"A","إ":"A","آ":"A","ب":"B","ج":"C","د":"D"};
  return map[v]||"";
}
function normalizeFormId(value,title){
  let v=String(value||"").trim();
  if(!v&&title)v=String(title||"").trim();
  if(!v)return "form1";
  const m=v.match(/(\d+)/);
  if(m)return "form"+m[1];
  v=v.toLowerCase().replace(/\s+/g,"_").replace(/[^a-z0-9_\u0600-\u06FF]/g,"");
  return v||"form1";
}
function importStatus(text,type){
  const el=$("importStatus");
  if(el){el.textContent=text;el.className="importStatus"+(type?" "+type:"");}
  setText("loadState",QUESTIONS.length?"تم تحميل Excel":"بانتظار ملف Excel");
}
function buildLessonOptions(){

  if(!lessonSelect)return;
  const selected=view.lesson||"all";
  const lessons=[...new Set(QUESTIONS
    .filter(q=>view.form==="all"||q.form===view.form)
    .map(q=>(q.lesson||"").trim())
    .filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ar"));
  lessonSelect.innerHTML='<option value="all">كل الدروس</option>'+lessons.map(l=>`<option value="${escapeHtml(l)}">${escapeHtml(l)}</option>`).join("");
  lessonSelect.value=lessons.includes(selected)?selected:"all";

}

    select.innerHTML='<option value="all">كل النماذج</option>'+forms.map(f=>`<option value="${escapeHtml(f)}">${escapeHtml(FORM_TITLE[f]||f)}</option>`).join("");
    select.value=view.form||"all";
  }
  buildLessonOptions();
  setText("loadState",QUESTIONS.length?"تم تحميل Excel":"بانتظار ملف Excel");

function parseWorkbookRows(rows){
  const parsed=[];
  const titles={};
  rows.forEach((row,idx)=>{
    const qText=String(getVal(row,["Question","السؤال","نص السؤال","Question Text"])||"").trim();
    if(!qText)return;
    const formTitle=String(getVal(row,["Form Title","عنوان النموذج","اسم النموذج","النموذج"])||"").trim();
    const form=normalizeFormId(getVal(row,["Form","form","رقم النموذج","كود النموذج"]),formTitle);
    const idRaw=getVal(row,["Question No.","Question No","Question Number","No","ID","رقم السؤال","رقم"]);
    const id=String(idRaw||idx+1).trim();
    const lesson=String(getVal(row,["Lesson","Category","تصنيف السؤال","الدرس","التصنيف"])||"").trim();
    const optA=String(getVal(row,["Option A","A","الخيار أ","خيار أ","الاختيار أ","Option 1"])||"").trim();
    const optB=String(getVal(row,["Option B","B","الخيار ب","خيار ب","الاختيار ب","Option 2"])||"").trim();
    const optC=String(getVal(row,["Option C","C","الخيار ج","خيار ج","الاختيار ج","Option 3"])||"").trim();
    const optD=String(getVal(row,["Option D","D","الخيار د","خيار د","الاختيار د","Option 4"])||"").trim();
    const answer=normalizeAnswer(getVal(row,["Correct Answer","Answer","Correct","الإجابة الصحيحة","الاجابة الصحيحة","الإجابة","الاجابة"]));
    if(!optA||!optB||!optC||!optD||!answer)return;
    titles[form]=formTitle||form;
    parsed.push({id,form,formTitle:titles[form],lesson,answer,question:qText,options:[
      {key:"A",letter:"أ",text:optA},{key:"B",letter:"ب",text:optB},{key:"C",letter:"ج",text:optC},{key:"D",letter:"د",text:optD}
    ]});
  });
  return {questions:parsed,titles};
}
async function handleExcelUpload(file){
  if(!file)return;
  if(typeof XLSX==="undefined"){importStatus("تعذر تحميل مكتبة قراءة Excel. تأكد من وجود اتصال إنترنت أول مرة أو استخدم نسخة مدمج فيها المكتبة.","bad");return;}
  try{
    importStatus("جاري قراءة الملف: "+file.name,"good");
    const data=await file.arrayBuffer();
    const wb=XLSX.read(data,{type:"array"});
    const sheetName=wb.SheetNames.find(n=>/question|template|اسئ|أسئ/i.test(n))||wb.SheetNames[0];
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[sheetName],{defval:""});
    const result=parseWorkbookRows(rows);
    if(!result.questions.length){importStatus("لم أجد أسئلة صالحة. تأكد من أسماء الأعمدة ومن وجود الخيارات والإجابة الصحيحة.","bad");return;}
    QUESTIONS=result.questions;
    FORM_TITLE=result.titles;
    state={answers:{},stars:{}};
    view.form="all"; view.lesson="all"; view.mode="all"; view.search=""; view.index=0; view.forceShow=false; view.retry=false; view.retryKeys=[]; view.retryAnswers={};
    localStorage.removeItem(STORE_KEY);
    buildDynamicControls();
    importStatus("تم تحميل "+QUESTIONS.length+" سؤال من الملف: "+file.name,"good");
    render();
  }catch(err){console.error(err);importStatus("حدث خطأ أثناء قراءة Excel: "+(err.message||err),"bad");}
}

/* Excel URL loader added */
async function readExcelFromArrayBuffer(arrayBuffer, sourceName){
  if (typeof XLSX === "undefined") {
    throw new Error("مكتبة قراءة Excel غير محملة. تأكد من اتصال الإنترنت أو استخدم نسخة Offline.");
  }
  const workbook = XLSX.read(arrayBuffer, {type:"array"});
  const firstSheetName = workbook.SheetNames[0];
  const sheet = workbook.Sheets[firstSheetName];
  const rows = XLSX.utils.sheet_to_json(sheet, {defval:""});
  if (!rows.length) throw new Error("ملف Excel لا يحتوي على أسئلة.");

  // Use the page's own importer if available.
  if (typeof importRows === "function") {
    importRows(rows, sourceName || "Excel");
    return;
  }
  if (typeof loadQuestionsFromRows === "function") {
    loadQuestionsFromRows(rows, sourceName || "Excel");
    return;
  }
  if (typeof buildQuestionsFromRows === "function") {
    QUESTIONS = buildQuestionsFromRows(rows);
    if (typeof afterExcelLoaded === "function") afterExcelLoaded(sourceName || "Excel");
    else if (typeof render === "function") render();
    return;
  }

  // Generic fallback for the current template columns.
  const pick = (row, names) => {
    for (const n of names) {
      if (row[n] !== undefined && String(row[n]).trim() !== "") return row[n];
    }
    return "";
  };
  const qs = rows.map((row, idx) => {
    const form = String(pick(row, ["Form","form","النموذج","Model"]) || "form1").trim();
    const formTitle = String(pick(row, ["Form Title","formTitle","FormTitle","عنوان النموذج"]) || form || "النموذج").trim();
    const id = Number(pick(row, ["Question No.","Question No","QuestionNo","No","ID","رقم السؤال","السؤال"])) || (idx + 1);
    const lesson = String(pick(row, ["Lesson","lesson","Category","التصنيف","الدرس"]) || "").trim();
    const question = String(pick(row, ["Question","question","نص السؤال","السؤال"]) || "").trim();
    const a = String(pick(row, ["Option A","A","الخيار أ","الخيار A"]) || "").trim();
    const b = String(pick(row, ["Option B","B","الخيار ب","الخيار B"]) || "").trim();
    const c = String(pick(row, ["Option C","C","الخيار ج","الخيار C"]) || "").trim();
    const d = String(pick(row, ["Option D","D","الخيار د","الخيار D"]) || "").trim();
    const answerRaw = pick(row, ["Correct Answer","Answer","correct","الإجابة الصحيحة","الاجابة الصحيحة"]);
    const answer = typeof normalizeAnswer === "function" ? normalizeAnswer(answerRaw) : String(answerRaw || "").trim().toUpperCase();
    return {
      id, form, formTitle, lesson, question, answer,
      options:[
        {key:"A",letter:"أ",text:a},
        {key:"B",letter:"ب",text:b},
        {key:"C",letter:"ج",text:c},
        {key:"D",letter:"د",text:d}
      ]
    };
  }).filter(q => q.question && q.answer && q.options.every(o => o.text));

  if (!qs.length) throw new Error("لم يتم العثور على أسئلة صالحة في Excel.");
  QUESTIONS = qs;

  if (typeof onQuestionsLoaded === "function") onQuestionsLoaded(sourceName || "Excel");
  else {
    const status = document.getElementById("status");
    if (status) {
      status.className = "status good";
      status.textContent = "تم تحميل " + QUESTIONS.length + " سؤال من " + (sourceName || "Excel");
    }
    const loadState = document.getElementById("loadState");
    if (loadState) loadState.textContent = "تم تحميل Excel";
    const totalPill = document.getElementById("totalPill");
    if (totalPill) totalPill.textContent = QUESTIONS.length;
    if (typeof rebuildFormFilter === "function") rebuildFormFilter();
    if (typeof rebuildLessonFilter === "function") rebuildLessonFilter();
    if (typeof saveImportedQuestions === "function") saveImportedQuestions();
    if (typeof render === "function") render();
    if (typeof renderQuestion === "function") renderQuestion();
  }
}

async function loadExcelFromUrl(){
  const input = document.getElementById("excelUrl");
  const status = document.getElementById("status");
  const url = input ? input.value.trim() : "";
  if (!url) {
    if (status) {
      status.className = "status";
      status.textContent = "يرجى إدخال رابط Excel أولاً.";
    }
    return;
  }
  try {
    if (status) {
      status.className = "status";
      status.textContent = "جاري تحميل ملف Excel من الرابط...";
    }
    const res = await fetch(url, {cache:"no-store"});
    if (!res.ok) throw new Error("تعذر تحميل الرابط. رمز الاستجابة: " + res.status);
    const buffer = await res.arrayBuffer();
    await readExcelFromArrayBuffer(buffer, url.split("/").pop() || "Excel URL");
  } catch (err) {
    if (status) {
      status.className = "status bad";
      status.textContent = "تعذر تحميل Excel من الرابط: " + (err && err.message ? err.message : err);
    } else {
      alert("تعذر تحميل Excel من الرابط: " + (err && err.message ? err.message : err));
    }
  }
}

document.addEventListener("DOMContentLoaded", function(){
  const btn = document.getElementById("loadExcelUrlBtn");
  const input = document.getElementById("excelUrl");
  if (btn) btn.addEventListener("click", loadExcelFromUrl);
  if (input) input.addEventListener("keydown", function(e){
    if (e.key === "Enter") loadExcelFromUrl();
  });
});


/* Safe file upload reader added */
document.addEventListener("DOMContentLoaded", function(){
  const fileInput = document.getElementById("excelUpload");
  if (!fileInput || fileInput.dataset.urlPatchBound === "1") return;
  fileInput.dataset.urlPatchBound = "1";
  fileInput.addEventListener("change", async function(e){
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    // If the original page already handled this event, this second handler will reload the same content safely.
    try {
      const buffer = await file.arrayBuffer();
      await readExcelFromArrayBuffer(buffer, file.name);
    } catch(err) {
      const status = document.getElementById("status");
      if (status && !/تم تحميل|تم اختيار|سؤال/.test(status.textContent || "")) {
        status.className = "status bad";
        status.textContent = "تعذر قراءة ملف Excel: " + (err && err.message ? err.message : err);
      }
    }
  });
});


/* iPhone fixed viewport lock */
function lockIphoneViewport(){
  document.body.classList.add("phoneView","iphoneOnly");
  document.documentElement.style.overflowX="hidden";
  document.body.style.overflowX="hidden";
  const app=document.querySelector(".app"),grid=document.querySelector(".grid"),card=document.getElementById("quizCard");
  if(app){app.style.width="100%";app.style.maxWidth="480px";app.style.minWidth="0";app.style.margin="0 auto";app.style.overflowX="hidden";}
  if(grid){grid.style.width="100%";grid.style.maxWidth="100%";grid.style.minWidth="0";grid.style.gridTemplateColumns="minmax(0,1fr)";grid.style.overflowX="hidden";}
  if(card){card.style.width="100%";card.style.maxWidth="100%";card.style.minWidth="0";card.style.overflowX="hidden";}
}
document.addEventListener("DOMContentLoaded",lockIphoneViewport);
window.addEventListener("load",lockIphoneViewport);
window.addEventListener("resize",lockIphoneViewport);
document.addEventListener("click",()=>setTimeout(lockIphoneViewport,30),true);
document.addEventListener("change",()=>setTimeout(lockIphoneViewport,50),true);


/* Stable iPhone viewport guard */
function stabilizeIphoneViewport(){
  document.documentElement.style.overflowX="clip";
  document.body.style.overflowX="clip";
  const app=document.querySelector(".app");
  if(app){
    app.style.width="calc(100dvw - 16px)";
    app.style.maxWidth="calc(100dvw - 16px)";
    app.style.minWidth="0";
  }
  window.scrollTo({left:0,top:window.scrollY,behavior:"instant"});
}
document.addEventListener("DOMContentLoaded",stabilizeIphoneViewport);
window.addEventListener("resize",stabilizeIphoneViewport);
document.addEventListener("click",()=>setTimeout(stabilizeIphoneViewport,20),true);
document.addEventListener("change",()=>setTimeout(stabilizeIphoneViewport,40),true);
