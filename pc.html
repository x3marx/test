<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js">
/* Excel URL loader added */
async function readExcelFromArrayBuffer(arrayBuffer, sourceName){
  if (typeof XLSX === "undefined") {
    throw new Error("مكتبة قراءة Excel غير محملة. تأكد من اتصال الإنترنت أو استخدم نسخة Offline.");
  }
  const workbook = XLSX.read(arrayBuffer, {type:"array"});
  const firstSheetName = workbook.SheetNames[0];
  const sheet = workbook.Sheets[firstSheetName];
  const rows = XLSX.utils.sheet_to_json(sheet, {defval:""});
  if (!rows.length) throw new Error("ملف Excel لا يحتوي على أسئلة.");

  // Use the page's own importer if available.
  if (typeof importRows === "function") {
    importRows(rows, sourceName || "Excel");
    return;
  }
  if (typeof loadQuestionsFromRows === "function") {
    loadQuestionsFromRows(rows, sourceName || "Excel");
    return;
  }
  if (typeof buildQuestionsFromRows === "function") {
    QUESTIONS = buildQuestionsFromRows(rows);
    if (typeof afterExcelLoaded === "function") afterExcelLoaded(sourceName || "Excel");
    else if (typeof render === "function") render();
    return;
  }

  // Generic fallback for the current template columns.
  const pick = (row, names) => {
    for (const n of names) {
      if (row[n] !== undefined && String(row[n]).trim() !== "") return row[n];
    }
    return "";
  };
  const qs = rows.map((row, idx) => {
    const form = String(pick(row, ["Form","form","النموذج","Model"]) || "form1").trim();
    const formTitle = String(pick(row, ["Form Title","formTitle","FormTitle","عنوان النموذج"]) || form || "النموذج").trim();
    const id = Number(pick(row, ["Question No.","Question No","QuestionNo","No","ID","رقم السؤال","السؤال"])) || (idx + 1);
    const lesson = String(pick(row, ["Lesson","lesson","Category","التصنيف","الدرس"]) || "").trim();
    const question = String(pick(row, ["Question","question","نص السؤال","السؤال"]) || "").trim();
    const a = String(pick(row, ["Option A","A","الخيار أ","الخيار A"]) || "").trim();
    const b = String(pick(row, ["Option B","B","الخيار ب","الخيار B"]) || "").trim();
    const c = String(pick(row, ["Option C","C","الخيار ج","الخيار C"]) || "").trim();
    const d = String(pick(row, ["Option D","D","الخيار د","الخيار D"]) || "").trim();
    const answerRaw = pick(row, ["Correct Answer","Answer","correct","الإجابة الصحيحة","الاجابة الصحيحة"]);
    const answer = typeof normalizeAnswer === "function" ? normalizeAnswer(answerRaw) : String(answerRaw || "").trim().toUpperCase();
    return {
      id, form, formTitle, lesson, question, answer,
      options:[
        {key:"A",letter:"أ",text:a},
        {key:"B",letter:"ب",text:b},
        {key:"C",letter:"ج",text:c},
        {key:"D",letter:"د",text:d}
      ]
    };
  }).filter(q => q.question && q.answer && q.options.every(o => o.text));

  if (!qs.length) throw new Error("لم يتم العثور على أسئلة صالحة في Excel.");
  QUESTIONS = qs;

  if (typeof onQuestionsLoaded === "function") onQuestionsLoaded(sourceName || "Excel");
  else {
    const status = document.getElementById("status");
    if (status) {
      status.className = "status good";
      status.textContent = "تم تحميل " + QUESTIONS.length + " سؤال من " + (sourceName || "Excel");
    }
    const loadState = document.getElementById("loadState");
    if (loadState) loadState.textContent = "تم تحميل Excel";
    const totalPill = document.getElementById("totalPill");
    if (totalPill) totalPill.textContent = QUESTIONS.length;
    if (typeof rebuildFormFilter === "function") rebuildFormFilter();
    if (typeof rebuildLessonFilter === "function") rebuildLessonFilter();
    if (typeof saveImportedQuestions === "function") saveImportedQuestions();
    if (typeof render === "function") render();
    if (typeof renderQuestion === "function") renderQuestion();
  }
}

async function loadExcelFromUrl(){
  const input = document.getElementById("excelUrl");
  const status = document.getElementById("status");
  const url = input ? input.value.trim() : "";
  if (!url) {
    if (status) {
      status.className = "status";
      status.textContent = "يرجى إدخال رابط Excel أولاً.";
    }
    return;
  }
  try {
    if (status) {
      status.className = "status";
      status.textContent = "جاري تحميل ملف Excel من الرابط...";
    }
    const res = await fetch(url, {cache:"no-store"});
    if (!res.ok) throw new Error("تعذر تحميل الرابط. رمز الاستجابة: " + res.status);
    const buffer = await res.arrayBuffer();
    await readExcelFromArrayBuffer(buffer, url.split("/").pop() || "Excel URL");
  } catch (err) {
    if (status) {
      status.className = "status bad";
      status.textContent = "تعذر تحميل Excel من الرابط: " + (err && err.message ? err.message : err);
    } else {
      alert("تعذر تحميل Excel من الرابط: " + (err && err.message ? err.message : err));
    }
  }
}

document.addEventListener("DOMContentLoaded", function(){
  const btn = document.getElementById("loadExcelUrlBtn");
  const input = document.getElementById("excelUrl");
  if (btn) btn.addEventListener("click", loadExcelFromUrl);
  if (input) input.addEventListener("keydown", function(e){
    if (e.key === "Enter") loadExcelFromUrl();
  });
});


/* Safe file upload reader added */
document.addEventListener("DOMContentLoaded", function(){
  const fileInput = document.getElementById("excelUpload");
  if (!fileInput || fileInput.dataset.urlPatchBound === "1") return;
  fileInput.dataset.urlPatchBound = "1";
  fileInput.addEventListener("change", async function(e){
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    // If the original page already handled this event, this second handler will reload the same content safely.
    try {
      const buffer = await file.arrayBuffer();
      await readExcelFromArrayBuffer(buffer, file.name);
    } catch(err) {
      const status = document.getElementById("status");
      if (status && !/تم تحميل|تم اختيار|سؤال/.test(status.textContent || "")) {
        status.className = "status bad";
        status.textContent = "تعذر قراءة ملف Excel: " + (err && err.message ? err.message : err);
      }
    }
  });
});

</script>

<body>
<div class="app">
  <header class="hero">
    <div class="box compactHero">
      <div class="heroRow">
        <h1>نظام تدريب بنك الأسئلة</h1>
      </div>
    </div>
  </header>

  <main class="grid">
    <aside class="panel">
      <div class="sectionTitle">تحميل ملف الأسئلة</div>
      <div class="uploadMini">
        <input id="excelUpload" type="file" accept=".xlsx,.xls" hidden>

          <div class="excelUrlBox">
            <label for="excelUrl">أو حمّل Excel من رابط مباشر</label>
            <div class="excelUrlRow">
              <input id="excelUrl" type="url" inputmode="url" placeholder="https://example.com/questions.xlsx">
              <button class="btn primary" id="loadExcelUrlBtn" type="button">تحميل من الرابط</button>
            </div>
            <p class="excelHint">يفضل أن يكون الرابط مباشرًا لملف .xlsx، وأن يسمح الموقع بالتحميل من المتصفح.</p>
          </div>

        <label class="btn primary uploadBtn" for="excelUpload">رفع ملف Excel</label>
        <div id="importStatus" class="importStatus">لم يتم تحميل أي ملف بعد.</div>
      </div>
      <div class="sectionTitle">التحكم</div>
      <div class="field">
        <label for="formFilter">اختر النموذج</label>
        <select id="formFilter">
          <option value="all">كل النماذج</option>
        </select>
      </div>
      <div class="field">
        <label for="lessonFilter">الدرس</label>
        <select id="lessonFilter">
          <option value="all">كل الدروس</option>
        </select>
      </div>
      <div class="field">
        <label for="modeFilter">طريقة العرض</label>
        <select id="modeFilter">
          <option value="all">كل الأسئلة</option>
          <option value="unanswered">غير المجابة</option>
          <option value="wrong">الأخطاء فقط</option>
          <option value="starred">المراجعة لاحقاً</option>
        </select>
      </div>
      <div class="field">
        <label for="searchBox">بحث داخل السؤال أو الخيارات</label>
        <input id="searchBox" type="search" placeholder="اكتب كلمة للبحث...">
      </div>
      <div class="quickControls" aria-label="اختصارات التدريب">
        <button class="btn bad" id="wrongPracticeBtn">تدريب الأخطاء <b id="wrongQuickCount">0</b></button>
        <button class="btn warn" id="reviewPracticeBtn">أسئلة المراجعة لاحقاً <b id="reviewQuickCount">0</b></button>
        <button class="btn" id="allPracticeBtn">عرض كل الأسئلة</button>
      </div>
      <div class="cardActions" style="margin-top:0;margin-bottom:12px">
        <button class="btn" id="prevBtnSide">السابق</button>
        <button class="btn primary" id="nextBtnSide">التالي</button>
      </div>
      <div class="sectionTitle">قائمة الأسئلة</div>
      <div id="questionNav" class="navList"></div>
    </aside>

    <section id="quizCard" class="card"></section>
  </main>
</div>

<nav class="bottomBar">
  <button class="btn" id="prevBtnBottom">السابق</button>
  <button class="btn primary" id="nextBtnBottom">التالي</button>
  <button class="btn" id="showBtnBottom">الإجابة</button>
  <button class="btn" id="randomBtnBottom">عشوائي</button>
</nav>

<script>
let QUESTIONS=[];
const STORE_KEY="arabic_test_bank_all_forms_v2";
const AR={A:"أ",B:"ب",C:"ج",D:"د"};
let FORM_TITLE={};
let state={answers:{},stars:{}};
let view={form:"all",lesson:"all",mode:"all",search:"",index:0,forceShow:false,retry:false,retryKeys:[],retryAnswers:{},layout:localStorage.getItem(STORE_KEY+"_layout")||"desktop",timerKey:"",timerLeft:60,timerId:null};

try{state=Object.assign(state,JSON.parse(localStorage.getItem(STORE_KEY)||"{}"));}catch(e){}
const $=id=>document.getElementById(id);
const key=q=>q.form+":"+q.id;
const norm=s=>(s||"").toString().replace(/[إأآا]/g,"ا").replace(/[ىي]/g,"ي").replace(/ة/g,"ه").replace(/\s+/g," ").trim().toLowerCase();
function save(){localStorage.setItem(STORE_KEY,JSON.stringify(state));}

/* Excel URL loader added */
async function readExcelFromArrayBuffer(arrayBuffer, sourceName){
  if (typeof XLSX === "undefined") {
    throw new Error("مكتبة قراءة Excel غير محملة. تأكد من اتصال الإنترنت أو استخدم نسخة Offline.");
  }
  const workbook = XLSX.read(arrayBuffer, {type:"array"});
  const firstSheetName = workbook.SheetNames[0];
  const sheet = workbook.Sheets[firstSheetName];
  const rows = XLSX.utils.sheet_to_json(sheet, {defval:""});
  if (!rows.length) throw new Error("ملف Excel لا يحتوي على أسئلة.");

  // Use the page's own importer if available.
  if (typeof importRows === "function") {
    importRows(rows, sourceName || "Excel");
    return;
  }
  if (typeof loadQuestionsFromRows === "function") {
    loadQuestionsFromRows(rows, sourceName || "Excel");
    return;
  }
  if (typeof buildQuestionsFromRows === "function") {
    QUESTIONS = buildQuestionsFromRows(rows);
    if (typeof afterExcelLoaded === "function") afterExcelLoaded(sourceName || "Excel");
    else if (typeof render === "function") render();
    return;
  }

  // Generic fallback for the current template columns.
  const pick = (row, names) => {
    for (const n of names) {
      if (row[n] !== undefined && String(row[n]).trim() !== "") return row[n];
    }
    return "";
  };
  const qs = rows.map((row, idx) => {
    const form = String(pick(row, ["Form","form","النموذج","Model"]) || "form1").trim();
    const formTitle = String(pick(row, ["Form Title","formTitle","FormTitle","عنوان النموذج"]) || form || "النموذج").trim();
    const id = Number(pick(row, ["Question No.","Question No","QuestionNo","No","ID","رقم السؤال","السؤال"])) || (idx + 1);
    const lesson = String(pick(row, ["Lesson","lesson","Category","التصنيف","الدرس"]) || "").trim();
    const question = String(pick(row, ["Question","question","نص السؤال","السؤال"]) || "").trim();
    const a = String(pick(row, ["Option A","A","الخيار أ","الخيار A"]) || "").trim();
    const b = String(pick(row, ["Option B","B","الخيار ب","الخيار B"]) || "").trim();
    const c = String(pick(row, ["Option C","C","الخيار ج","الخيار C"]) || "").trim();
    const d = String(pick(row, ["Option D","D","الخيار د","الخيار D"]) || "").trim();
    const answerRaw = pick(row, ["Correct Answer","Answer","correct","الإجابة الصحيحة","الاجابة الصحيحة"]);
    const answer = typeof normalizeAnswer === "function" ? normalizeAnswer(answerRaw) : String(answerRaw || "").trim().toUpperCase();
    return {
      id, form, formTitle, lesson, question, answer,
      options:[
        {key:"A",letter:"أ",text:a},
        {key:"B",letter:"ب",text:b},
        {key:"C",letter:"ج",text:c},
        {key:"D",letter:"د",text:d}
      ]
    };
  }).filter(q => q.question && q.answer && q.options.every(o => o.text));

  if (!qs.length) throw new Error("لم يتم العثور على أسئلة صالحة في Excel.");
  QUESTIONS = qs;

  if (typeof onQuestionsLoaded === "function") onQuestionsLoaded(sourceName || "Excel");
  else {
    const status = document.getElementById("status");
    if (status) {
      status.className = "status good";
      status.textContent = "تم تحميل " + QUESTIONS.length + " سؤال من " + (sourceName || "Excel");
    }
    const loadState = document.getElementById("loadState");
    if (loadState) loadState.textContent = "تم تحميل Excel";
    const totalPill = document.getElementById("totalPill");
    if (totalPill) totalPill.textContent = QUESTIONS.length;
    if (typeof rebuildFormFilter === "function") rebuildFormFilter();
    if (typeof rebuildLessonFilter === "function") rebuildLessonFilter();
    if (typeof saveImportedQuestions === "function") saveImportedQuestions();
    if (typeof render === "function") render();
    if (typeof renderQuestion === "function") renderQuestion();
  }
}

async function loadExcelFromUrl(){
  const input = document.getElementById("excelUrl");
  const status = document.getElementById("status");
  const url = input ? input.value.trim() : "";
  if (!url) {
    if (status) {
      status.className = "status";
      status.textContent = "يرجى إدخال رابط Excel أولاً.";
    }
    return;
  }
  try {
    if (status) {
      status.className = "status";
      status.textContent = "جاري تحميل ملف Excel من الرابط...";
    }
    const res = await fetch(url, {cache:"no-store"});
    if (!res.ok) throw new Error("تعذر تحميل الرابط. رمز الاستجابة: " + res.status);
    const buffer = await res.arrayBuffer();
    await readExcelFromArrayBuffer(buffer, url.split("/").pop() || "Excel URL");
  } catch (err) {
    if (status) {
      status.className = "status bad";
      status.textContent = "تعذر تحميل Excel من الرابط: " + (err && err.message ? err.message : err);
    } else {
      alert("تعذر تحميل Excel من الرابط: " + (err && err.message ? err.message : err));
    }
  }
}

document.addEventListener("DOMContentLoaded", function(){

  if (btn) btn.addEventListener("click", loadExcelFromUrl);
  if (input) input.addEventListener("keydown", function(e){
    if (e.key === "Enter") loadExcelFromUrl();

});

document.addEventListener("DOMContentLoaded", function(){
  const fileInput = document.getElementById("excelUpload");
  if (!fileInput || fileInput.dataset.urlPatchBound === "1") return;
  fileInput.dataset.urlPatchBound = "1";
  fileInput.addEventListener("change", async function(e){
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    // If the original page already handled this event, this second handler will reload the same content safely.
    try {
      const buffer = await file.arrayBuffer();
      await readExcelFromArrayBuffer(buffer, file.name);
    } catch(err) {
      const status = document.getElementById("status");
      if (status && !/تم تحميل|تم اختيار|سؤال/.test(status.textContent || "")) {
        status.className = "status bad";
        status.textContent = "تعذر قراءة ملف Excel: " + (err && err.message ? err.message : err);
      }
    }
  });
});

</script>
</body>
</html>
