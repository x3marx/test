d":"set4"},{"id":"302","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"C","question":"أيّ من العبارات التالية بخصوص الاستعانة الكاملة بمصادر خارجية لنشاط التدقيق الداخلي دقيقة؟","options":[{"key":"A","letter":"أ","text":"تكون أكثر فعالية من حيث التكلفة مقارنة بالحفاظ على فريق تدقيق داخلي داخلي."},{"key":"B","letter":"ب","text":"تكون عادةً أكثر ملاءمة للمنظمات الكبيرة ذات المواقع المتعددة والعمليات المتنوعة."},{"key":"C","letter":"ج","text":"لا تزال تتضمن مورد اتصال داخلي مُعيّنًا يتحمل مسؤولية نشاط التدقيق الداخلي."},{"key":"D","letter":"د","text":"تُفضَّل عندما يمكن شراء خدمات التدقيق الخارجي والداخلي من نفس المزوّد."}],"bankIndex":302,"setId":"set4"},{"id":"303","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"A","question":"تتلقى منظمة فاتورة كهرباء على أساس ربع سنوي. يمكن التحقق من دقة مخصص مصروف الكهرباء في نهاية الشهر باستخدام أيّ من تقنيات التدقيق التالية؟","options":[{"key":"A","letter":"أ","text":"إعادة تنفيذ احتساب المخصص."},{"key":"B","letter":"ب","text":"مطابقة المخصص مع فاتورة الكهرباء."},{"key":"C","letter":"ج","text":"الحصول على تأكيد خارجي بمبلغ المخصص."},{"key":"D","letter":"د","text":"الحصول على إقرار من الإدارة بالدقة."}],"bankIndex":303,"setId":"set4"},{"id":"304","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"D","question":"في إطار معالجة مخاطر الأمن السيبراني الناشئة، يطلب مجلس الإدارة من الرئيس التنفيذي للتدقيق (CAE) تنفيذ تدقيق نظم معلومات. إلا أن نشاط التدقيق الداخلي يفتقر نسبيًا إلى الخبرة في هذا المجال. أيّ الإجراءات التالية يجب على CAE اتخاذها؟","options":[{"key":"A","letter":"أ","text":"رفض المهمة، لأن نشاط التدقيق الداخلي لا يمتلك الكفاءات المطلوبة لتنفيذ المهمة."},{"key":"B","letter":"ب","text":"تأجيل المهمة إلى أن يتم تزويد نشاط التدقيق الداخلي بعدد كافٍ من الموظفين لتنفيذ المهمة."},{"key":"C","letter":"ج","text":"تنفيذ تدريب أثناء العمل لموظفي التدقيق الداخلي الحاليين إلى أن يكتسبوا خبرة كافية لتنفيذ المهمة."},{"key":"D","letter":"د","text":"تقديم توصية مكتوبة إلى مجلس الإدارة للحصول على موافقة للاستعانة بموظفين أكفاء من خلال الاستعانة بمصادر خارجية."}],"bankIndex":304,"setId":"set4"},{"id":"305","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"D","question":"تخطط مدققة داخلية لارتباط في وحدة إنتاج حبيبات الخشب. وتراجع الميزانية العمومية وتلاحظ كميات كبيرة من حبيبات الخشب المنتجة للبيع. كما تعلم بحدوث حريق عرضي قبل بضعة أشهر أدى إلى أضرار في البضائع المنتجة. أيّ مما يلي يُعد الطريقة الأنسب للتحقق مما إذا كانت كميات الكريات المسجلة في الميزانية العمومية صحيحة؟","options":[{"key":"A","letter":"أ","text":"إرسال استفسار إلى مديري وحدة إنتاج الحبيبات وطلب الرد السريع في شكل خطاب تأكيد موقّع."},{"key":"B","letter":"ب","text":"مراجعة أحجام إنتاج الحبيبات الشهرية وإجراء اختبار معقولية لتقييم ما إذا كانت الكمية المسجلة معقولة، مع الأخذ في الاعتبار خسائر المخزون الناتجة عن الحريق."},{"key":"C","letter":"ج","text":"طلب بيانات عن حبيبات الخشب المباعة والمنتجة وتحليل ما إذا كان الفرق يتطابق مع الميزانية العمومية."},{"key":"D","letter":"د","text":"إجراء فحص مادي مفاجئ وجرد لحبيبات الخشب في موقع الإنتاج."}],"bankIndex":305,"setId":"set4"},{"id":"306","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"D","question":"أيّ من العبارات التالية تنطبق على أفضل وجه على ملاحظات التدقيق التي يتم النظر في إدراجها في تقرير التدقيق النهائي؟","options":[{"key":"A","letter":"أ","text":"تتطلب ملاحظات التدقيق المبلّغ عنها تصنيفًا للتدقيق."},{"key":"B","letter":"ب","text":"سيقوم مجلس الإدارة بمتابعة الملاحظات بشكل منفصل."},{"key":"C","letter":"ج","text":"تكون ملاحظات التدقيق المبلّغ عنها معفاة من تواريخ الاستحقاق."},{"key":"D","letter":"د","text":"يجب أن تستمر ملاحظات التدقيق المبلّغ عنها في الظهور في التقارير المؤقتة."}],"bankIndex":306,"setId":"set4"},{"id":"307","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"C","question":"يقوم مشرف مهمة جديد بالتخطيط لمهمة تأكيدية ويناقش برنامج عمل الارتباط مع فريق التدقيق. ونظرًا لأن الجهة المراد تدقيقها معقدة وتحتوي على العديد من المخاطر المحتملة، تقرر لأسباب تتعلق بالكفاءة عدم تصميم إجراءات تدقيق محددة، وبدلًا من ذلك البدء في تنفيذ الارتباط ورؤية ما يمكن اكتشافه. أيّ العبارات التالية صحيحة بخصوص هذا الأسلوب؟","options":[{"key":"A","letter":"أ","text":"من فوائد هذا الأسلوب أنه يساعد على تحقيق نطاق التدقيق، خصوصًا عند مراجعة مجالات معقدة."},{"key":"B","letter":"ب","text":"فائدة هذا الأسلوب أنه يضمن تحديد جميع أوجه القصور في الضوابط."},{"key":"C","letter":"ج","text":"من مخاطر هذا الأسلوب الفشل في تحقيق أهداف التدقيق."},{"key":"D","letter":"د","text":"الخطر الرئيسي لهذا الأسلوب هو غياب المساءلة عن فريق التدقيق."}],"bankIndex":307,"setId":"set4"},{"id":"308","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"C","question":"ملاحظة تدقيق جوهرية تم اكتشافها خلال ارتباط قبل بضعة أشهر. وكان المدير (CAE) يتابع رئيس تنفيذي للتدقيق التشغيلي قد وافق في البداية على تنفيذ إجراءات تصحيحية لتخفيف المخاطر. إلا أن المدير يصرّ ح الآن بأنها قررت قبول يعتقد أن قبول المخاطر لا يقع ضمن مستوى تحمل المخاطر في CAE المخاطر ولن تنفذ أي ضوابط إضافية. وإذا كان ال المنظمة، فما هي الخطوة التالية الأنسب له؟","options":[{"key":"A","letter":"أ","text":"توثيق قرار الإدارة بقبول المخاطر وإغلاق ملاحظة التدقيق المفتوحة."},{"key":"B","letter":"ب","text":"تخفيض تصنيف المخاطر لملاحظة التدقيق، لأن المدير لم يعد يرى ضرورة لاتخاذ إجراء تصحيحي."},{"key":"C","letter":"ج","text":"تصعيد الحالة إلى الإدارة العليا."},{"key":"D","letter":"د","text":"إبلاغ مجلس الإدارة فورًا لحل المسألة."}],"bankIndex":308,"setId":"set4"},{"id":"309","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"A","question":"وفقًا للمعايير، أيّ العبارات التالية صحيحة بخصوص محتوى وتنظيم وشكل أوراق عمل المهمة؟","options":[{"key":"A","letter":"أ","text":"تختلف عمومًا باختلاف المنظمة وطبيعة الارتباط (المهمة)."},{"key":"B","letter":"ب","text":"تختلف عمومًا حسب الصناعة، ويتم تحديد الإرشادات الخاصة بها من قبل IIA."},{"key":"C","letter":"ج","text":"تختلف عمومًا حسب الدولة، ويجب أن يتم تحديد طبيعتها من قبل الحكومات المحلية."},{"key":"D","letter":"د","text":"يجب أن يتم وضعها من قبل مساهمي المنظمة."}],"bankIndex":309,"setId":"set4"},{"id":"310","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"A","question":"خلال ارتباط تأكيدي، تم اكتشاف أن مياه التبريد من مرافق الإنتاج يتم ضخها إلى بحيرة محلية دون ترشيح. وأقرت الإدارة المحلية بالمخالفة البيئية، وادعت أنها كانت حادثًا عرضيًا، وتعهدت بالاستجابة الفورية. وبعد بضعة أسابيع، تلقى الرئيس التنفيذي للتدقيق (CAE) اتصالًا مجهولًا وتعلم أن شيئًا لم يتغير في موقع الإنتاج. أيّ الخطوات التالية هي الأنسب التي يجب على CAE اتخاذها؟","options":[{"key":"A","letter":"أ","text":"التأكد من إدراج ارتباط تدقيق متابعة ضمن خطة التدقيق الداخلي السنوية القادمة."},{"key":"B","letter":"ب","text":"أي خيار ممكن ان يكون موجود"},{"key":"C","letter":"ج","text":"أي خيار ممكن ان يكون موجود"},{"key":"D","letter":"د","text":"أي خيار ممكن ان يكون موجود"}],"bankIndex":310,"setId":"set4"},{"id":"311","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"C","question":"كيف تختلف المراقبة المستمرة عن التدقيق المستمر؟","options":[{"key":"A","letter":"أ","text":"تعالج المراقبة المستمرة أوجه القصور في المعاينة، بينما لا يفعل ذلك التدقيق المستمر."},{"key":"B","letter":"ب","text":"تقوم المراقبة المستمرة بتكميم القضايا الأساسية بشكل أفضل من التدقيق المستمر."},{"key":"C","letter":"ج","text":"يتم تنفيذ المراقبة المستمرة بواسطة الإدارة، بينما لا يتم تنفيذ التدقيق المستمر بواسطة الإدارة."},{"key":"D","letter":"د","text":"تحدد المراقبة المستمرة مصادر الشذوذ، بينما لا يفعل ذلك التدقيق المستمر."}],"bankIndex":311,"setId":"set4"},{"id":"312","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"C","question":"يراجع مدقق داخلي فواتير الموردين للتحقق من دقتها. وحدد المدقق حالة تم فيها دفع مبلغ زائد لأحد الموردين. وشرح مدير الحسابات الدائنة أنه تم لاحق ا إصدار إشعار خصم على المورد وتم استرداد المبلغ الزائد. وتأكد المدقق من أن المبلغ المسترد كان دقيقًا. أيّ من التقنيات التالية استخدمها المدقق؟","options":[{"key":"A","letter":"أ","text":"الملاحظة."},{"key":"B","letter":"ب","text":"الفحص."},{"key":"C","letter":"ج","text":"المطابقة (المراجعة المستندية)."},{"key":"D","letter":"د","text":"التتبع."}],"bankIndex":312,"setId":"set4"},{"id":"313","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"A","question":"أيّ من أنواع الارتباطات الاستشارية التالية هو الأنسب لتقييم المخاطر المتأصلة والمتبقية في المنظمة؟","options":[{"key":"A","letter":"أ","text":"التقييمات الذاتية للمخاطر والضوابط."},{"key":"B","letter":"ب","text":"تحسين العمليات التجارية."},{"key":"C","letter":"ج","text":"التدريب على الرقابة الداخلية."},{"key":"D","letter":"د","text":"مراجعة الرقابة الداخلية."}],"bankIndex":313,"setId":"set4"},{"id":"314","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"B","question":"أثناء مراجعة ورقة عمل، لاحظ مشرف الارتباط معاملة مشكوكًا فيها. وأراد معرفة المزيد عن المعاملة، فقرر الذهاب إلى المصدر الذي حصل منه المدقق الداخلي على معلومات المعاملة. أيّ العناصر التالية، الموثقة في ورقة العمل، ستوجه المشرف على أفضل وجه للحصول على مزيد من المعلومات حول المعاملة المشكوك فيها؟","options":[{"key":"A","letter":"أ","text":"رقم المستند، ونوع المعاملة، وتاريخ تقديم المعلومات."},{"key":"B","letter":"ب","text":"اسم المستند، واسم الشخص الذي قدم المستند، وتاريخ تقديم المعلومات."},{"key":"C","letter":"ج","text":"نوع المعاملة، وغرض المعاملة، وتاريخ حدوث المعاملة."},{"key":"D","letter":"د","text":"اسم القسم، ونوع المعاملة، وغرض المعاملة."}],"bankIndex":314,"setId":"set4"},{"id":"315","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"C","question":"ما هو المصدر الأكثر فائدة لتخطيط مهمة مراجعة لقسم الموارد البشرية؟","options":[{"key":"A","letter":"أ","text":"تقارير إدارة الموارد البشرية."},{"key":"B","letter":"ب","text":"مقابلة مع رئيس قسم الموارد البشرية."},{"key":"C","letter":"ج","text":"تقييم ذاتي للمخاطر والضوابط."},{"key":"D","letter":"د","text":"سير العمل الموثقة."}],"bankIndex":315,"setId":"set4"},{"id":"316","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"B","question":"اكتشف مدقق داخلي أن المعدات المستخدمة لمراقبة جودة الهواء لم يتم صيانتها وفقًا لجدول الصيانة المعتمد. وإذا لم تتم معالجة هذه المشكلة، فقد لا توفر المعدات معلومات دقيقة عن مستويات الملوثات، مما قد يؤدي إلى عقوبات تنظيمية وضرر بالسمعة. ناقش المدقق المشكلة مع كل من المدير المسؤول والرئيس التنفيذي، اللذين أوضحا أنهما يفهمان المخاطر، ولكن أصبحت تكلفة صيانة المعدات وفق الجدول مرتفعة جداً. في هذه الحالة، ماذا ينبغي على الرئيس التنفيذي للتدقيق أن يفعل؟","options":[{"key":"A","letter":"أ","text":"إضافة قيمة للمنظمة من خلال اتخاذ مبادرة وتنفيذ إجراءات تصحيحية للتخفيف من المخاطر المحددة."},{"key":"B","letter":"ب","text":"إبلاغ المجلس بالوضع الحالي، بما في ذلك تعرض المنظمة للمخاطر."},{"key":"C","letter":"ج","text":"مناقشة الأمر مع المدققين الخارجيين وطلب إقناع الإدارة بمعالجة المشكلة."},{"key":"D","letter":"د","text":"الاتصال بالجهة التنظيمية وإبلاغها بتعرض المنظمة للمخاطر."}],"bankIndex":316,"setId":"set4"},{"id":"317","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"C","question":"ما العاملان الرئيسيان اللذان يتم أخذهما في الاعتبار أثناء تقييم المخاطر؟","options":[{"key":"A","letter":"أ","text":"الخسائر المالية المحتملة والتغييرات الأخيرة في العمليات."},{"key":"B","letter":"ب","text":"احتمال حدوث الاحتيال والمخاطر المالية المحتملة."},{"key":"C","letter":"ج","text":"أثر حدث المخاطر واحتمال وقوعه."},{"key":"D","letter":"د","text":"الخسائر المالية المحتملة وتعقيد العملية."}],"bankIndex":317,"setId":"set4"},{"id":"318","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"C","question":"تتعاقد منظمة مع شركة تدقيق تقنية معلومات خارجية لمساعدة نشاط التدقيق الداخلي في تنفيذ مراجعة اختبار اختراق الشبكة. أيٌّ من الأطراف التالية يتحمل المسؤولية الإجمالية عن هذه المهمة؟","options":[{"key":"A","letter":"أ","text":"الإدارة التي تعاقدت مع الطرف الثالث."},{"key":"B","letter":"ب","text":"مشرف مهمة فريق التدقيق التابع للطرف الثالث."},{"key":"C","letter":"ج","text":"الرئيس التنفيذي للتدقيق."},{"key":"D","letter":"د","text":"لجنة التدقيق التابعة لمجلس الإدارة."}],"bankIndex":318,"setId":"set4"},{"id":"319","f قيق؟","options":[{"key":"A","letter":"أ","text":"يجب أن يقتصر فقط على اجتماع البدء واجتماع الخروج، لحماية موضوعية فريق التدقيق."},{"key":"B","letter":"ب","text":"يجب أن يحدث فقط عند تحديد مشكلات، للتحقق من وجودها وتأثيرها."},{"key":"C","letter":"ج","text":"يجب أن يكون مستمراً طوال المهمة، لضمان الدقة والشفافية."},{"key":"D","letter":"د","text":"يجب أن يتم في نقاط زمنية محددة مسبقا، ً لضمان بقاء المهمة ضمن الجدول الزمني."}],"bankIndex":333,"setId":"set4"},{"id":"334","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"D","question":"كان فريق تطوير المشاريع في إحدى المنظمات يواجه صعوبة في إدارة تكاليف المشاريع، لذلك قام مشرف مهمة التدقيق الداخلي بمشاركة حل مع فريق المشروع ودربهم على كيفية استخدام الصيغ واستخراج البيانات من نظام التقارير المالية. وكان الحل عبارة عن جدول رقابة آلي للتكاليف يتيح تحديث تكاليف تطوير المشروع بشكل فوري. أيٌّ مما يلي يصف النشاط الذي تم تقديمه بشكل أفضل؟","options":[{"key":"A","letter":"أ","text":"مراجعة الرقابة الداخلية."},{"key":"B","letter":"ب","text":"تدريب على الرقابة الداخلية."},{"key":"C","letter":"ج","text":"تقييم ذاتي للرقابة."},{"key":"D","letter":"د","text":"مراقبة مستمرة."}],"bankIndex":334,"setId":"set4"},{"id":"335","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"C","question":"وفقًا لإرشادات معهد المدققين الداخليين (IIA)، أيٌّ مما يلي يُعد من مسؤوليات الرئيس التنفيذي للتدقيق فيما يتعلق بالمخاطر المتبقية في المنظمة؟","options":[{"key":"A","letter":"أ","text":"مراجعة وتحديث سياسة إدارة المخاطر في المنظمة."},{"key":"B","letter":"ب","text":"تحديد مستوى المخاطر المقبولة تنظيمياً."},{"key":"C","letter":"ج","text":"إنشاء والحفاظ على أنظمة لمتابعة التقدم في الإجراءات التي اتخذتها الإدارة."},{"key":"D","letter":"د","text":"التشاور مع المدقق الخارجي بشأن كيفية تقييم المخاطر المتبقية."}],"bankIndex":335,"setId":"set4"},{"id":"336","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"B","question":"طلبت مديرة خدمة العملاء من رئيس التدقيق الداخلي (CAE) معرفة ما إذا كان بإمكان المدققين الداخليين مساعدة موظفيها في إجراء تقييم ذاتي للمخاطر (Risk Self-Assessment) في إدارة خدمة العملاء. ووعد رئيس التدقيق الداخلي بعقد اجتماعات مع مديري خدمة العملاء، وتحليل العمليات التجارية ذات الصلة، ثم إعداد مقترح لتنفيذ المهمة. من هو الشخص الأكثر احتمالًا لأن يكون صاحب الموافقة النهائية على أهداف ونطاق هذه المهمة؟","options":[{"key":"A","letter":"أ","text":"الإدارة العليا في المنظمة."},{"key":"B","letter":"ب","text":"(Chief Audit Executive - CAE). رئيس التدقيق الداخلي"},{"key":"C","letter":"ج","text":"مديرة خدمة العملاء."},{"key":"D","letter":"د","text":"مجلس الإدارة."}],"bankIndex":336,"setId":"set4"},{"id":"337","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"D","question":"أيّ مما يلي يصف بشكل أفضل كيف يستخدم المدقق الداخلي مخطط التدفق انسيابي أثناء مرحلة تخطيط مهمة التدقيق؟","options":[{"key":"A","letter":"أ","text":"للتحضير لاختبار مدى فاعلية إجراءات الرقابة."},{"key":"B","letter":"ب","text":"للتخطيط لتقييم الخسائر المحتملة."},{"key":"C","letter":"ج","text":"لإعداد خطة أخذ العينات لمهمة التدقيق."},{"key":"D","letter":"د","text":"لتقييم تصميم إجراءات الرقابة (الضوابط)."}],"bankIndex":337,"setId":"set4"},{"id":"338","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"C","question":"تقوم شركة المدقق بعمل اندماج مع شركة متوسطة الحجم وطلب من المدقق فحص الضوابط الخاصة بالاندماج ما هي العملية التي سيقوم بها المدقق؟","options":[{"key":"A","letter":"أ","text":"مهمة تشغيلية"},{"key":"B","letter":"ب","text":"مهمة امتثال"},{"key":"C","letter":"ج","text":"مهمة العناية اللازمة (منافية للجهالة)"},{"key":"D","letter":"د","text":"مهمة مالية"}],"bankIndex":338,"setId":"set4"},{"id":"339","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"D","question":"أيّ مما يلي يمثل بشكل معقول أفضل الممارسات المتعلقة بمستوى استثمار موارد التدقيق الداخلي في مراقبة ومتابعة نتائج مهام التدقيق؟","options":[{"key":"A","letter":"أ","text":"يجب استخدام موارد محدودة نظرًا لأن مهمة التدقيق الفعلية قد اكتملت بالفعل، وتقع مسؤولية الإجراءات التصحيحية ع ","question":"أي من المعلومات التالية هي الأكثر ملاءمةً لمسؤول التدقيق الرئيسي لمشاركتها عند تنسيق خطط التدقيق الداخلي مع مدققي الضمان الداخلي والخارجي؟","options":[{"key":"A","letter":"أ","text":"نطاق الأهداف والتوقيت على مستوى عالٍ لدعم التنسيق مع الالتزام بالمتطلبات السرية."},{"key":"B","letter":"ب","text":"لا ينبغي مشاركة أي معلومات مع مدققي الخدمات الداخليين والخارجيين لأنها قد تؤدي إلى تحيز في نتائج المهمة."},{"key":"C","letter":"ج","text":"المجال وتوقيت مهمة التدقيق لفصل سابق وتجنب تكرار المصالح."},{"key":"D","letter":"د","text":"جميع معلومات الخطة، بما في ذلك تقييمات المخاطر والاختبارات المخطط لها ونتائج السابقة لتعظيم فرصة التنسيق مع مدققي الخدمات الداخليين والخارجيين"}],"bankIndex":345,"setId":"set4"},{"id":"346","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"A","question":"لتوصيل (للإبلاغ بفعالية عن) قبول المخاطر في منظمة بشكل فعال، يجب على المدير التنفيذي للتدقيق أن يفكر أولاً في أي مما يلي؟","options":[{"key":"A","letter":"أ","text":"وجهة نظر (راي) المنظمة بشأن تحمل المخاطر"},{"key":"B","letter":"ب","text":"الأحداث الرئيسية للمخاطر في المنظمة."},{"key":"C","letter":"ج","text":"استراتيجيات استجابة المنظمة للمخاطر"},{"key":"D","letter":"د","text":"أنشطة التحكم الرئيسية في المنظمة."}],"bankIndex":346,"setId":"set4"},{"id":"347","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"A","question":"ما الذي يجب أن يركز عليه قسم التأثير في وثيقة الملاحظات الأولية؟","options":[{"key":"A","letter":"أ","text":"المخاطر المتبقية"},{"key":"B","letter":"ب","text":"المخاطر المتأصلة"},{"key":"C","letter":"ج","text":"الضوابط التعويضية"},{"key":"D","letter":"د","text":"أنشطة السيطرة"}],"bankIndex":347,"setId":"set4"},{"id":"348","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"C","question":"أي مما يلي هو الأكثر احتمالاً أن يتم الحكم عليه بأنه مخاطر متبقية كبيرة تتجاوز المستوى المقبول للمخاطر في المنظمة؟","options":[{"key":"A","letter":"أ","text":"أي مخاطر تتعلق بالتوسع التنظيمي في منطقة جغرافية جديدة ذات بيئة سياسية غير مستقرة."},{"key":"B","letter":"ب","text":"أي مخاطر تتعلق بالاستثمارات في بيتكوين والمشتقات المشبوهة"},{"key":"C","letter":"ج","text":"أي مخاطر يمكن أن تسبب خسائر مادية أو مالية"},{"key":"D","letter":"د","text":"أي مخاطر يمكن أن تسبب إصابات أو تلوث البيئة"}],"bankIndex":348,"setId":"set4"},{"id":"349","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"D","question":"يدفع قرار الاندماج بين الشركات الرئيس التنفيذي للتدقيق (CAE) إلى اقتراح تغييرات مؤقتة على خطة التدقيق السنوية الحالية لمواجهة المخاطر الناشئة. أي مما يلي هو الإجراء الأنسب الذي يتخذه CAE فيما يتعلق بالتغييرات التي تم إجراؤها على خطة التدقيق؟","options":[{"key":"A","letter":"أ","text":"تقديم خطة التدقيق المنقحة مباشرة إلى مجلس الإدارة للموافقة عليها."},{"key":"B","letter":"ب","text":"التواصل مع المدير المالي وعرض خطة التدقيق المنقحة على الرئيس التنفيذي للموافقة عليها"},{"key":"C","letter":"ج","text":"تقديم خطة التدقيق المنقحة مباشرة إلى الرئيس التنفيذي للموافقة عليها"},{"key":"D","letter":"د","text":"التواصل مع الرئيس التنفيذي وعرض خطة التدقيق المنقحة على مجلس الإدارة للموافقة عليها"}],"bankIndex":349,"setId":"set4"},{"id":"350","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"D","question":"وفقًا لإرشادات معهد المدققين الداخليين (IIA)، أي من التصريحات التالية فيما يتعلق بأوراق عمل التدقيق صحيحة؟","options":[{"key":"A","letter":"أ","text":"يجب أن تتضمن التقارير التفتيشية أوراق العمل كمرجع لاستنتاجات التدقيق."},{"key":"B","letter":"ب","text":"تعد أوراق عمل المدقق الداخلي المرجع الأساسي لعيوب الرقابة المبلغ عنها."},{"key":"C","letter":"ج","text":"يجب استبعاد الاتصالات المحددة مع إدارة المجال قيد المراجعة من أوراق العمل."},{"key":"D","letter":"د","text":"يجب حفظ الإصدارات المسودة والنهائية لأوراق العمل في نهاية المشاركة."}],"bankIndex":350,"setId":"set4"},{"id":"351","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"B","question":"يرغب المدقق الداخلي في مقارنة معلومات الأداء من ربع إلى آخر. أي إجراء تحليلي سيستخدم المراجع؟","options":[{"key":"A","letter":"أ","text":"تحليل النسب."},{"key":"B","letter":"ب","text":"تحليل الاتجاه (Trend)."},{"key":"C","letter":"ج","text":"التحليل الرأسي."},{"key":"D","letter":"د","text":"تحليل معياري."}],"bankIndex":351,"setId":"set4"},{"id":"352","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"D","question":"أراد مدقق داخلي تحديد ما إذا كان موظفو المنظمة البالغ عددهم 200 موظف يفرضون ساعات عملهم بدقة على المشروع الصحيح. اختار المدقق الداخلي عينة من 30 تقرير وقت للموظفين للاختبار. بناءً على الاختبار، حدد المدقق الداخلي ما يلي: 5 -تقارير وقت غير صحيحة. 21 -تقرير وقت صحيح. 4 تقارير وقت غير معتمدة. أي مما يلي نتيجة صحيحة؟","options":[{"key":"A","letter":"أ","text":"تعاني المنظمة من عيوب كبيرة في الإبلاغ عن وقت الموظفين، مما قد يؤدي إلى المبالغة في تكاليف عمالة المشروع. يمكن أن يؤدي فشل المنظمة في الإبلاغ عن وقت الموظفين بدقة وكامله إلى حدوث غش محتمل وإساءة استخدام."},{"key":"B","letter":"ب","text":"تحتاج المنظمة إلى التأكد من أن جميع تقارير وقت الموظفين دقيقة وكاملة لكل من مشاريعها. من خلال القيام بذلك، يمكن للمنظمة تقليل المشكلات المحتملة المتعلقة بالمبالغة في وقت الموظفين وتكاليف مشروع العمل."},{"key":"C","letter":"ج","text":"بالغت المنظمة في تكاليف المشروع بسبب الإبلاغ غير الدقيق وغير الكامل عن وقت الموظفين المشحون على الحسابات المتأثرة. نتيجة لذلك، لا يمكن للمنظمة ضمان الإبلاغ الدقيق عن تكاليف المشروع لأصحاب المصلحة."},{"key":"D","letter":"د","text":"بشكل عام، تضمن المنظمة أن ساعات العمل التي يتم تحميلها على كل مشروع دقيقة وكاملة. ومع ذلك، كانت هناك حالات لتقارير وقت الموظفين غير صحيحة أو غير مدعومة لتبرير تكاليف العمل المتعددة للمشروع."}],"bankIndex":352,"setId":"set4"},{"id":"353","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"C","question":"وفقًا لإرشادات IIA، أي مما يلي يُعتبر ضروريًا لوظيفة تدقيق فردية (مكونة من شخص واحد)؟","options":[{"key":"A","letter":"أ","text":"دليل تدقيق تقني رسمي"},{"key":"B","letter":"ب","text":"دليل تدقيق إداري مكتوب"},{"key":"C","letter":"ج","text":"مذكرة تنص على السياسات والإجراءات"},{"key":"D","letter": ت تدقيق تكنولوجيا المعلومات."},{"key":"C","letter":"ج","text":"توظيف متخصص مستقل في تكنولوجيا المعلومات الخارجية لإجراء عمليات تدقيق تكنولوجيا المعلومات للسنة الأولى"},{"key":"D","letter":"د","text":"دعوة موظفين مؤهلين من قسم تكنولوجيا المعلومات للعمل كمراقبين ضيوف وقادة عمليات تدقيق تكنولوجيا المعلومات."}],"bankIndex":356,"setId":"set4"},{"id":"357","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"A","question":"أي مما يلي صحيح فيما يتعلق بمراقبة أنشطة التدقيق الداخلي؟","options":[{"key":"A","letter":"أ","text":"يمكن أن يختلف شكل ومحتوى سياسات المراقبة حسب الصناعة"},{"key":"B","letter":"ب","text":"يتحمل مجلس الإدارة مسؤولية وضع سياسات المراقبة"},{"key":"C","letter":"ج","text":"يجب أن يكون لدى أقسام التدقيق الكبيرة والصغيرة سياسات مكتوبة حول المراقبة."},{"key":"D","letter":"د","text":"يجب على المدير التنفيذي للتدقيق صياغة جميع سياسات المراقبة المتعلقة بالنشاط"}],"bankIndex":357,"setId":"set4"},{"id":"358","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"C","question":"أثناء مراجعة وظيفة الخزانة، حدد مدقق داخلي مخاطرًا قد لا يتم تضمين جميع الحسابات المصرفية في عملية التسوية اليومية. أي من الاستجابات التالية سيكون الأكثر فعالية لتخفيف هذا الخطر؟","options":[{"key":"A","letter":"أ","text":"يحدد مشرف الخزانة حدًا أدنى للمبالغ المذكورة في البيانات المصرفية التي سيتم تسويتها مقابل البيانات الموجودة في النظام"},{"key":"B","letter":"ب","text":"يجري محلل الخزانة تسوية يومية لجميع البيانات المصرفية التي يتم الحصول عليها عبر البريد الإلكتروني مقابل البيانات الموجودة في النظام."},{"key":"C","letter":"ج","text":"يراجع محلل (مسؤول) الخزانة تقريرًا يوميًا يتم إنشاؤه تلقائيًا بواسطة نظام الخزانة، والذي يوضح البيانات المصرفية التي لم يتم تحميلها في النظام المحاسبي."},{"key":"D","letter":"د","text":"يطلب مشرف الخزانة تأكيدًا سنويًا من البنك بشأن البيانات المصرفية التي تمت معالجتها في غضون عام."}],"bankIndex":358,"setId":"set4"},{"id":"359","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"A","question":"يقيم مدقق داخلي تصميم آلاف العقود مع العملاء على الورق، والتي يتم الاحتفاظ بها في المكتب لعدم وجود مساعدين كافيين لمسح العقود ضوئيًا في النظام. أي من المكونات التالية يجب إضافته إلى هذه الملاحظة؟","options":[{"key":"A","letter":"أ","text":"معايير"},{"key":"B","letter":"ب","text":"سبب"},{"key":"C","letter":"ج","text":"تأثير"},{"key":"D","letter":"د","text":"شرط"}],"bankIndex":362,"setId":"set4"},{"id":"363","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"B","question":"أثناء المتابعة، يجري المدير التنفيذي للتدقيق (CAE) مناقشة مع الإدارة حول توصيات فريق التدقيق الداخلي المتعلقة بمشكلة كبيرة. قبلت الإدارة المشكلة لكنها لم تتخذ أي إجراء علاجي. ما هي الخطوة التالية لـCAE؟","options":[{"key":"A","letter":"أ","text":"يجب على CAE إعادة تقييم والتحقق من صحة سياسة تحمل المخاطر."},{"key":"B","letter":"ب","text":"يجب على CAE تصعيد المشكلة إلى الإدارة العليا."},{"key":"C","letter":"ج","text":"يجب على CAE التأكيد على توصيات فريق التدقيق الداخلي للإدارة."},{"key":"D","letter":"د","text":"يجب على CAE منح الإدارة المزيد من الوقت لتطبيق التوصية والتحقق من حالة المشكلة خلال المتابعة المجدولة التالية."}],"bankIndex":363,"setId":"set4"},{"id":"364","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"C","question":"أي مما يلي من إجراءات التدقيق الداخلي تتضمن عادةً أخذ عينات؟","options":[{"key":"A","letter":"أ","text":"التأكيد وتحليل القوائم المالية."},{"key":"B","letter":"ب","text":"إعادة الأداء والتفتيش."},{"key":"C","letter":"ج","text":"المراجعة المستندية والتتبع."},{"key":"D","letter":"د","text":"تحليل الاتجاهات والمقارنة المعيارية."}],"bankIndex":364,"setId":"set4"},{"id":"365","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"A","question":"في أي من الحالات التالية قام المدقق الداخلي بجمع أدلة مادية؟","options":[{"key":"A","letter":"أ","text":"قام مدقق داخلي بعمليات شراء من عدة منافذ بيع بالتجزئة تابعة للمؤسسة لتقييم خدمة العملاء."},{"key":"B","letter":"ب","text":"أجرى مدقق داخلي مقابلات مع موظفين مختلفين بشأن مشكلات الصحة والسلامة وسجل إجاباتهم"},{"key":"C","letter":"ج","text":"حصل مدقق داخلي على التقرير المالي الفصلي الحالي وحسب التغيرات في نسبة الدين إلى حقوق الملكية"},{"key":"D","letter":"د","text":"تلقى مدقق داخلي تأكيدًا موقعًا بشأن شروط المعاملة من محام مستقل"}],"bankIndex":365,"setId":"set4"},{"id":"366","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"D","question":"اكتشف مدقق داخلي أن موظفًا جديدًا حصل على إذن دخول غير مناسب لنظام رواتب الموظفين. يبدو أن أخصائي تكنولوجيا المعلومات ارتكب خطأ ومنح الإذن للموظف الجديد الخطأ. أي من إجراءات الإدارة التالية ستكون الأكثر فعالية لمنع حدوث مشكلة مماثلة مرة أخرى؟","options":[{"key":"A","letter":"أ","text":"إزالة صلاحيات الوصول المفرطة للموظف الجديد وطلب منه الإبلاغ عن أي خطأ في الوصول في المستقبل."},{"key":"B","letter":"ب","text":"إجراء مراجعة كاملة لجميع المستخدمين الذين لديهم إمكانية الوصول إلى نظام رواتب الموظفين لتحديد ما إذا كان هناك موظفون آخرون حصلوا على إمكانية الوصول بشكل غير مناسب."},{"key":"C","letter":"ج","text":"مراجعة سجل نشاط النظام الخاص بالموظف لتحديد ما إذا كان قد استخدم إمكانية الوصول غير المصرح بها لإجراء أي أنشطة غير مصرح بها في نظام الرواتب."},{"key":"D","letter":"د","text":"تقديم التدريب لأخصائي تكنولوجيا المعلومات وإدخال تحكم ثانوي (تعويضي) لضمان منح إمكانية الوصول إلى النظام وفقًا لطلب الوصول المعتمد."}],"bankIndex":366,"setId":"set4"},{"id":"367","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"D","question":"المدققة الداخلية ورئيسها في نزاع حول مخاطر لم يتم اختبارها أثناء تدقيق وظيفة الشراء. أي من الأدوات التالية من شأنه أن يدعم بشكل أفضل قرار المدقق بعدم اختبار المخاطر؟","options":[{"key":"A","letter":"أ","text":"خريطة سباغيتي"},{"key":"B","letter":"ب","text":"خريطة حرارية"},{"key":"C","letter":"ج","text":"خريطة العمليات"},{"key":"D","letter":"د","text":"خريطة التأكيد"}],"bankIndex":367,"setId":"set4"},{"id":"368","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"B","question":"وفقًا لإرشادات IIA، أي من العبارات التالية صحيحة فيما يتعلق بخطة المراجعة السنوية؟","options":[{"key":"A","letter":"أ","text":"يجب تعديل خطة المراجعة السنوية فقط استجابةً لمشاكل الموارد والنطاق وتوافر البيانات."},{"key":"B","letter":"ب","text":"يجوز للمدير التنفيذي للمراجعة (CAE) إدراج معلومات المخاطر، بما في ذلك مستويات الرغبة في المخاطرة من الإدارة لخطة المراجعة حسب تقديره."},{"key":"C","letter":"ج","text":"في بيئة إدارة مخاطر غير ناضجة، يفضل أن يعتمد المدير التنفيذي للمراجعة فقط على حكمه فيما يتعلق بتحديد وتقييم المخاطر لتطوير خطة المراجعة."},{"key":"D","letter":"د","text":"يجوز للمدير التنفيذي للمراجعة إجراء تعديلات على خطة المراجعة السنوية حسب الحاجة دون موافقة الإدارة العليا أو مجلس الإدارة."}],"bankIndex":368,"setId":"set4"},{"id":"369","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"B","question":"أي من مصادر الأدلة الإفرادية التالية يُعتبر الأكثر موثوقية فيما يتعلق بما إذا كانت العملية يتم تنفيذها بشكل فعال وفقًا لتصميمها؟","options":[{"key":"A","letter":"أ","text":"الشخص المسؤول عن أداء المهمة."},{"key":"B","letter":"ب","text":"شخصان أو أكثر يعملان في المنطقة."},{"key":"C","letter":"ج","text":"المشرف المسؤول عن العملية."},{"key":"D","letter":"د","text":"المدير الذي كتب الخطوات التي يجب اتباعها."}],"bankIndex":369,"setId":"set4"},{"id":"370","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"C","question":"أصبحت نشاط التدقيق الداخلي على علم بشكاوى عامة بشأن ممارسات المبيعات لموظفي التسويق الهاتفي في مؤسسة كبيرة. يقرر المدققون الداخليون مراجعة عينة من جميع الشكاوى خلال الأشهر الثلاثة الماضية للتأكد من أنها تعكس ممارسات التسويق الحالية. أي مما يلي يصف أفضل تقنية استعيان هذه؟","options":[{"key":"A","letter":"أ","text":"العينات الحكمية."},{"key":"B","letter":"ب","text":"العينات العشوائية"},{"key":"C","letter":"ج","text":"العينات الاكتشافية (الاستنتاجية)."},{"key":"D","letter":"د","text":"العينات الإحصائية."}],"bankIndex":370,"setId":"set4"},{"id":"371","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"C","question":"إجراء (CAE) استحوذت منظمة مؤخرًا على شركة تابعة في صناعة جديدة، وطلبت الإدارة من المدير التنفيذي للمراجعة مراجعة شاملة للشركة التابعة قبل إعادة بدء العمليات. أي، IIA تشعر المديرة التنفيذية للمراجعة بأن فريقها يفتقر إلى المهارات والمعرفة اللازمة لقبول الارتباط. وفقًا لإرشادات من الردود التالية من المدير التنفيذي للمراجعة سيكون الأنسب؟","options":[{"key":"A","letter":"أ","text":"يجب على المدير التنفيذي للمراجعة قبول الارتباط والتأكد من إدراج شرح لحدود الخبرة في تقرير المراجعة النهائي."},{"key":"B","letter":"ب","text":"يجب على المدير التنفيذي للمراجعة مطالبة الإدارة بتعيين خبير خارجي مطلع على الصناعة لإجراء مراجعة مستقلة للإدارة."},{"key":"C","letter":"ج","text":"يجب على المدير التنفيذي للمراجعة قبول المهمة وتعيين خبير خارجي لمساعدة فريق المراجعة في مراجعة الشركة التابعة."},{"key":"D","letter":"د","text":"يجب على المدير التنفيذي للمراجعة أن يوصي بتأجيل الارتباط حتى يتمكن فريق المراجعة الداخلية من تطوير معرفة كافية بالصناعة الجديدة."}],"bankIndex":371,"setId":"set4"},{"id":"372","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"A","question":"قام مشرف المهمة بمراجعة وثائق مراجع حسابات داخلي من الموظفين ولاحظ أنه يجب إجراء العديد من التعديلات. يشتمل نشاط التدقيق الداخلي على قاعدة بيانات إلكترونية لوثائق العمل ولا يحتفظ بملفات ورقية لنظام التسجيل الخاص به. منع خطأ في النظام مشرف المشاركة من إضافة توقيعه الإلكتروني إلى أي وثيقة عمل في قاعدة البيانات. نظرًا لهذا الموقف، ما هي الاستجابة الأكثر ملاءمة لتقديم دليل على المراجعة الإشرافية؟","options":[{"key":"A","letter":"أ","text":"يجب على مشرف المشاركة طباعة كل وثيقة عمل والتوقيع عليها وتاريخها بعد اكتمال المراجعة ومسح الوثيقة ضوئيًا إلى قاعدة البيانات كدليل على المراجعة"},{"key":"B","letter":"ب","text":"نظرًا لأن مشرف المشاركة اتصل بخدمة المساعدة لتصحيح مشكلة تكنولوجيا المعلومات، يجب عليه تحميل تذكرة طلب الدعم من خدمة المساعدة لتكون بمثابة دليل على المراجعة"},{"key":"C","letter":"ج","text":"يجب على مشرف المشاركة أن يطلب من مراجع حسابات داخلي آخر على مستوى الإدارة غير مرتبط بالمشروع أن يوقع على وثيقة العمل نيابة عنه"},{"key":"D","letter":"د","text":"يجب على مشرف المشاركة توجيه المراجع الداخلي للموظفين لإضافة ملاحظة في وثيقة العمل نيابة عنه تشير إلى أن وثيقة العمل تمت مراجعتها وتم تقديم الملاحظات"}],"bankIndex":372,"setId":"set4"},{"id":"373","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"A","question":"وفقًا لإرشادات IIA، أي مما يلي يمثل معلومات كافية؟","options":[{"key":"A","letter":"أ","text":"المعلومات التي تكون واقعية وكافية ومقنعة"},{"key":"B","letter":"ب","text":"المعلومات التي يمكن الوصول إليها بشكل أفضل من خلال استخدام تقنيات المشاركة المناسبة"},{"key":"C","letter":"ج","text":"المعلومات التي تدعم أهداف المشاركة والتوصيات"},{"key":"D","letter":"د","text":"المعلومات التي تساعد المنظمة على تحقيق أهدافها"}],"bankIndex":373,"setId":"set4"},{"id":"374","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"C","question":"أراد مدقق داخلي تحديد ما إذا كانت سيارات الشركة تستخدم لأغراض شخصية. استخرج تقريرًا يدرج أرقام سيارات الشركة ووحدات الأعمال التي تخصص لها السيارات وتواريخ السفر ومدة السفر والمسافة. ثم قام بتصفية البيانات لبعدات عطلة نهاية الأسبوع. أي من المعلومات الإضافية التالية سيحتاجها المراقب؟","options":[{"key":"A","letter":"أ","text":"أسماء وعناوين وظائف الموظفين."},{"key":"B","letter":"ب","text":"وصف مسؤوليات وحدات الأعمال."},{"key":"C","letter":"ج","text":"بيانات استهلاك الوقود المتوسط للمركبات"},{"key":"D","letter":"د","text":"موقع وبيانات مسار المركبات."}],"bankIndex":374,"setId":"set4"},{"id":"375","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"A","question":"أي مما يلي سيكون الأكثر إفادة لرئيس قسم التدقيق الداخلي عند وضع استراتيجية لإدارة المواهب؟","options":[{"key":"A","letter":"أ","text":"تحليل الفجوات/ الثغرات"},{"key":"B","letter":"ب","text":"تفضيلات الموظفين."},{"key":"C","letter":"ج","text":"تحليل النضج."},{"key":"D","letter":"د","text":"مدى تغطية التدقيق الخارجي."}],"bankIndex":375,"setId":"set4"},{"id":"376","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"C","question":"وفقًا لإرشادات IIA، أي من العبارات التالية صحيح بشأن الخرائط الحرارية؟","options":[{"key":"A","letter":"أ","text":"تحدد خريطة حرارية الاحتمالية على أنها ذات أولوية أعلى من التأثير."},{"key":"B","letter":"ب","text":"تحدد خريطة حرارية التأثير على أن يكون له أولوية أعلى من الاحتمالية."},{"key":"C","letter":"ج","text":"تعترف خريطة حرارية بأن أولوية التأثير والاحتمالية يمكن أن تختلف."},{"key":"D","letter":"د","text":"تعترف خريطة حرارية بالتأثير والاحتمالية على أنهما بنفس الأهمية."}],"bankIndex":376,"setId":"set4"},{"id":"377","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"A","question":"يقوم الرئيس التنفيذي للتدقيق المعين حديثًا بإنشاء نشاط تدقيق داخلي جديد. تود الإدارة التنفيذية استخدام نشاط التدقيق الداخلي للتطوير الوظيفي في جميع أنحاء المنظمة، ما هو نموذج التوظيف الذي يجب أن تختاره الحالة لتحقيق أفضل أهداف الإدارة؟","options":[{"key":"A","letter":"أ","text":"نموذج التناوب (الدوران الوظيفي)"},{"key":"B","letter":"ب","text":"نموذج الكفاءة"},{"key":"C","letter":"ج","text":"نموذج مهني"},{"key":"D","letter":"د","text":"نموذج الإدارة"}],"bankIndex":377,"setId":"set4"},{"id":"378","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"C","question":"عند الانتهاء من مهمة التدقيق، يقوم مدير التدقيق بمراجعة أوراق عمل مدقق الموظفين. أي من الإجراءات التالية للمدير هو الأنسب في هذه المراجعة؟","options":[{"key":"A","letter":"أ","text":"إيصال نتائج مراجعة أوراق العمل إلى إدارة المجال قيد المراجعة للتحقق من صحة التقرير النهائي"},{"key":"B","letter":"ب","text":"تحديث التقرير النهائي في الملف بأي تصحيحات ضرورية بناءً على مراجعة أوراق العمل."},{"key":"C","letter":"ج","text":"مناقشة نتائج مراجعة أوراق العمل مع مدقق الموظفين حيث يكون ذلك مناسبًا كفرصة للتعلم"},{"key":"D","letter":"د","text":"إضافة ملاحظات مراجعة المدير إلى التوثيق النهائي بعد المراجعة."}],"bankIndex":378,"setId":"set4"},{"id":"379","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"C","question":"أي من العبارات التالية صحيحة فيما يتعلق بعيب استخدام استبيانات الرقابة الداخلية (ICQs)؟","options":[{"key":"A","letter":"أ","text":"عندما يحتاج المدققون الداخليون إلى تغطية العديد من إجراءات الرقابة باستخدام الاستبيانات، يكون ذلك أقل كفاءة بشكل عام من إجراء الملاحظات والتفقد"},{"key":"B","letter":"ب","text":"من الصعب بشكل عام على المدققين الداخليين تجميع استبيانات مراقبة داخلية مناسبة للأنشطة التجارية التي تحكمها إجراءات التشغيل الموحدة"},{"key":"C","letter":"ج","text":"تعتبر استبيانات الرقابة الداخلية غير كافية لتوفير ضمان فعال حول كيفية تنفيذ العمليات التنظيمية في الممارسة العملية."},{"key":"D","letter":"د","text":"يواجه المدققون الداخليون عمومًا صعوبة في معالجة الاستبيانات المكتملة، لأن استبيانات الرقابة الداخلية غالبًا ما تستخرج تعليقات مفصلة وإجابات طويلة من الإدارة"}],"bankIndex":379,"setId":"set4"},{"id":"380","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"A","question":"يقوم المدقق الداخلي بإعداد استبيان عن الرقابة الداخلية لقسم المشتريات كجزء من مسح تمهيدي. أي مما يلي يوفر أفضل مصدر للمعلومات للأسئلة؟","options":[{"key":"A","letter":"أ","text":"قانون أو لائحة مشتروات ذات صلة."},{"key":"B","letter":"ب","text":"قائمة بموردي الشركة."},{"key":"C","letter":"ج","text":"مراجعة لعينة من المناقصات خلال الفترة التي تمت مراجعتها."},{"key":"D","letter":"د","text":"ملخص لمصروفات الشركة وفئاتهم."}],"bankIndex":380,"setId":"set4"},{"id":"381","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"B","question":"أي من العبارات التالية صحيحة فيما يتعلق بالرقابة الداخلية؟","options":[{"key":"A","letter":"أ","text":"بالنسبة لمهام التأكيد، يجب على المدققين الداخليين التخطيط لتقييم فعالية جميع الضوابط على مستوى الكيان."},{"key":"B","letter":"ب","text":"يمكن للضوابط الضعيفة أو المصممة بشكل سيء أو معيب على مستوى الكيان منع ضوابط العمليات المصممة بشكل جيد من العمل كما هو مقصود"},{"key":"C","letter":"ج","text":"أثناء التخطيط للمهمة، لا ينبغي للمدققين الداخليين مناقشة المخاطر الرئيسية والضوابط التي تم تحديدها مع إدارة المجال قيد المراجعة لمنع الكشف عن نقاط التدقيق المحتملة."},{"key":"D","letter":"د","text":"تعد مراجعة مخططات تدفق العمليات مخططات التدفق طريقة مناسبة للمدقق الداخلي لتحديد جميع المخاطر والضوابط الرئيسية أثناء التخطيط للمهمة."}],"bankIndex":381,"setId":"set4"},{"id":"382","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"A","question":"أثناء ارتباط استشاري، يريد مراجع داخلي تحديد ما إذا كان جميع أصحاب المصلحة الرئيسيين مشاركين في مشروع. أي أداة يجب على المراجع استخدامها؟","options":[{"key":"A","letter":"أ","text":"مخطط RACI (المسؤول والمُحاسب والمستشار والمُعلم)"},{"key":"B","letter":"ب","text":"مخطط التدفق"},{"key":"C","letter":"ج","text":"تحليل SWOT (نقاط القوة والضعف والفرص والتهديدات)"},{"key":"D","letter":"د","text":"تحليل سير العمل"}],"bankIndex":382,"setId":"set4"},{"id":"383","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"B","question":"تم تكليف مدقق داخلي بمراجعة الضوابط في وظيفة الحسابات الدائنة. يتم تنفيذ معظم عمليات الحسابات الدائنة من قبل مزود خدمة تابع لجهة خارجية. أدرج المدقق في تقرير التدقيق عددًا من قصور في الرقابة تتعلق بالعمليات التي يقوم بها مزود الخدمة. طلب مزود الخدمة نسخة من التقرير. أي مما يلي سيكون الرد الأكثر ملاءمة من رئيس قسم التدقيق الداخلي (CAE)؟","options":[{"key":"A","letter":"أ","text":"سيرسل CAE تلقائيًا نسخة من التقرير إلى مزود الخدمة حيث تتعلق العديد من النتائج بالمجال الذي يديره مزود الخدمة."},{"key":"B","letter":"ب","text":"يجوز لرئيس قسم التدقيق الداخلي توزيع التقرير على مزود الخدمة مجانًا، بعد استشارة المستشار القانوني ورئيس مسؤولية الامتثال."},{"key":"C","letter":"ج","text":"يجوز لرئيس قسم التدقيق الداخلي تقديم نسخة من تقرير التدقيق إلى مزود الخدمة إذا تم توقيع اتفاقية ويوافق مزود الخدمة على تعويض تكلفة التدقيق."},{"key":"D","letter":"د","text":"يجب على رئيس قسم التدقيق الداخلي إجراء معايير بالممارسات مع منظمات أخرى في الصناعة وذلك بالتشاور مع الزملاء وتوزيع التقرير فقط إذا كان ممارسة مقبولة في الصناعة."}],"bankIndex":383,"setId":"set4"},{"id":"384","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"A","question":"ما هو السبب الرئيسي لاستخدام المدقق الداخلي لاستبيان المخاطر والضوابط عند التدقيق في العمليات المالية؟","options":[{"key":"A","letter":"أ function examResultsData(session){
  const lessons={};let correct=0,wrong=0,unanswered=0;
  sessionQuestions(session).forEach(q=>{
    const lesson=q.lesson||"بدون درس",ans=session.answers[key(q)],ok=!!ans&&ans.selected===q.answer;
    if(ok)correct++;else if(ans)wrong++;else unanswered++;
    if(!lessons[lesson])lessons[lesson]={total:0,correct:0,wrong:0,unanswered:0};
    lessons[lesson].total++;if(ok)lessons[lesson].correct++;else if(ans)lessons[lesson].wrong++;else lessons[lesson].unanswered++;
  });
  const total=session.order.length;return {correct,wrong,unanswered,total,score:pct(correct,total),lessons};
}
function examMistakeRows(session=exam.session){
  if(!session)return[];
  return sessionQuestions(session).map((q,i)=>{
    const ans=session.answers[key(q)],selected=ans?.selected||"",correct=selected===q.answer;
    return {q,index:i,selected,correct,unanswered:!selected};
  }).filter(r=>!r.correct);
}
function applyExamHistory(session){
  sessionQuestions(session).forEach(q=>{
    const k=key(q),ans=session.answers[k],correct=!!ans&&ans.selected===q.answer;
    const h=state.history[k]||{
      attempts:0,correct:0,wrong:0,studyAttempts:0,studyCorrect:0,studyWrong:0,
      examAttempts:0,examCorrect:0,examWrong:0,examUnanswered:0,
      everWrong:false,lastSelected:"",lastCorrect:false,lastContext:"",lastTs:0
    };
    if(ans){
      h.attempts++;h.examAttempts++;
      if(correct){h.correct++;h.examCorrect++;}else{h.wrong++;h.examWrong++;h.everWrong=true;}
      h.lastSelected=ans.selected;h.lastCorrect=correct;h.lastTs=Number(ans.ts)||Date.now();
    }else{h.examUnanswered++;h.lastSelected="";h.lastCorrect=false;h.lastTs=Date.now();}
    h.lastContext="exam";state.history[k]=h;
  });
}

    attempt:session.attempt,score:data.score,correct:data.correct,wrong:data.wrong,unanswered:data.unanswered,total:data.total,
    finishedAt:session.finishedAt,durationUsed:Math.max(0,data.total*60-session.remaining)
  });

}
function answerText(q,keyValue,session=exam.session){

  const weakest=rows.slice(0,3).map(r=>r.lesson+" ("+r.pct+"%)").join("، "),mistakes=examMistakeRows();
  const table=rows.map(r=>`<tr><td>${escapeHtml(r.lesson)}</td><td>${r.total}</td><td class="okLesson">${r.correct}</td><td>${r.unanswered}</td><td class="${r.pct<70?'weakLesson':'okLesson'}">${r.pct}%</td></tr>`).join("");
  card.innerHTML=`<div class="examResultBox"><h2 style="margin:0;text-align:center">نتيجة الاختبار ${setDef(exam.setId).number}</h2><div class="examScore">${data.score}%<small>${data.correct} من ${data.total}</small></div><div class="examReviewSummary"><span class="badge">إجابات خاطئة: ${data.wrong}</span><span class="badge">غير مجابة: ${data.unanswered}</span></div><p style="text-align:center;color:var(--muted);margin:6px 0">أضعف الدروس: ${escapeHtml(weakest||"لا يوجد")}</p><table class="examLessonTable"><thead><tr><th>الدرس</th><th>الأسئلة</th><th>صحيح</th><th>غير مجاب</th><th>النسبة</th></tr></thead><tbody>${table}</tbody></table><button class="btn bad examReviewToggle" id="reviewMistakesBtn">مراجعة الأخطاء (${mistakes.length})</button><div class="examTools"><button class="btn primary" id="practiceMistakesBtn">التدرب على الأخطاء</button><button class="btn" id="exportMistakesResultBtn">تصدير الأخطاء إلى Excel</button></div><div id="examMistakeReview"></div><div class="examActions"><button class="btn primary" id="newExamBtn">اختبار جديد لنفس المجموعة</button><button class="btn" id="backStudyBtn">العودة للمراجعة</button></div></div>`;
  $("reviewMistakesBtn").onclick=()=>{const box=$("examMistakeReview");if(box.innerHTML){box.innerHTML="";$("reviewMistakesBtn").textContent=`مراجعة الأخطاء (${mistakes.length})`;}else{renderMistakeReview();$("reviewMistakesBtn").textContent="إخفاء مراجعة الأخطاء";box.scrollIntoView({behavior:"smooth",block:"start"});}};
  $("practiceMistakesBtn").onclick=()=>{exitExam();startExamMistakePractice();};$("exportMistakesResultBtn").onclick=exportExamMistakes;
  $("newExamBtn").onclick=()=>startExam(exam.setId,true);$("backStudyBtn").onclick=exitExam;
}
function exitExam(){clearInterval(exam.timerId);exam.timerId=null;exam.active=false;exam.setId="";exam.session=null;exam.questions=[];exam.index=0;view.special="";render();}

function examMistakeQuestions(){const set=new Set(state.examMistakeKeys||[]);return QUESTIONS.filter(q=>set.has(key(q)));}
function exportExamMistakes(){
  const list=examMistakeQuestions();if(!list.length){alert("لا توجد أخطاء محفوظة من آخر اختبار لتصديرها.");return;}
  if(typeof XLSX==="undefined"){alert("مكتبة Excel غير متاحة حالياً. يبقى سجل الأخطاء محفوظاً داخل التطبيق ويمكن نسخه احتياطياً بصيغة JSON.");return;}
  const rows=list.map(q=>({
    "Form":q.form,"Form Title":q.formTitle||FORM_TITLE[q.form]||q.form,"Question No.":q.id,"Lesson":q.lesson||"","Question":q.question,
    "Option A":q.options.find(o=>o.key==="A")?.text||"","Option B":q.options.find(o=>o.key==="B")?.text||"",
    "Option C":q.options.find(o=>o.key==="C")?.text||"","Option D":q.options.find(o=>o.key==="D")?.text||"","Correct Answer":q.answer
  }));
  const ws=XLSX.utils.json_to_sheet(rows);ws['!cols']=[{wch:12},{wch:22},{wch:14},{wch:22},{wch:60},{wch:38},{wch:38},{wch:38},{wch:38},{wch:16}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Exam Mistakes");XLSX.writeFile(wb,"exam-mistakes.xlsx");
}

function showProgressDashboard(){view.special="progress";view.forceShow=false;render();}
function renderProgressDashboard(){
  const card=$("quizCard");
  const totalDone=QUESTIONS.filter(answered).length,totalMistakes=QUESTIONS.filter(everWrong).length,totalStars=QUESTIONS.filter(isStarred).length;
  const allHist=Object.values(state.history||{}),attempts=allHist.reduce((s,h)=>s+Number(h.attempts||0),0),correct=allHist.reduce((s,h)=>s+Number(h.correct||0),0);
  const testsCompleted=SETS.filter(s=>latestExamResult(s.id)).length;
  const rows=SETS.map(s=>{
    const r=reviewStatsForSet(s.id),e=examStatusForSet(s.id),lastKey=state.ui.lastQuestionBySet[s.id],lastQ=lastKey?QUESTION_BY_KEY.get(lastKey):null;
    return `<tr>
      <td>${s.label}<br><small style="color:var(--muted)">${s.range}</small></td>
      <td><div class="inlineProgress"><div class="progressTrack"><i style="width:${pct(r.done,r.total)}%"></i></div><b>${r.done}/${r.total}</b></div></td>
      <td>${r.accuracy}%</td><td>${r.mistakes}</td>
      <td>${lastQ?"سؤال "+escapeHtml(lastQ.id):"—"}</td><td>${escapeHtml(e.text)}</td>
      <td><button class="btn" data-dashboard-review="${s.id}">مراجعة</button> <button class="btn ${e.kind==="progress"?"warn":""}" data-dashboard-exam="${s.id}">${e.kind==="progress"?"استئناف":"اختبار"}</button></td>
    </tr>`;
  }).join("");
  card.innerHTML=`<div class="progressDashboard">
    <div><h2 class="specialTitle">سجل التقدم الكامل</h2><p class="specialSub">يتم الحفظ تلقائياً بعد الإجابات والتنقل، ويمكنك أخذ نسخة احتياطية مستقلة في أي وقت.</p></div>
    <div class="progressKpis">
      <div class="progressKpi"><b>${totalDone}/393</b><span>تمت مراجعتها</span></div>
      <div class="progressKpi"><b>${pct(correct,attempts)}%</b><span>دقة جميع المحاولات</span></div>
      <div class="progressKpi"><b>${totalMistakes}</b><span>ضمن سجل الأخطاء</span></div>
      <div class="progressKpi"><b>${testsCompleted}/4</b><span>اختبارات مكتملة</span></div>
    </div>
    <div class="recordHint">سجل الأخطاء تراكمي: السؤال يبقى معروفاً بأنه أخطأت فيه سابقاً حتى لو أجبته بشكل صحيح لاحقاً. يمكن الوصول إليه من «تدريب سجل الأخطاء».</div>
    <div class="progressTableWrap"><table class="progressTable"><thead><tr><th>المجموعة</th><th>تقدم المراجعة</th><th>دقة المراجعة</th><th>أخطاء مسجلة</th><th>آخر موضع</th><th>الاختبار</th><th>فتح</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="backupRow"><button class="btn primary" id="backupProgressCardBtn">نسخة احتياطية من التقدم</button><button class="btn" id="returnToStudyBtn">العودة للمراجعة الحالية</button></div>
  </div>`;
  card.querySelectorAll("[data-dashboard-review]").forEach(b=>b.onclick=()=>switchStudySet(b.dataset.dashboardReview));
  card.querySelectorAll("[data-dashboard-exam]").forEach(b=>b.onclick=()=>startExam(b.dataset.dashboardExam));
  $("backupProgressCardBtn").onclick=backupProgress;$("returnToStudyBtn").onclick=()=>{view.special="";render();};
}

function downloadBlob(blob,name){
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}
function backupProgress(){
  save();
  const payload={app:"نظام تدريب بنك الأسئلة",version:STATE_VERSION,bankId:BANK_ID,questionCount:QUESTIONS.length,exportedAt:new Date().toISOString(),state};
  downloadBlob(new Blob([JSON.stringify(payload,null,2)],{type:"application/json;charset=utf-8"}),`question-bank-progress-${new Date().toISOString().slice(0,10)}.json`);
}
async function restoreProgressFile(file){
  if(!file)return;
  try{
    const data=JSON.parse(await file.text());
    if(!data||data.bankId!==BANK_ID||Number(data.questionCount)!==QUESTIONS.length)throw new Error("النسخة الاحتياطية لا تخص بنك الأسئلة الحالي.");
    if(!data.state||typeof data.state!=="object")throw new Error("ملف النسخة الاحتياطية غير صالح.");
    state=normalizeState(data.state);
    Object.entries(state.answers).forEach(([k,r])=>{if(QUESTION_BY_KEY.has(k)&&r&&!state.history[k])state.history[k]={attempts:1,correct:r.correct===true?1:0,wrong:r.correct===false?1:0,studyAttempts:1,studyCorrect:r.correct===true?1:0,studyWrong:r.correct===false?1:0,examAttempts:0,examCorrect:0,examWrong:0,examUnanswered:0,everWrong:r.correct===false,lastSelected:r.selected||"",lastCorrect:r.correct===true,lastContext:"study",lastTs:Number(r.ts)||0};});
    view.studySet=state.ui.studySet;view.examSet=state.ui.examSet;view.form="all";view.lesson="all";view.mode="all";view.search="";view.special="";view.forceShow=false;view.studyOptionOrder={};
    save();buildDynamicControls();restoreIndexForSet(view.studySet);render();alert("تمت استعادة التقدم بنجاح.");
  }catch(err){alert("تعذر استعادة التقدم: "+(err?.message||err));}
}

const THEME_KEY=STORE_KEY+"_theme";
function currentTheme(){return document.documentElement.dataset.theme==="light"?"light":"dark";}
function updateThemeToggle(){
  const btn=$("themeToggle");if(!btn)return;
  const light=currentTheme()==="light";
  btn.textContent=light?"🌙":"☀️";
  btn.setAttribute("aria-label",light?"تشغيل الوضع الداكن":"تشغيل الوضع الفاتح");
  btn.title=light?"تشغيل الوضع الداكن":"تشغيل الوضع الفاتح";
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta)meta.setAttribute("content",light?"#f4f7fb":"#101828");
}
function applyTheme(theme,persist=true){
  const next=theme==="light"?"light":"dark";
  document.documentElement.dataset.theme=next;
  if(persist){try{localStorage.setItem(THEME_KEY,next);}catch(e){}}
  updateThemeToggle();
}
function toggleTheme(){applyTheme(currentTheme()==="dark"?"light":"dark");}

function applyLayout(){
  // Layout is now controlled only by the responsive CSS media queries.
  // Never inherit or persist a manual phone/desktop override in localStorage.
  document.body.classList.remove("phoneView");
}

function render(){
  renderJourney();stats();
  if(exam.active){
    if(exam.session?.status==="finished"){renderExamNav();renderExamResults();ensureExamTimer();return;}
    renderExamNav();renderExamCard();ensureExamTimer();return;
  }
  clearInterval(exam.timerId);exam.timerId=null;
  clampIndex();renderNav();renderCard();ensureTimer();
}

/* Controls */
$("studySetFilter").addEventListener("change",e=>switchStudySet(e.target.value));
$("examSetFilter").addEventListener("change",e=>{view.examSet=e.target.value;state.ui.examSet=view.examSet;save();renderJourney();});
$("formFilter").addEventListener("change",e=>{view.form=e.target.value;view.lesson="all";buildLessonOptions();view.index=0;view.forceShow=false;render();});
$("lessonFilter").addEventListener("change",e=>{view.lesson=e.target.value;view.index=0;view.forceShow=false;render();});
$("modeFilter").addEventListener("change",e=>{if(e.target.value==="examMistakes"){startExamMistakePractice();return;}setMode(e.target.value);});
$("searchBox").addEventListener("input",e=>{view.search=e.target.value;view.index=0;view.forceShow=false;view.special="";render();});
[
  ["prevBtnSide",prev],["nextBtnSide",next],["prevBtnBottom",prev],["nextBtnBottom",next],["randomBtnBottom",randomQ],["showBtnBottom",showAnswer],
  ["wrongPracticeBtn",practiceWrong],["reviewPracticeBtn",showReview],["allPracticeBtn",showAll],["examMistakePracticeBtn",startExamMistakePractice],
  ["exportExamMistakesBtn",exportExamMistakes],["startExamBtn",()=>startExam(view.examSet)],["progressDashboardBtn",showProgressDashboard],
  ["backupProgressBtn",backupProgress],["resetProgressBtn",resetProgress]
].forEach(([id,fn])=>{const el=$(id);if(el)el.onclick=fn;});
$("restoreProgressInput").addEventListener("change",e=>{const file=e.target.files&&e.target.files[0];restoreProgressFile(file);e.target.value="";});

/* Keyboard shortcuts: displayed-position mapping is preserved after option shuffling. */
document.addEventListener("keydown",e=>{
  const active=document.activeElement;if(active&&["INPUT","SELECT","TEXTAREA"].includes(active.tagName))return;
  if(e.key==="ArrowRight"){e.preventDefault();prev();return;}
  if(e.key==="ArrowLeft"){e.preventDefault();next();return;}
  if(e.key===" "){e.preventDefault();showAnswer();return;}
  const pressed=String(e.key||"").toLowerCase();
  const indexMap={"1":0,"a":0,"أ":0,"ا":0,"2":1,"b":1,"ب":1,"3":2,"c":2,"ج":2,"4":3,"d":3,"د":3};
  const optionIndex=indexMap[pressed]??indexMap[e.key];if(optionIndex===undefined)return;e.preventDefault();
  if(exam.active){
    const visible=[...document.querySelectorAll("#quizCard [data-exam-pick]")],btn=visible[optionIndex];
    if(btn&&!btn.classList.contains("eliminated"))examPick(btn.dataset.examPick);return;
  }
  const visible=[...document.querySelectorAll("#quizCard [data-pick]")],btn=visible[optionIndex];
  if(btn&&!btn.classList.contains("eliminated"))pick(btn.dataset.pick);
});
window.addEventListener("beforeunload",()=>{if(exam.active&&exam.session)exam.session.index=exam.index;save();});

buildDynamicControls();
restoreIndexForSet(view.studySet);
applyLayout();
const themeBtn=$("themeToggle");if(themeBtn)themeBtn.onclick=toggleTheme;
applyTheme(currentTheme(),false);
save();
render();



/* Phone-only panel defaults. Desktop remains visually unchanged. */
function applyResponsiveSectionDefaults(){
  const phone=window.matchMedia('(max-width: 860px)').matches;
  document.querySelectorAll('.mobileSection').forEach(d=>{
    if(phone){
      d.open=d.classList.contains('questionListSection');
    }else{
      d.open=true;
    }
  });
}
applyResponsiveSectionDefaults();
let responsiveWasPhone=window.matchMedia('(max-width: 860px)').matches;
window.addEventListener('resize',()=>{
  const nowPhone=window.matchMedia('(max-width: 860px)').matches;
  if(nowPhone!==responsiveWasPhone){responsiveWasPhone=nowPhone;applyResponsiveSectionDefaults();}
});
</script>
