<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101828">
<title>نظام تدريب بنك الأسئلة</title>
<script>
(function(){
  try{
    const savedTheme=localStorage.getItem("arabic_test_bank_all_forms_v2_theme");
    document.documentElement.dataset.theme=savedTheme==="light"?"light":"dark";
  }catch(e){document.documentElement.dataset.theme="dark";}
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0b1020;--card:#121a2c;--card2:#172033;--line:#26324a;--text:#f5f7fb;--muted:#aab6c9;
  --brand:#6ee7b7;--brand2:#38bdf8;--good:#34d399;--bad:#fb7185;--warn:#fbbf24;--radius:22px;--tap:48px;
  --shadow:0 18px 60px rgba(0,0,0,.34)
}
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  background:radial-gradient(circle at top left,rgba(56,189,248,.18),transparent 34rem),radial-gradient(circle at bottom right,rgba(110,231,183,.13),transparent 34rem),var(--bg);
  color:var(--text);
  font-family: 'Cairo', system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing: grayscale;
}
body{padding:16px;padding-bottom:calc(94px + env(safe-area-inset-bottom));overflow-x:hidden}
button,input,select{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.app{max-width:1160px;margin:auto}
.hero{display:block;margin-bottom:10px}
.box,.panel,.card{background:rgba(18,26,44,.88);border:1px solid rgba(255,255,255,.1);border-radius:var(--radius);box-shadow:var(--shadow);backdrop-filter:blur(16px)}
.box{padding:18px}
.compactHero{padding:12px 14px;overflow:hidden}
.heroRow{display:block}
h1{margin:0 0 10px;font-size:clamp(1.25rem,4.5vw,2rem);letter-spacing:-.01em;line-height:1.3;text-align:center;font-weight:800}
.sub{margin:0;color:var(--muted);line-height:1.8;font-size:.98rem;font-weight:400}
.compactMetrics{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;align-items:stretch;max-width:100%}
.formsMini{display:none!important}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pill,.metricChip{border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:999px;color:var(--text);font-size:.78rem;min-width:0;text-align:center}
.pill{padding:7px 12px}.metricChip{padding:6px 8px;line-height:1.2;overflow:hidden;text-overflow:ellipsis}
.pill strong,.metricChip strong{color:var(--brand);font-weight:800}
.metricChip .label{color:var(--muted);font-size:.72rem;margin-inline-end:3px}
.metricChip.status{grid-column:span 2}.metricChip.status strong{color:var(--brand)}.simpleMetric{display:inline-flex;align-items:center;justify-content:center;gap:5px}.metricIcon{line-height:1;font-size:.9rem}
.metricChip.good strong{color:var(--good)}
.metricChip.bad strong{color:var(--bad)}
.metricChip.warn strong{color:var(--warn)}
.actionsTop{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap;justify-content:flex-start}
.btn{min-height:var(--tap);border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.07);color:var(--text);padding:10px 14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.15s transform,.15s border-color,.15s background;font-weight:600;font-size:0.9rem}
.btn:hover{transform:translateY(-1px);border-color:rgba(110,231,183,.55)}
.btn.primary{background:linear-gradient(135deg,rgba(110,231,183,.22),rgba(56,189,248,.18));border-color:rgba(110,231,183,.5);font-weight:700}
.btn.good{border-color:rgba(52,211,153,.55);background:rgba(52,211,153,.12)}
.btn.bad{border-color:rgba(251,113,133,.55);background:rgba(251,113,133,.11)}
.btn.warn{border-color:rgba(251,191,36,.55);background:rgba(251,191,36,.11)}
.grid{display:grid;grid-template-columns:330px 1fr;gap:14px;align-items:start}
.panel{padding:14px;position:sticky;top:14px}
.sectionTitle{font-weight:800;margin:4px 0 10px;color:#dbeafe;font-size:1rem;border-right:3px solid var(--brand2);padding-right:8px}
.field{display:grid;gap:6px;margin-bottom:10px}
label{color:var(--muted);font-size:.86rem;font-weight:500}
select,input{width:100%;min-height:46px;border-radius:14px;border:1px solid var(--line);background:#0e1627;color:var(--text);padding:9px 12px;outline:none;font-weight:500}
select:focus,input:focus{border-color:var(--brand2)}
.miniStats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.stat{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:16px;padding:10px}
.stat b{display:block;font-size:1.18rem;color:var(--brand);font-weight:800}
.stat span{color:var(--muted);font-size:.82rem;font-weight:500}
.navList{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;max-height:310px;overflow:auto;padding-inline-end:2px}
.qchip{min-height:38px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.055);color:var(--text);font-size:.83rem;font-weight:700}
.qchip.active{border-color:var(--brand);background:rgba(110,231,183,.16)}
.qchip.done{box-shadow:inset 0 -3px 0 rgba(56,189,248,.8)}
.qchip.ok{box-shadow:inset 0 -3px 0 rgba(52,211,153,.9)}
.qchip.no{box-shadow:inset 0 -3px 0 rgba(251,113,133,.9)}
.card{padding:18px;min-height:560px}
.meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.metaInfo{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.metaRates{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-start;direction:ltr}
.metricBadge{border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:999px;padding:7px 11px;color:var(--brand);font-size:.88rem;font-weight:800;min-width:70px;text-align:center}
.badge{border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:999px;padding:7px 11px;color:#dbeafe;font-size:.88rem;font-weight:500}
.badge.good{border-color:rgba(52,211,153,.5);color:#bbf7d0}
.question{font-size:clamp(1.08rem,2.6vw,1.35rem);line-height:1.8;margin:12px 0 18px;font-weight:700;color:#ffffff}
.options{display:grid;gap:10px}

/* تحسين تنسيق الخيارات ودعم تأثير الاستبعاد بصرياً */
.option{width:100%;text-align:right;align-items:center;justify-content:flex-start;line-height:1.6;padding:13px 14px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.055);color:var(--text);display:flex;gap:11px;font-weight:500;font-size:0.95rem;transition: background 0.2s, border-color 0.2s, opacity 0.2s}
.option .letter{flex:0 0 34px;height:34px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);font-weight:800;color:var(--brand2)}
.option.selected{border-color:var(--brand2);background:rgba(56,189,248,.13)}
.option.correct{border-color:rgba(52,211,153,.72);background:rgba(52,211,153,.14)}
.option.wrong{border-color:rgba(251,113,133,.72);background:rgba(251,113,133,.13)}

/* تأثير الاستبعاد (شطب الخيار المهمل) */
.option.eliminated {
  opacity: 0.25;
  text-decoration: line-through;
  border-color: rgba(255, 255, 255, 0.05);
}
.option.eliminated .letter {
  text-decoration: line-through;
  background: rgba(0, 0, 0, 0.2);
  color: var(--muted);
}

.feedback{display:none;margin-top:14px;border-radius:18px;padding:13px 14px;line-height:1.8;border:1px solid var(--line);background:rgba(255,255,255,.055);font-weight:500}
.feedback.show{display:block}
.feedback.ok{border-color:rgba(52,211,153,.55);background:rgba(52,211,153,.11)}
.feedback.no{border-color:rgba(251,113,133,.55);background:rgba(251,113,133,.11)}
.cardActions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.quickControls{display:grid;grid-template-columns:1fr;gap:8px;margin:12px 0}.quickControls .btn{justify-content:space-between}.quickControls b{min-width:30px;height:30px;border-radius:999px;background:rgba(255,255,255,.1);display:inline-flex;align-items:center;justify-content:center;color:var(--brand);font-weight:700}
.timerBox{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:18px;padding:10px 12px;margin:6px 0 14px}.timerHead{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#dbeafe;font-weight:700}.timerText{direction:rtl;color:var(--warn);font-variant-numeric:tabular-nums;font-weight:700}.timerBar{height:9px;border-radius:999px;background:rgba(255,255,255,.09);overflow:hidden;margin-top:9px}.timerFill{display:block;height:100%;width:100%;border-radius:999px;background:linear-gradient(90deg,var(--bad),var(--warn),var(--brand));transition:width .25s linear}.timerDone .timerText{color:var(--bad)}
body.phoneView .app{max-width:460px}body.phoneView {padding:10px;padding-bottom:calc(86px + env(safe-area-inset-bottom))}body.phoneView .hero{grid-template-columns:1fr}body.phoneView .grid{grid-template-columns:1fr}body.phoneView .panel{position:static}body.phoneView .card{min-height:auto;padding:15px}body.phoneView .navList{display:flex;overflow:auto;max-height:none;padding-bottom:4px}body.phoneView .qchip{min-width:48px}body.phoneView .actionsTop{display:none}body.phoneView .bottomBar{display:flex}body.phoneView .bottomBar .btn{flex:1;padding:9px 8px}body.phoneView .question{font-size:1.12rem;line-height:1.8}body.phoneView .option{padding:12px 13px}
.bottomBar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(11,16,32,.82);border-top:1px solid rgba(255,255,255,.1);backdrop-filter:blur(18px);padding:10px calc(12px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));display:none;gap:8px}
.empty{padding:28px;text-align:center;color:var(--muted);line-height:1.8;font-weight:500}
.kbd{font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,Arial,sans-serif!important;direction:ltr;unicode-bidi:bidi-override}
@media(max-width:860px){
  body{padding:10px;padding-bottom:calc(86px + env(safe-area-inset-bottom))}
  .compactHero{padding:10px}
  h1{margin-bottom:8px;font-size:1.35rem}
  .compactMetrics{width:100%;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
  .metricChip{font-size:.72rem;padding:6px 5px}
  .metricChip .label{display:block;margin:0 0 2px;font-size:.68rem}
  .grid{grid-template-columns:1fr}
  .panel{position:static}
  .card{min-height:auto;padding:15px}
  .navList{display:flex;overflow:auto;max-height:none;padding-bottom:4px}
  .qchip{min-width:48px}
  .actionsTop{display:none}
  .bottomBar{display:flex}
  .bottomBar .btn{flex:1;padding:9px 8px}
}
@media(max-width:430px){.miniStats{grid-template-columns:1fr 1fr}.pill{font-size:.82rem}.question{line-height:1.8}.compactMetrics{grid-template-columns:repeat(2,minmax(0,1fr))}.metricChip.status{grid-column:1 / -1}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

.uploadMini{border:1px solid var(--line);background:rgba(255,255,255,.045);border-radius:18px;padding:10px;margin-bottom:14px;display:grid;gap:9px}
.uploadBtn{width:100%;font-weight:800}
.importStatus{border:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.12);border-radius:14px;padding:10px;color:var(--muted);font-size:.86rem;line-height:1.7;font-weight:500}
.importStatus.good{border-color:rgba(52,211,153,.55);background:rgba(52,211,153,.10);color:#bbf7d0}
.importStatus.bad{border-color:rgba(251,113,133,.55);background:rgba(251,113,133,.10);color:#fecdd3}
.emptyUpload{max-width:720px;margin:auto;text-align:center;line-height:1.8;padding:18px}
.emptyUpload h2{margin:0 0 8px;color:#eafff6;font-weight:800}
.emptyUpload p{color:var(--muted);margin:0 0 14px;font-weight:500}
.templateHint{margin-top:14px;border:1px solid var(--line);background:rgba(255,255,255,.045);border-radius:18px;padding:12px;color:var(--muted);font-size:.86rem;line-height:1.8;text-align:right;font-weight:500}

@media(max-width:560px){.meta{align-items:stretch;flex-direction:column}.metaInfo,.metaRates{justify-content:flex-start}.metricBadge{min-width:auto;padding:6px 10px}}

.excelUrlBox{display:grid;gap:8px;margin-top:12px}
.excelUrlRow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.excelUrlRow input{flex:1;min-width:210px}
.excelHint{color:var(--muted);font-size:.82rem;line-height:1.7;margin:0;font-weight:500}
@media(max-width:860px){
  .excelUrlRow{display:grid;grid-template-columns:1fr}
  .excelUrlRow input,.excelUrlRow button{width:100%}
}

/* Exam mode */
.examStartBtn{border-color:rgba(110,231,183,.7)!important;background:linear-gradient(135deg,rgba(110,231,183,.22),rgba(56,189,248,.18))!important;font-weight:800}
.examTop{position:sticky;top:0;z-index:4;margin:-4px -4px 12px;padding:10px;border:1px solid rgba(255,255,255,.1);border-radius:18px;background:rgba(14,22,39,.96);backdrop-filter:blur(14px);display:grid;gap:8px}
.examHeaderLine{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.examTimer{font-size:1.1rem;font-weight:800;color:var(--warn);font-variant-numeric:tabular-nums}
.examProgress{color:#dbeafe;font-weight:800}.examProgress b{color:var(--brand)}
.examReviewFlag{border-color:rgba(251,191,36,.65)!important;background:rgba(251,191,36,.15)!important}
.examOption.selected{border-color:var(--brand2);background:rgba(56,189,248,.16)}
.examOption.correct,.examOption.wrong{background:rgba(255,255,255,.055);border-color:var(--line)}
.examActions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}
.examResultBox{border:1px solid var(--line);background:rgba(255,255,255,.045);border-radius:20px;padding:14px;margin:10px 0;line-height:1.8;font-weight:500}
.examScore{font-size:1.8rem;font-weight:900;color:var(--brand);text-align:center;margin:8px 0}.examScore small{display:block;color:var(--muted);font-size:.9rem;font-weight:600}
.examLessonTable{width:100%;border-collapse:collapse;margin-top:10px;overflow:hidden;border-radius:14px;font-size:.92rem}.examLessonTable th,.examLessonTable td{border:1px solid rgba(255,255,255,.1);padding:8px;text-align:center}.examLessonTable th{background:rgba(255,255,255,.07);color:#dbeafe;font-weight:700}.weakLesson{color:var(--bad);font-weight:800}.okLesson{color:var(--good);font-weight:800}.examNavHint{color:var(--muted);font-size:.82rem;line-height:1.6}
.qchip.review{outline:2px solid rgba(251,191,36,.8);outline-offset:-2px}
.qchip.answeredExam{box-shadow:inset 0 -3px 0 rgba(56,189,248,.8)}
@media(max-width:860px){.examActions{grid-template-columns:1fr 1fr}.examTop{position:static}.examTimer{font-size:1rem}.examLessonTable{font-size:.8rem}.examLessonTable th,.examLessonTable td{padding:6px 4px}}

/* Exam mistake review */
.examMistakes{display:grid;gap:12px;margin-top:14px}
.examMistake{border:1px solid rgba(251,113,133,.45);background:rgba(251,113,133,.08);border-radius:18px;padding:14px;line-height:1.75;font-weight:500}
.examMistake.unanswered{border-color:rgba(251,191,36,.5);background:rgba(251,191,36,.08)}
.examMistakeHead{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:9px}
.examMistakeQuestion{font-weight:800;color:#f8fafc;margin:8px 0 10px}
.examAnswerLine{border-radius:13px;padding:9px 11px;margin-top:7px;border:1px solid var(--line);background:rgba(255,255,255,.045);font-weight:500}
.examAnswerLine.user{border-color:rgba(251,113,133,.45);color:#fecdd3}
.examAnswerLine.correct{border-color:rgba(52,211,153,.45);color:#bbf7d0}
.examReviewSummary{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.examReviewToggle{width:100%;margin-top:10px}
@media(max-width:860px){.examMistake{padding:11px}.examMistakeHead{gap:5px}.examAnswerLine{font-size:.9rem}}

/* Exam mistake training + export + review navigation */
.examTools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.examTools .btn{width:100%}
.examReviewJump{grid-column:1 / -1}
@media(max-width:860px){.examTools{grid-template-columns:1fr}}

/* Cairo font override */
html,body,button,input,select,textarea{font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,Arial,sans-serif!important;}


/* Embedded bank, progress journey, persistence and set navigation */
.bankStatusLine{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.bankCount{font-weight:900;color:var(--brand);font-size:1.05rem}
.journeyList{display:grid;gap:8px;margin-bottom:12px}
.journeyItem{border:1px solid var(--line);background:rgba(255,255,255,.045);border-radius:16px;padding:10px;display:grid;gap:7px}
.journeyHead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.journeyHead b{font-size:.9rem;color:#e5eefc}
.journeyStatus{font-size:.76rem;color:var(--muted);font-weight:700}
.progressTrack{height:7px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.progressTrack i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--brand2),var(--brand))}
.journeyActions{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.journeyActions .btn{min-height:38px;padding:6px 8px;font-size:.78rem;border-radius:12px}
.progressDashboard{display:grid;gap:12px}
.progressKpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.progressKpi{border:1px solid var(--line);background:rgba(255,255,255,.045);border-radius:17px;padding:12px;text-align:center}
.progressKpi b{display:block;color:var(--brand);font-size:1.3rem;font-weight:900}
.progressKpi span{color:var(--muted);font-size:.78rem;font-weight:600}
.progressTableWrap{overflow:auto;border-radius:16px}
.progressTable{width:100%;border-collapse:collapse;min-width:680px;font-size:.88rem}
.progressTable th,.progressTable td{border:1px solid rgba(255,255,255,.1);padding:9px;text-align:center}
.progressTable th{background:rgba(255,255,255,.065);color:#dbeafe;font-weight:800}
.progressTable td{background:rgba(255,255,255,.025)}
.inlineProgress{display:flex;align-items:center;gap:8px;min-width:150px}
.inlineProgress .progressTrack{flex:1}
.specialTitle{text-align:center;margin:0 0 4px;font-size:1.35rem;font-weight:900}
.specialSub{text-align:center;color:var(--muted);margin:0 0 12px;line-height:1.8}
.resumeBadge{border-color:rgba(251,191,36,.55)!important;color:#fde68a!important}
.recordHint{border:1px dashed rgba(110,231,183,.35);background:rgba(110,231,183,.06);border-radius:16px;padding:11px;color:#d1fae5;line-height:1.75;font-size:.86rem}
.backupRow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:860px){.progressKpis{grid-template-columns:1fr 1fr}.backupRow{grid-template-columns:1fr}.journeyActions{grid-template-columns:1fr 1fr}}
@media(max-width:430px){.progressKpis{grid-template-columns:1fr 1fr}.journeyActions{grid-template-columns:1fr}}

/* Dark / light theme toggle */
.themeToggle{
  position:fixed;top:14px;left:14px;z-index:20;width:42px;height:42px;min-height:42px;padding:0;
  border:1px solid var(--line);border-radius:50%;background:rgba(18,26,44,.90);color:var(--text);
  box-shadow:0 8px 24px rgba(0,0,0,.22);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center;
  font-size:1.05rem;line-height:1;transition:transform .15s,border-color .15s,background .2s,color .2s;
}
.themeToggle:hover{transform:translateY(-1px);border-color:var(--brand2)}
.themeToggle:focus-visible{outline:3px solid rgba(56,189,248,.28);outline-offset:2px}

html[data-theme="light"]{
  --bg:#f4f7fb;--card:#ffffff;--card2:#edf3f9;--line:#d3dce8;--text:#172033;--muted:#667085;
  --brand:#059669;--brand2:#0284c7;--good:#059669;--bad:#e11d48;--warn:#a16207;
  --shadow:0 16px 42px rgba(15,23,42,.10);
}
html[data-theme="light"],html[data-theme="light"] body{
  background:radial-gradient(circle at top left,rgba(56,189,248,.12),transparent 34rem),radial-gradient(circle at bottom right,rgba(16,185,129,.10),transparent 34rem),var(--bg);
  color:var(--text);
}
html[data-theme="light"] .box,html[data-theme="light"] .panel,html[data-theme="light"] .card{background:rgba(255,255,255,.92);border-color:rgba(15,23,42,.09)}
html[data-theme="light"] .themeToggle{background:rgba(255,255,255,.94);color:#172033;box-shadow:0 8px 24px rgba(15,23,42,.12)}

@media(max-width:560px){.themeToggle{top:10px;left:10px;width:38px;height:38px;min-height:38px}}



/* Unified responsive layout: one HTML for desktop and iPhone */
.mobileSection{display:contents}
.mobileSection>summary{display:none}

@media(max-width:860px){
  /* Put the active question before the dashboard/filters on phones. */
  .grid{display:flex!important;flex-direction:column;gap:10px}
  #quizCard{order:1}
  .panel{order:2;width:100%;padding:10px;position:static!important}

  /* Keep the title compact so the question is visible immediately. */
  .hero{margin-bottom:8px}
  .compactHero{padding:8px 10px}
  h1{font-size:1.18rem;margin:0}

  /* Secondary controls become expandable sections on phones only. */
  .mobileSection{display:block;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.025);margin:8px 0;overflow:hidden}
  .mobileSection>summary{display:flex;align-items:center;justify-content:space-between;min-height:46px;padding:9px 12px;color:#dbeafe;font-weight:800;cursor:pointer;list-style:none;-webkit-tap-highlight-color:transparent}
  .mobileSection>summary::-webkit-details-marker{display:none}
  .mobileSection>summary::after{content:"＋";font-size:1.05rem;color:var(--brand2);font-weight:900}
  .mobileSection[open]>summary::after{content:"−"}
  .mobileSection>.sectionTitle{display:none}
  .mobileSection[open]>:not(summary){margin-left:10px;margin-right:10px}
  .mobileSection[open]>.journeyList{margin-top:0}

  /* Start with only the useful navigation list expanded; other long sections stay compact. */
  .navList{max-width:100%;scrollbar-width:thin}
  .questionListSection .navList{margin-bottom:10px}

  /* Question card itself becomes denser and touch friendly. */
  .card{padding:13px!important;border-radius:18px;min-height:auto!important}
  .meta{margin-bottom:8px}
  .question{font-size:1.08rem!important;line-height:1.75;margin:10px 0 14px}
  .options{gap:8px}
  .option{min-height:54px;padding:11px 12px;font-size:.94rem;border-radius:15px}
  .option .letter{flex-basis:32px;height:32px}
  .timerBox{margin:5px 0 10px;padding:8px 10px}
  .cardActions{margin-top:12px}

  /* Fixed bottom controls stay reachable without covering the final option. */
  body{padding-bottom:calc(88px + env(safe-area-inset-bottom))!important}
  .bottomBar{display:flex!important}
  .bottomBar .btn{min-width:0;font-size:.82rem;padding:8px 5px}

  /* Theme control respects iPhone safe areas. */
  .themeToggle{top:calc(8px + env(safe-area-inset-top));left:calc(8px + env(safe-area-inset-left))}
}

@media(max-width:430px){
  body{padding-left:7px!important;padding-right:7px!important}
  .app{width:100%;max-width:none}
  .card{padding:11px!important}
  .question{font-size:1.02rem!important}
  .option{font-size:.91rem;line-height:1.55}
  .badge,.metricBadge{font-size:.75rem;padding:5px 8px}
  .bottomBar{gap:5px;padding-top:7px}
  .bottomBar .btn{font-size:.76rem}
}

 هيكلة نشاط التدقيق الداخلي، مما نتج عنه تغيير كبير في المسؤوليات بين مديري التدقيق والمشرفين على بعض التدقيقات."},{"key":"C","letter":"ج","text":"واجه مدقق داخلي صعوبات في إكمال جزء من التدقيق لأن إدارة المجال قيد المراجعة لم تكن على استعداد للتعاون وتقديم المعلومات في الوقت المناسب."},{"key":"D","letter":"د","text":"تسبب استقالة مدير تدقيق داخلي خلال العام في دفع رئيس قسم التدقيق الداخلي لتأجيل عدد من مهمات التدقيق إلى العام التالي."}],"bankIndex":15,"setId":"set1"},{"id":"16","form":"form1","formTitle":"النموذج 1","lesson":"ج- تخطيط","answer":"C","question":"أي من العبارات التالية حول دعم عملية إدارة المخاطر لنشاط التدقيق الداخلي صحيحة؟","options":[{"key":"A","letter":"أ","text":"يمكن لعملية إدارة المخاطر توفير خدمات تدقيق داخلي أكثر شمولاً للمنظمة إذا لم يكن لديها قسم تدقيق داخلي"},{"key":"B","letter":"ب","text":"تدعم عملية إدارة المخاطر التدقيق الداخلي من خلال تقييم ما إذا كانت الضوابط الحاسمة كافية وفعالة."},{"key":"C","letter":"ج","text":"يمكن لعملية إدارة المخاطر تحديد ما إذا تم تحديد جميع المخاطر المهمة ومعالجتها."},{"key":"D","letter":"د","text":"تنشئ عملية إدارة المخاطر إطار عمل موثق لإدارة المخاطر محدد للمنظمة."}],"bankIndex":16,"setId":"set1"},{"id":"17","form":"form1","formTitle":"النموذج 1","lesson":"د- تنفيذ","answer":"B","question":"يحتوي اتصال (تقرير) المهمة النهائي على الملاحظة التالية: اكتشف المدقق الداخلي أن ثلاثة من العقود العشرة التي تمت مراجعتها لم تفي بمتطلبات المزايدة التنافسية للمؤسسة. وأوضحت الإدارة أن الإدارة العليا اعتبرت هذه المشتريات مهمة ومنحتها لأنه وحيد المصدر. أي من المكونات التالية مفقودة في توثيق الملاحظة؟","options":[{"key":"A","letter":"أ","text":"المعايير"},{"key":"B","letter":"ب","text":"التأثير (الأهمية)."},{"key":"C","letter":"ج","text":"الحالة"},{"key":"D","letter":"د","text":"السبب."}],"bankIndex":17,"setId":"set1"},{"id":"18","form":"form1","formTitle":"النموذج 1","lesson":"أ- مهام التدقيق","answer":"A","question":"وفقًا لإرشادات IIA، يتحمل الرئيس التنفيذي للتدقيق الداخلي المسؤولية المباشرة عن أي من الأمور التالية؟","options":[{"key":"A","letter":"أ","text":"الحفاظ على برنامج ضمان الجودة حتى في غياب دعم الإدارة."},{"key":"B","letter":"ب","text":"مراجعة الموافقة على ميثاق المراجعة الداخلية بشكل دوري."},{"key":"C","letter":"ج","text":"توفير فرص لجميع المدققين الموظفين لتلبية متطلبات التطوير المهني."},{"key":"D","letter":"د","text":"تحديد الأهداف والنطاق والخطط لكل ارتباط."}],"bankIndex":18,"setId":"set1"},{"id":"19","form":"form1","formTitle":"النموذج 1","lesson":"هـ- الابلاغ","answer":"D","question":"أي مما يلي هو السبب الرئيسي الذي يدفع المدققين الداخليين لإجراء اتصالات مؤقتة مع إدارة المجال قيد المراجعة؟","options":[{"key":"A","letter":"أ","text":"لإظهار حسن الإشراف على المشروع"},{"key":"B","letter":"ب","text":"لتوفير مناقشة نتائج في الوقت المناسب"},{"key":"C","letter":"ج","text":"لإظهار كفاءة المدقق الداخلي"},{"key":"D","letter":"د","text":"متابعة المعلومات المطلوبة مسبقًا."}],"bankIndex":19,"setId":"set1"},{"id":"20","form":"form1","formTitle":"النموذج 1","lesson":"د- تنفيذ","answer":"A","question":"اختبر المدقق الداخلي ما إذا كانت أوامر الشراء مدعومة بطلبات شراء معتمدة بشكل مناسب. أخذت عينة من مجموعة مستندات الشراء وحددت حالات مفقودة فيها طلبات الشراء. ومع ذلك، لم تلاحظ (تنتبه) أنه في بعض الحالات تمت الموافقة على طلبات الشراء من قبل شخص غير مصرح له. أي المخاطر التالية يصف هذا الموقف بشكل أكثر ملاءمة؟","options":[{"key":"A","letter":"أ","text":"مخاطر عدم أخذ العينات"},{"key":"B","letter":"ب","text":"مخاطر أخذ العينات"},{"key":"C","letter":"ج","text":"المخاطر المتأصلة"},{"key":"D","letter":"د","text":"مخاطر العناية الواجبة"}],"bankIndex":20,"setId":"set1"},{"id":"21","form":"form1","formTitle":"النموذج 1","lesson":"ج- تخطيط","answer":"B","question":"أي مما يلي صحيح بشأن الاستبيانات؟","options":[{"key":"A","letter":"أ","text":"الاستطلاع ذو الأسئلة المفتوحة أضعف من المقابلة الهيكلية."},{"key":"B","letter":"ب","text":"يمكن للاستبيان ذو الأسئلة المغلقة (المقفلة) إنتاج أدلة قابلة للقياس."},{"key":"C","letter":"ج","text":"من المحتمل أن يتطوع المشاركون في الاستطلاع بمعلومات لم يتم طلبها على وجه التحديد."},{"key":"D","letter":"د","text":"يُستَخدم الاستبيان، مثل عمليات التفتيش والتأكيدات، بشكل أفضل لاختبار الفعالية التشغيلية للضوابط."}],"bankIndex":21,"setId":"set1"},{"id":"22","form":"form1","formTitle":"النموذج 1","lesson":"د- تنفيذ","answer":"B","question":"خلال مرحلة العمل على الملف لعملية تأكيدية، يقرر المراجع الداخلي أنها تريد تعديل برنامج عمل المهمة. أي من الخطوات التالية هي الأكثر ملاءمة للمراجع؟","options":[{"key":"A","letter":"أ","text":"طلب معلومات إضافية مطلوبة من إدارة المنطقة قيد المراجعة"},{"key":"B","letter":"ب","text":"الحصول على موافقة مشرف المهمة."},{"key":"C","letter":"ج","text":"الحصول على الموارد المطلوبة، بما في ذلك تكنولوجيا المعلومات، لإكمال العمل"},{"key":"D","letter":"د","text":"مناقشة تغيير النطاق مع إدارة المنطقة قيد المراجعة."}],"bankIndex":22,"setId":"set1"},{"id":"23","form":"form1","formTitle":"النموذج 1","lesson":"د- تنفيذ","answer":"C","question":"بعد الانتهاء من التقييم الأولي، قام مشرف المهمة بإعداد مشروع برنامج عمل. وفقًا لإرشادات IIA، أي مما يلي سيتم اختباره في هذا البرنامج؟","options":[{"key":"A","letter":"أ","text":"أهداف العملية."},{"key":"B","letter":"ب","text":"مخاطر العملية."},{"key":"C","letter":"ج","text":"ضوابط العملية."},{"key":"D","letter":"د","text":"نطاق العملية."}],"bankIndex":23,"setId":"set1"},{"id":"24","form":"form1","formTitle":"النموذج 1","lesson":"د- تنفيذ","answer":"C","question":"أكمل مدقق داخلي مراجعة النفقات المتعلقة بإطلاق مشروع جديد. قام المراجع بعمل عينة من 45 معاملة وافق عليها مدير مشروع كبير وحدد 30 معاملة بها وثائق مورد مشكوك فيها. أي من الاستنتاجات التالية هو الأنسب للمراجع لتضمينه في تقرير المراجعة؟","options":[{"key":"A","letter":"أ","text":"تكبدت المؤسسة تجاوزات في التكاليف أدت إلى مخاطر مالية وقانونية كبيرة للمشروع."},{"key":"B","letter":"ب","text":"واجهت المنظمة تضاربًا محتملًا في المصالح."},{"key":"C","letter":"ج","text":"كانت لدى المنظمة نقاط ضعف في عملية المراجعة الخاصة بها مما سمح بمعاملات مشكوك فيها مع بعض الموردين (البائعين)."},{"key":"D","letter":"د","text":"سمحت الم ية والعمل معًا للاتفاق على أهداف المهمة."},{"key":"D","letter":"د","text":"مراجعة تقارير المراجعة السابقة من المنطقة وتطوير أهداف المهمة لمعالجة المخاطر والضوابط الرئيسية في المنطقة."}],"bankIndex":27,"setId":"set1"},{"id":"28","form":"form1","formTitle":"النموذج 1","lesson":"د- تنفيذ","answer":"B","question":"شهادة الإدارة بسوء فصل الواجبات في عملية استلام النقدية يمكن اعتبارها أي مما يلي؟","options":[{"key":"A","letter":"أ","text":"تحليلية."},{"key":"B","letter":"ب","text":"موثوقة."},{"key":"C","letter":"ج","text":"ذات صلة."},{"key":"D","letter":"د","text":"كافية."}],"bankIndex":28,"setId":"set1"},{"id":"29","form":"form1","formTitle":"النموذج 1","lesson":"ج- تخطيط","answer":"D","question":"وفقًا لإرشادات معهد المدققين الداخليين (IIA)، أي من العوامل التالية يجب على المدقق المسؤول مراعاتها عند تحديد متطلبات الموارد لمهمة التدقيق؟","options":[{"key":"A","letter":"أ","text":"عدد ومستوى خبرة وتوافر موظفي التدقيق بالإضافة إلى طبيعة وتعقيد وقيود الوقت في المهمة."},{"key":"B","letter":"ب","text":"ملاءمة كفاية الموارد والقدرة على التنسيق مع المدققين الخارجيين."},{"key":"C","letter":"ج","text":"عدد ومهارة وخبرة وتوافر موظفي التدقيق والقدرة على التنسيق مع المدققين الخارجيين"},{"key":"D","letter":"د","text":"ملاءمة كفاية الموارد بالإضافة إلى طبيعة وتعقيد وقيود الوقت في المهمة."}],"bankIndex":29,"setId":"set1"},{"id":"30","form":"form1","formTitle":"النموذج 1","lesson":"ج- تخطيط","answer":"D","question":"يدفع قرار الاندماج بين الشركات الرئيس التنفيذي للتدقيق الداخلي (CAE) إلى اقتراح تغييرات مؤقتة على خطة التدقيق السنوية الحالية لمراعاة المخاطر الناشئة. ما الإجراء الأنسب للرئيس التنفيذي للتدقيق الداخلي فيما يتعلق بالتغييرات التي تم إجراؤها على خطة التدقيق؟","options":[{"key":"A","letter":"أ","text":"تقديم خطة التدقيق المنقحة (المعدلة) مباشرة إلى المجلس للموافقة"},{"key":"B","letter":"ب","text":"التواصل مع الرئيس المالي وعرض خطة التدقيق المنقحة (المعدلة) على الرئيس التنفيذي للموافقة"},{"key":"C","letter":"ج","text":"تقديم خطة التدقيق المنقحة (المعدلة) مباشرة إلى الرئيس التنفيذي للموافقة"},{"key":"D","letter":"د","text":"التواصل مع الرئيس التنفيذي وعرض خطة التدقيق المنقحة (المعدلة) على المجلس للموافقة."}],"bankIndex":30,"setId":"set1"},{"id":"31","form":"form1","formTitle":"النموذج 1","lesson":"ج- تخطيط","answer":"D","question":"أي مما يلي يصف السبب الرئيسي لإجراء تقييم أولي للمخاطر أثناء التخطيط للمهمة؟","options":[{"key":"A","letter":"أ","text":"تحديد المخاطر الكبيرة الهامة في جميع أنحاء المنظمة."},{"key":"B","letter":"ب","text":"التأكد من أن برنامج عمل المهمة يغطي جميع مجالات المخاطر."},{"key":"C","letter":"ج","text":"التأكد من أن المخاطر التي تم تحديدها خلال عمليات التدقيق السابقة للمجال تمت معالجتها بشكل مناسب"},{"key":"D","letter":"د","text":"التأكد من تضمين المخاطر الهامة الكبيرة في نطاق المهمة."}],"bankIndex":31,"setId":"set1"},{"id":"32","form":"form1","formTitle":"النموذج 1","lesson":"د- تنفيذ","answer":"D","question":"أي من الإجراءات التالية يصف بشكل أفضل استخدام المدقق الداخلي لبيانات الاختبار لتحديد ما إذا كان نظام الحسابات الدائنة الجديد للمنظمة يتجنب معالجة الفواتير المشكوك فيها للدفع؟","options":[{"key":"A","letter":"أ","text":"إنشاء أداة آلية تراقب برنامج الكمبيوتر بشكل يومي بحثًا عن مشكلات محتملة تتطلب إجراءات تصحيحية"},{"key":"B","letter":"ب","text":"استخدام نظام آلي يساعد المدققين الداخليين في أتمتة تحليل المخاطر لبرنامج الكمبيوتر الخاص بالفوترة"},{"key":"C","letter":"ج","text":"تضمين أدوات في برنامج الكمبيوتر لتحليل عمليات مراجعة الفواتير بحثًا عن مشاكل محتملة قد تعيق المدفوعات"},{"key":"D","letter":"د","text":"إضافة فواتير إلى برنامج الكمبيوتر لتقييم موثوقية وفعالية عملية المراجعة وما إذا كانت الضوابط تعمل."}],"bankIndex":32,"setId":"set1"},{"id":"33","form":"form1","formTitle":"النموذج 1","lesson":"أ- مهام التدقيق","answer":"C","question":"يتلقى مصنع ألعاب مكونات معينة من مورد في الخارج ويستخدمها لتجميع المنتجات النهائية. في الآونة الأخيرة، كشفت مراجعات الجودة عن العديد من المشكلات المتعلقة بمطابقة المكونات مع معايير الجودة الإلزامية. أي نوع من الارتباطات سيكون الأنسب لتقييم الأسباب الجذرية لمشاكل الجودة؟","options":[{"key":"A","letter":"أ","text":"تقييم المخاطر"},{"key":"B","letter":"ب","text":"مراجعة تشغيلية"},{"key":"C","letter":"ج","text":"تدقيق طرف ثالث (مراجعة خارجية)"},{"key":"D","letter":"د","text":"تحقيق في الاحتيال"}],"bankIndex":33,"setId":"set1"},{"id":"34","form":"form1","formTitle":"النموذج 1","lesson":"ج- تخطيط","answer":"C","question":"تشتري منظمة النفط الخام من السوق المفتوحة وتكرره إلى بنزين عالي الجودة. سعر النفط الخام متقلب للغاية. أي مما يلي هو أفضل تقنية لإدارة المخاطر لحماية المنظمة من تقلبات الأسعار هذه؟","options":[{"key":"A","letter":"أ","text":"إبرام اتفاقيات شراء بنزين طويلة الأجل مع العملاء النهائيين."},{"key":"B","letter":"ب","text":"تداول مشتقات النفط الخام في الأسواق المالية للاستفادة من تقلبات الأسعار."},{"key":"C","letter":"ج","text":"شراء مشتقات مرتبطة بالنفط الخام مثل العقود الآجلة أو الخيارات."},{"key":"D","letter":"د","text":"تخزين أكبر قدر ممكن من المواد الخام والتفكير في الاستثمار في مرافق إضافية."}],"bankIndex":34,"setId":"set1"},{"id":"35","form":"form1","formTitle":"النموذج 1","lesson":"د- تنفيذ","answer":"B","question":"في مؤسسة بها نشاط كبير للتدقيق الداخلي يضم عدة فرق تدقيق تقوم بمهام في وقت واحد، أي من المهام التالية من المرجح أن يقوم بها مشرف المهمة أثناء مرحلة التخطيط لمهمة جديدة؟","options":[{"key":"A","letter":"أ","text":"إنشاء وسيلة لحل أي اختلافات في الحكم المهني بشأن القضايا الأخلاقية التي قد تنشأ أثناء المهمة."},{"key":"B","letter":"ب","text":"الموافقة على برنامج عمل المهمة لضمان تصميم البرنامج لتحقيق أهداف المهمة."},{"key":"C","letter":"ج","text":"تقييم ما إذا كانت الاختبارات والنتائج تدعم نتائج واستنتاجات المهمة."},{"key":"D","letter":"د","text":"مراجعة نتائج اختبار العينة للبحث عن الاستثناءات."}],"bankIndex":35,"setId":"set1"},{"id":"36","form":"form1","formTitle":"النموذج 1","lesson":"ب- تنسيق","answer":"C","question":"أي من العبارات التالية صحيحة فيما يتعلق بمدققين الداخليين وغيرهم من مقدمي خدمات التأكيد؟","options":[{"key":"A","letter":"أ","text":"لا يمكن لمقدمي خدمات التأكيد الذين يتبعون الإدارة أو يعتبرون جزءًا منها تقديم خدمات تقييم الرقابة الذاتية."},{"key":"B","letter":"ب","text":"يجب على المدققين الداخليين دائمًا إعادة تنفيذ وتحسين عمل التدقيق الذي قام به مقدمو خدمات التأكيد الخارجيين."},{"key":"C","letter":"ج","text":"يجوز للمدقيين الداخليين الاعتماد على عمل فرق الامتثال الداخلي لتوسيع نطاق تغطيتهم للمؤسسة دون زيادة ساعات التدقيق المباشر."},{"key":"D","letter":"د","text":"يمكن للمدقيين الداخليين الاعتماد على عمل مقدمي خدمات التأكيد الآخرين فقط إذا كان مقدمو خدمات التأكيد الآخرين يتبعون المجلس مباشرة."}],"bankIndex":36,"setId":"set1"},{"id":"37","form":"form1","formTitle":"النموذج 1","lesson":"هـ- الابلاغ","answer":"A","question":"بعد فترة من إصدار تقرير التدقيق النهائي، علم مشرف المهمة أن العديد من نقاط ضعف الرقابة الداخلية لم يتم تداركها (لم يتم معالجتها)، على الرغم من موافقة الإدارة السابقة على معالجتها. وفقًا لإرشادات معهد المدققين الداخليين (IIA)، أي مما يلي هو أكثر الردود ملاءمة؟","options":[{"key":"A","letter":"أ","text":"يجب على مشرف المهمة إبلاغ رئيس قسم التدقيق (CAE) بأن أوجه القصور لم يتم تصحيحها."},{"key":"B","letter":"ب","text":"يجب على مشرف المهمة الاعتماد على الحكم المهني لتحديد ما إذا كان ينبغي إبلاغ المدير التنفيذي للتدقيق، أو ينبغي تعديل خطة عمل الإدارة."},{"key":"C","letter":"ج","text":"يجب على مشرف المهمة الاعتماد على مهاراته التفاوضية وإصدار إنذار نهائي للإدارة لمعالجة أوجه قصور الرقابة"},{"key":"D","letter":"د","text":"ضمان تسجيل هذه النواقص في الوثائق كمناطق ذات أولوية عالية لمراجعتها خلال عملية التدقيق التالية."}],"bankIndex":37,"setId":"set1"},{"id":"38","form":"form1","formTitle":"النموذج 1","lesson":"ج- تخطيط","answer":"C","question":"أي من العبارات التالية صحيحة فيما يتعلق باستخدام استبيانات الرقابة الداخلية (ICQs)؟","options":[{"key":"A","letter":"أ","text":"تعد استبيانات الرقابة الداخلية فعالة لأنها تقلل إلى أدنى حد من الحاجة إلى متابعة مع المستجيبين للاستطلاع"},{"key":"B","letter":"ب","text":"يمكن استبعاد عناصر التحكم مع استجابات الاستبيان الإيجابية من المزيد من الاختبارات"},{"key":"C","letter":"ج","text":"يمكن تفسير إجابات أسئلة الاستبيان بشكل خاطئ بسهولة."},{"key":"D","letter":"د","text":"تقدم استبيانات الرقابة الداخلية قيمة محدودة للمؤسسات ذات الإجراءات الموحدة."}],"bankIndex":38,"setId":"set1"},{"id":"39","form":"form1","formTitle":"النموذج 1","lesson":"ج- تخطيط","answer":"D","question":"وفقًا لإرشادات معهد المدققين الداخليين (IIA)، أي مما يلي يعد خطوة التخطيط الرئيسية التي يجب على المدققين الداخليين القيام بها لوضع أهداف المهمة المناسبة قبل البدء بمهمة التدقيق؟","options":[{"key":"A","letter":"أ","text":"مراجعة الهيكل التنظيمي وأدوار الإدارة ومسؤولياتها وإجراءات التشغيل"},{"key":"B","letter":"ب","text":"تقييم المخاطر من قبل الإدارة وتقييم المخاطر لنشاط التدقيق الداخلي."},{"key":"C","letter":"ج","text":"تقييم كيفية العملية ووثائق الرقابة المستخدمة لتلبية المتطلبات التنظيمية."},{"key":"D","letter":"د","text":"مراجعة ملاحظات محضر الاجتماعات من المناقشات التي تشمل إدارة المجال المراد مراجعته."}],"bankIndex":39,"setId":"set1"},{"id":"40","form":"form1","formTitle":"النموذج 1","lesson":"هـ- الابلاغ","answer":"B","question":"ما هو الغرض الأساسي لإصدار تقرير أولي مرحلي لإدارة المجال قيد المراجعة؟","options":[{"key":"A","letter":"أ","text":"لبناء علاقات جيدة مع الإدارة"},{"key":"B","letter":"ب","text":"مساعدة الإدارة في تطوير خطط عمل أكثر استجابة وفي الوقت المناسب."},{"key":"C","letter":"ج","text":"الإبلاغ رسميًا عن الملاحظات متوسطة وعالية المخاطر كتابيًا"},{"key":"D","letter":"د","text":"تحسين مؤشرات الأداء الرئيسية للتدقيق الداخلي."}],"bankIndex":40,"setId":"set1"},{"id":"41","form":"form1","formTitle":"النموذج 1","lesson":"د- تنفيذ","answer":"D","question":"يشتبه مدقق داخلي في بنك إقليمي في أن رئيس الإقراض التجاري يمنح قروضًا دون الضمانات المطلوبة. أي من تقنيات العينة التالية ستكون الأكثر فعالية في التحقيق في شكوك المدقق؟","options":[{"key":"A","letter":"أ","text":"عينات المتغيرات"},{"key":"B","letter":"ب","text":"أخذ العينات بالوحدة النقدية"},{"key":"C","letter":"ج","text":"أخذ عينات تقديرية (الحكمية)."},{"key":"D","letter":"د","text":"عينات اكتشافية (الاستنتاجية)"}],"bankIndex":41,"setId":"set1"},{"id":"42","form":"form1","formTitle":"النموذج 1","lesson":"ج- تخطيط","answer":"C","question":"أي مما يلي صحيح فيما يتعلق باستبيانات الرقابة الداخلية؟","options":[{"key":"A","letter":"أ","text":"تعد استبيانات الرقابة الداخلية مفيدة في تقييم فعالية الإجراءات التشغيلية القياسية"},{"key":"B","letter":"ب","text":"تتيح استبيانات الرقابة الداخلية وثائق موثوقة تسمح للمراجعين الداخليين بتغطية العديد من إجراءات الرقابة في وقت قصير"},{"key":"C","letter":"ج","text":"يمكن للمراجعين الداخليين استخدام استبيانات الرقابة الداخلية كدليل للمقابلة"},{"key":"D","letter":"د","text":"توفر استبيانات الرقابة الداخلية أدلة تدقيق مباشرة قد تحتاج إلى تدعيم"}],"bankIndex":42,"setId":"set1"},{"id":"43","form":"form1","formTitle":"النموذج 1","lesson":"ج- تخطيط","answer":"B","question":"أي من فوائد مخططات التدفق الانسيابية (Flowcharts) على استبيانات الرقابة الداخلية؟ (1) تقلل المخططات الانسيابية من الحاجة إلى اختبار ما إذا كان الموظفون يلتزمون بعملية الرقابة الداخلية. (2) توفر المخططات الانسيابية تصويرًا مرئيًا للعمليات في المنطقة قيد المراجعة. (3) تحدد المخططات الانسيابية نقاط ضعف تصميم الرقابة الداخلية وتحدد أولوياتها. (4) تسلط المخططات الانسيابية الضوء على نقاط الرقابة لمساعدة المدققين الداخليين على تقييم تصميم الرقابة.","options":[{"key":"A","letter":"أ","text":"1 و 3 فقط"},{"key":"B","letter":"ب","text":"2 و 4 فقط"},{"key":"C","letter":"ج","text":"1 و 2 و 3 فقط"},{"key":"D","letter":"د","text":"2 و 3 و 4 فقط"}],"bankIndex":43,"setId":"set1"},{"id":"44","form":"form1","formTitle":"النموذج 1","lesson":"أ- مهام التدقيق","answer":"D","question":"أي من العبارات التالية صحيحة حول تضمين مهمات الاستشارات في خطة التدقيق الداخلي السنوية؟","options":[{"key":"A","letter":"أ","text":"يجب تضمين جميع طلبات مهمات الاستشارات في خطة التدقيق الداخلي السنوية"},{"key":"B","letter":"ب","text":"يجب تضمين مهمات التأكيدية في خطة التدقيق الداخلي السنوية، ولكن لا يوجد شرط لتضمين مهمات الاستشارات"},{"key":"C","letter":"ج","text":"لا يلزم تضمين مهمات الاستشارات في الخطة السنوية للتدقيق الداخلي إلا إذا طلبها المجلس"},{"key":"D","letter":"د","text":"قد يعتمد قبول مقترحات مهمات الاستشارات في خطة التدقيق الداخلي السنوية على قدرتها على إضافة قيمة"}],"bankIndex":44,"setId":"set1"},{"id":"45","form":"form1","formTitle":"النموذج 1","lesson":"أ- مهام التدقيق","answer":"C","question":"يقوم مدقق داخلي بإجراء تقييم أولي للمخاطر لمجال مراجعة ويريد تقييم امتثال الإدارة لقوانين الخصوصية لحماية معلومات العملاء المخزنة على خوادم المنظمة. ما هو المسار المناسب لهذه المرحلة من المهمة؟","options":[{"key":"A","letter":"أ","text":"طلب خدمات متخصص في تدقيق نظم المعلومات."},{"key":"B","letter":"ب","text":"الحصول على أحدث نسخ معتمدة من سياسة الخصوصية للمنظمة."},{"key":"C","letter":"ج","text":"استشارة المستشار القانوني حول قوانين الخصوصية الجديدة لوضع معايير مناسبة."},{"key":"D","letter":"د","text":"النظر في خطر اكتشاف عدم الامتثال للقوانين."}],"bankIndex":45,"setId":"set1"},{"id":"46","form":"form1","formTitle":"النموذج 1","lesson":"د- تنفيذ","answer":"C","question":"يُطلب من مدقق داخلي تحديد سبب تعرض خط إنتاج مصنع كبير للإغلاقات بسبب عدم توفر القطع. يكتشف المدقق أن بيانات الإنتاج المستخدمة في توليد عمليات الشراء التلقائية عبر التبادل الإلكتروني يتم جمعها على أجهزة الكمبيوتر الشخصية المتصلة بشبكة المنطقة المحلية (LAN). تتم عمليات الشراء من موردين مصرح بهم بناءً على خطط الإنتاج للشهر التالي وعلى خطة متطلبات المواد المعتمدة (MRP)، والتي تحدد الأجزاء المطلوبة لكل وحدة إنتاج. يشك المدقق في أن عمليات الإغلاق تحدث لأن متطلبات الشراء لم يتم تحديثها لتغييرات في تقنيات الإنتاج. أي من إجراءات التدقيق التالية يجب استخدامها لاختبار نظرية المدقق؟","options":[{"key":"A","letter":"أ","text":"قارن أوامر الشراء الناتجة عن بيانات الاختبار التي تم إدخالها في بأوامر الشراء المولدة من بيانات الإنتاج للفترة الأخيرة"},{"key":"B","letter":"ب","text":"قم بإعداد تقرير عن المخزون الزائد وقارن المخزون بحجم الإنتاج الحالي."},{"key":"C","letter":"ج","text":"قارن الأجزاء (الحقول أو الأحواض) المطلوبة بناءً على تقديرات الإنتاج الحالية و تقنيات الإنتاج المعدلة بأوامر الشراء التي تم إنشاؤها من النظام لنفس الفترة."},{"key":"D","letter":"د","text":"اختر عينة من تقديرات الإنتاج ولعدة فترات وتتبعها في النظام للتأكد من دقة الإدخال."}],"bankIndex":46,"setId":"set1"},{"id":"47","form":"form1","formTitle":"النموذج 1","lesson":"د- تنفيذ","answer":"B","question":"جمع مراجع داخلي العديد من شهادات الموظفين. أي من الإجراءات التالية هو أفضل إجراء يتخذه المراجع الداخلي قبل استخلاص استنتاج؟","options":[{"key":"A","letter":"أ","text":"ضمان توثيق الشهادات بشكل جيد"},{"key":"B","letter":"ب","text":"إثبات (تدعيم) الشهادات بأدلة مادية أو مستندية"},{"key":"C","letter":"ج","text":"تأكيد الشهادات مع نتائج تقنيات التحكم الناعمة الأخرى"},{"key":"D","letter":"د","text":"مراجعة الشهادات مع الموظفين الذين تمت مقابلتهم"}],"bankIndex":47,"setId":"set1"},{"id":"48","form":"form1","formTitle":"النموذج 1","lesson":"ج- تخطيط","answer":"C","question":"يخطط مدير التدقيق الداخلي لإجراء مراجعة للامتثال للعقود. أي مما يلي يجب القيام به قبل تطوير برنامج عمل التدقيق؟","options":[{"key":"A","letter":"أ","text":"اختيار عينة من الفواتير للاختبار الموضوعي"},{"key":"B","letter":"ب","text":"مراجعة العقد للحصول على دليل على التفويض"},{"key":"C","letter":"ج","text":"توثيق الأسباب الكامنة وراء عدم الامتثال"},{"key":"D","letter":"د","text":"تقييم المخاطر الأصلية لدفع فواتير مكررة."}],"bankIndex":48,"setId":"set1"},{"id":"49","form":"form1","formTitle":"النموذج 1","lesson":"د- تنفيذ","answer":"C","question":"يقوم الرئيس التنفيذي للتدقيق الداخلي (CAE) بمراجعة إشراف مهمة التدقيق الداخلي. أي مما يلي من الأرجح أن يؤكد له أن المهمة كانت تحت إشراف كافٍ؟","options":[{"key":"A","letter":"أ","text":"لدى مشرف الارتباط سياسة الباب المفتوح لأعضاء فريق التدقيق لمناقشة المخاوف"},{"key":"B","letter":"ب","text":"يراجع المشرف تقارير التقدم الأسبوعية من أعضاء فريق التدقيق"},{"key":"C","letter":"ج","text":"يراجع المشرف ويوقع بالحروف الأولى على أوراق عمل التدقيق الداخلي الخاصة بالارتباط"},{"key":"D","letter":"د","text":"يلتقي المشرف بشكل دوري مع الإدارة في المجال الذي تمت مراجعته للحصول على ملاحظات خلال الارتباط."}],"bankIndex":49,"setId":"set1"},{"id":"50","form":"form1","formTitle":"النموذج 1","lesson":"د- تنفيذ","answer":"B","question":"أي من أدوات أو تقنيات التدقيق الآلي التالية يجب استخدامها إذا كان المدقق الداخلي يريد استخراج ملفات وسجلات محددة في قاعدة البيانات؟","options":[{"key":"A","letter":"أ","text":"نظام دعم الخبراء أو القرار أو برامج تدقيق عالم التدقيق (GAS)"},{"key":"B","letter":"ب","text":"برنامج التدقيق العام"},{"key":"C","letter":"ج","text":"برنامج مساعدة النظام"},{"key":"D","letter":"د","text":"مرفق اختبار متكامل"}],"bankIndex":50,"setId":"set1"},{"id":"51","form":"form1","formTitle":"النموذج 1","lesson":"ج- تخطيط","answer":"D","question":"أين يجب أن يركز المدقق الداخلي انتباهه عند تحديد وتقييم المخاطر الرئيسية أثناء مرحلة التخطيط لمهمة التأكيد؟","options":[{"key":"A","letter":"أ","text":"مخاطر العينة."},{"key":"B","letter":"ب","text":"مخاطر التدقيق."},{"key":"C","letter":"ج","text":"المخاطر المتبقية."},{"key":"D","letter":"د","text":"المخاطر الكامنة (المتأصلة)."}],"bankIndex":51,"setId":"set1"},{"id":"52","form":"form1","formTitle":"النموذج 1","lesson":"ج- تخطيط","answer":"A","question":"تتوسع منظمة في خط عمل جديد يتمثل في بيع الغاز الطبيعي. يخطط المدقق الداخلي لمهمة ويريد الحصول على فهم عام لسوق الغاز الطبيعي وحصة السوق التي ترغب المنظمة في الحصول عليها، والميزة التنافسية التي قد تمتلكها المنظمة. أي مما يلي سيكون أفضل مصدر لهذه المعلومات؟","options":[{"key":"A","letter":"أ","text":"مقابلة المديرين المسؤولين وقراءة المستندات (الوثائق) الاستراتيجية."},{"key":"B","letter":"ب","text":"إجراء عمليات بحث على الإنترنت حول مبيعات الغاز وتحليل اللاعبين في السوق"},{"key":"C","letter":"ج","text":"مراجعة محفظة عملاء الغاز وتجميع إحصائيات عن هامش الربح"},{"key":"D","letter":"د","text":"تحليل عائدات المنظمة وحساب نسبة الغاز."}],"bankIndex":52,"setId":"set1"},{"id":"53","form":"form1","formTitle":"النموذج 1","lesson":"هـ- الابلاغ","answer":"A","question":"أوصى مدقق داخلي بأن تنفذ منظمة ضوابط محوسبة في نظام المبيعات الخاص بها لمنع مندوبي المبيعات من تنفيذ عقود تتجاوز مستويات سلطتهم الموكلة. ووجدت مراجعة متابعة أنه لم يتم تعديل نظام ال دي ذلك إلى عقوبات تنظيمية وإلحاق الضرر بسمعة المنظمة. ما هي الخطوة التالية الأنسب التي يجب على المدير التنفيذي للتدقيق اتخاذها؟","options":[{"key":"A","letter":"أ","text":"إبلاغ الأمر إلى مجلس الإدارة"},{"key":"B","letter":"ب","text":"تنفيذ الضوابط الموصى بها لمعالجة التعرض"},{"key":"C","letter":"ج","text":"مناقشة الأمر مع الإدارة العليا"},{"key":"D","letter":"د","text":"طلب من الوكالة التنظيمية إقناع الإدارة بمعالجة القضية"}],"bankIndex":226,"setId":"set3"},{"id":"227","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"D","question":"وفقًا لإرشادات معهد المدققين الداخليين (IIA) بشأن العناية المهنية الواجبة، أي من خطوات التدقيق التالية سيقوم بها المدقق الداخلي عند مراجعة صرف النقدية؟","options":[{"key":"A","letter":"أ","text":"الحجم الإحصائي المحسوب للعينة هو 50، لكن يعتقد المدقق الداخلي أن هناك أخطاء، لذلك فإنه يقرر زيادة حجم العينة. إلى 80"},{"key":"B","letter":"ب","text":"يتتبع المدقق الداخلي الأرقام التسلسلية لمعدات الكمبيوتر المدرجة في فاتورة إلى مخزون الأصول الثابتة"},{"key":"C","letter":"ج","text":"يراجع المدقق الداخلي صندوق المدير الصغير للأموال النقدية والمستندات في الحسابات الدائنة"},{"key":"D","letter":"د","text":"يراجع المدقق الداخلي الفاتورة ذات الصلة وطلب الشراء وتقرير الاستلام لكل اختيار للعينة."}],"bankIndex":227,"setId":"set3"},{"id":"228","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"D","question":"أي من أنواع التوصيات التالية من المرجح أن يقترح حلولًا طويلة الأجل؟","options":[{"key":"A","letter":"أ","text":"التوصيات القائمة على الشرط"},{"key":"B","letter":"ب","text":"التوصيات القائمة على السبب"},{"key":"C","letter":"ج","text":"التوصيات القائمة على الأثر"},{"key":"D","letter":"د","text":"التوصيات القائمة على السبب الجذري."}],"bankIndex":228,"setId":"set3"},{"id":"229","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"C","question":"أثناء إجراء مراجعة لقسم اللوجستيات، حدد فريق التدقيق الداخلي ضعفًا هاما في الرقابة. قرر المدير التنفيذي للتدقيق (CAE) إعداد مذكرة تدقيق لإدارة قسم اللوجستيات تليها اجتماع غير رسمي. ما هو السبب الأكثر ترجيحًا وراء قرار CAE بإعداد مذكرة التدقيق؟","options":[{"key":"A","letter":"أ","text":"الإبلاغ عن تقدم التدقيق المحدث إلى الإدارة"},{"key":"B","letter":"ب","text":"التأكد من أن فريق التدقيق الداخلي وCAE متوافقان فيما يتعلق بالضعف المحدد"},{"key":"C","letter":"ج","text":"السماح للإدارة بمعالجة الضعف المحدد في الوقت المناسب"},{"key":"D","letter":"د","text":"الحصول على موافقة الإدارة فيما يتعلق بالضعف المحدد"}],"bankIndex":229,"setId":"set3"},{"id":"230","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"C","question":"اكتشف مدقق داخلي أن عقود المبيعات مع العملاء التجاريين لم يتم تخزينها في قاعدة بيانات إدارة الوثائق الإلكترونية، بل تم مسحها ضوئيًا وحفظها بطريقة غير منهجية في مجلدات الخادم. أي مما يلي سيكون نتيجة مناسبة ليضمها المدقق الداخلي في الملاحظة المكتوبة؟","options":[{"key":"A","letter":"أ","text":"تتطلب سياسة إدارة المستندات تخزين بيانات العملاء التجاريين في قاعدة بيانات إدارة محددة."},{"key":"B","letter":"ب","text":"تم تخزين عقود المبيعات بشكل غير صحيح لأن مدير المكتب لم يتم تدريبه على استخدام قاعدة البيانات الإلكترونية ويفضل تجنبها."},{"key":"C","letter":"ج","text":"إذا أصبحت المنظمة خاضعة للمقاضاة، فقد يكون من الصعب إثبات شروط الأسعار والاتفاقيات المتفق عليها في العقود"},{"key":"D","letter":"د","text":"يجب تدريب جميع الموظفين بشكل مناسب ولزم أن يتبعوا سياسات المنظمة وإجراءاتها المعمول بها فيما يتعلق بإدارة المستندات."}],"bankIndex":230,"setId":"set3"},{"id":"231","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"C","question":"في أي من المجتمعات التالية من المرجح أن يختار المراجع الداخلي استخدام نهج العينة الطبقية؟","options":[{"key":"A","letter":"أ","text":"المخزون المكون من نفس العناصر المخزنة في مستودعات مختلفة"},{"key":"B","letter":"ب","text":"دفعات المواد التي يجب التأكد من أنها تلبي معايير الجودة."},{"key":"C","letter":"ج","text":"الإيرادات التي تحققها المؤسسة من خلال إيصالات نقدية أو مستحقات."},{"key":"D","letter":"د","text":"التقارير الضريبية المقدمة لتلبية متطلبات سلطة ال ,"letter":"ج","text":"التأثير السنوي للاتفاقية المتغيرة على التدفقات النقدية"},{"key":"D","letter":"د","text":"تفاصيل حول توقيت توقيع التغيير في الاتفاقية"}],"bankIndex":237,"setId":"set3"},{"id":"238","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"D","question":"أي من العبارات التالية صحيحة بشكل عام فيما يتعلق بتخطيط مهمة المراجعة؟","options":[{"key":"A","letter":"أ","text":"أفضل مصدر لمعلومات العملية التفصيلية هو الإدارة العليا"},{"key":"B","letter":"ب","text":"يجب أن تكون أهداف المراجعة عامة ولا تتغير."},{"key":"C","letter":"ج","text":"عادةً لا تكون تقنيات مراجعة الكمبيوتر مفيدة أثناء تخطيط الارتباط."},{"key":"D","letter":"د","text":"يجب على المراجعين الداخليين إعداد برنامج مراجعة شامل لاختبار الضوابط"}],"bankIndex":238,"setId":"set3"},{"id":"239","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"C","question":"يقوم المدقق الداخلي باختبار التصريح السليم للعقود ويجد أن معدل الانحرافات المكتشفة في العينة يساوي معدل الانحراف المقبول. أي مما يلي هو الاستنتاج الأكثر ملاءمة للمدقق الداخلي لإجرائه بناءً على هذه النتيجة؟","options":[{"key":"A","letter":"أ","text":"يستنتج المدقق الداخلي أن الإدارة قد تضع اعتمادًا غير ضروري على الضوابط المحددة."},{"key":"B","letter":"ب","text":"يستنتج المدقق الداخلي أن الضوابط المحددة أكثر فعالية مما هي عليه بالفعل."},{"key":"C","letter":"ج","text":"يستنتج المدقق الداخلي أن الضوابط المحددة فعالة بشكل مقبول."},{"key":"D","letter":"د","text":"يستنتج المدقق الداخلي أن اختبارات إضافية ستكون مطلوبة لتقييم الضوابط المحددة."}],"bankIndex":239,"setId":"set3"},{"id":"240","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"C","question":"في خريطة المخاطر والرقابة التالية، تم تصنيف المخاطر بناءً على مستوى الأهمية ومستوى الرقابة المرتبط بها. أي من العبارات التالية صحيحة فيما يتعلق بالمخاطر (C) ؟https://x3marx.github.io/test/r&c.jpg","options":[{"key":"A","letter":"أ","text":"مستوى الرقابة مناسب بالنظر إلى مستوى المخاطر"},{"key":"B","letter":"ب","text":"مستوى الرقابة مفرط بالنظر إلى مستوى المخا A","letter":"أ","text":"لا توجد عملية إدارة المخاطر والرقابة، وتقع مسؤولية إدارة المخاطر على عاتق المديرين التشغيليين وحدهم"},{"key":"B","letter":"ب","text":"يتم توزيع مدونة قواعد السلوك للمؤسسة على الموظفين كل عام، ومع ذلك لا يُطلب من الموظفين التصديق على أنهم سيعملون وفقًا للرمز."},{"key":"C","letter":"ج","text":"وجدت مطابقة جداول أعمال اجتماعات المجلس المخطط لها مع محاضر الاجتماعات أنه تم إلغاء اجتماع واحد، وتم تغطية مواضيع جدول الأعمال في الاجتماع التالي."},{"key":"D","letter":"د","text":"أظهرت مراجعة الخطة الاستراتيجية الخمسية أنه لم يتم إيصال تفاصيل الخطة بوضوح إلى الموظفين في جميع أنحاء المؤسسة"}],"bankIndex":243,"setId":"set3"},{"id":"244","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"B","question":"قام مدقق داخلي بفحص عينة غير إحصائية لأرصدة الحسابات المستحقة المفتوحة واكتشف أن 10 من 60 تجاوزت عتبة حد الائتمان غير المضمون المعتمدة التي تحددها سياسة المنظمة. ماذا يجب على المدقق توثيقه في أوراق العمل؟","options":[{"key":"A","letter":"أ","text":"عدم مراقبة سحب حد الائتمان وفقًا لسياسة المنظمة"},{"key":"B","letter":"ب","text":"سبعة عشر في المائة من أرصدة العملاء المفتوحة في العينة تتجاوز حد الائتمان غير المضمون المعتمد"},{"key":"C","letter":"ج","text":"عتبة حدود الائتمان التي تحددها سياسة المنظمة غير كافية"},{"key":"D","letter":"د","text":"يجب على الإدارة إجراء مراقبة شهرية لأرصدة العملاء المفتوحة"}],"bankIndex":244,"setId":"set3"},{"id":"245","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"D","question":"آخر مرة قبل ثلاث سنوات ومن المقرر إجراء مهمة تأكيد بعد إجراء تغييرات (HR) تمت مراجعة إدارة الموارد البشرية حديثة في العملية. أي من الخيارات التالية ستكون أكثر الخيارات فعالية لتحديد مخاطر وضوابط إدارة الموارد البشرية؟","options":[{"key":"A","letter":"أ","text":"الاجتماع مع مدير العمليات للحصول على معلومات حول إدارة الموارد البشرية."},{"key":"B","letter":"ب","text":"مراجعة تقرير التدقيق الداخلي السابق والتركيز على ملاحظات التدقيق الرئيسية وخطط العمل."},{"key":"C","letter":"ج","text":"مراجعة استراتيجية المخاطر للمؤسسة ً رئيسيًا."},{"key":"D","letter":"د","text":"يجب أن يكون المرشد مشرف المراجع الداخلي لضمان تقييم أداء المراجع في سياق مناسب وذات معنى."}],"bankIndex":248,"setId":"set3"},{"id":"249","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"C","question":"يخطط الرئيس التنفيذي للتدقيق في منظمة دولية لإجراء تدقيق على وظيفة الخزانة الموجودة في المقر الرئيسي للمنظمة. يفتقر فريق التدقيق الداخلي الحالي في المقر الرئيسي إلى الخبرة في مجال الأسواق المالية اللازمة للمشاركة. أي من الحلول التالية سيكون الأكثر ملاءمة بالنظر إلى ضيق الوقت؟","options":[{"key":"A","letter":"أ","text":"الاستعانة بالعمل الخارجي لمراجع حسابات المنظمة الخارجي الذي لديه خبرة في مجال الأسواق المالية."},{"key":"B","letter":"ب","text":"تعيين مدققين داخليين إضافيين لديهم خبرة في مجال الأسواق المالية."},{"key":"C","letter":"ج","text":"دعوة مدقق حسابات ضيف من إحدى الشركات التابعة للمنظمة لديه خبرة في مجال الأسواق المالية."},{"key":"D","letter":"د","text":"تحديد نطاق المشاركة بالمعرفة والمهارات التي يمتلكها فريق التدقيق الداخلي."}],"bankIndex":249,"setId":"set3"},{"id":"250","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"B","question":"أي من الإجراءات التالية من شأنه أن يوفر الدليل الأكثر موثوقية للمدقق الداخلي الذي يختبر ما إذا كان يتم تحديد المنتجات المعيبة وإزالتها بشكل فعال أثناء المعالجة قبل الشحن للعملاء؟","options":[{"key":"A","letter":"أ","text":"مراجعة نتائج مسح إدارة الجودة، والتي تظهر أن 96 ٪ من الموظفين يعتقدون أنه تمت إزالة جميع المنتجات المعيبة قبل الشحن."},{"key":"B","letter":"ب","text":"الفحص المادي لعينة من دورات المعالجة المكتملة للمنتجات التجريبية قبل الشحن."},{"key":"C","letter":"ج","text":"مراقبة الموظفين أثناء فحصهم للمنتجات بحثًا عن عيوب"},{"key":"D","letter":"د","text":"مراجعة تقرير الجودة المقدم من إدارة حصيرة الثلوج تم تحديد 13 منتجًا وإزالتها خلال دورة المعالجة الأخيرة"}],"bankIndex":250,"setId":"set3"},{"id":"251","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"A","question":"ما الذي يجب وصفه في عنصر التقدير/الانجاز/الاعتراف بتقرير المراجعة الداخلية النموذجي؟","options":[{"key":"A","letter":"أ","text":"الجوانب الإيجابية للعملية أو المجال قيد المراجعة"},{"key":"B","letter":"ب","text":"ملخص موجز للعملية أو المجال قيد المراجعة"},{"key":"C","letter":"ج","text":"نتائج وتقييمات العملية أو المجال قيد المراجعة"},{"key":"D","letter":"د","text":"إصدار التقرير وطريقة الاتصال بالارتباط."}],"bankIndex":251,"setId":"set3"},{"id":"252","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"C","question":"عند تقديم ملاحظة مكتوبة، ما هو عادةً صحيح فيما يتعلق بمستوى التفاصيل المقدمة؟ (1) يحتوي وصف الملاحظة في تقرير المراجعة النهائي على تفاصيل أكثر من الوصف في أوراق عمل الارتباط. (2) يحتوي وصف الملاحظة في أوراق عمل الارتباط على تفاصيل أكثر من الوصف في وثيقة الملاحظة الأولية. (3) تحتوي وثيقة الملاحظة الأولية على تفاصيل أكثر من وصف الملاحظة في تقرير المراجعة النهائي. (4) تحتوي وثيقة الملاحظة الأولية على تفاصيل أكثر من وصف الملاحظة في أوراق عمل الارتباط.","options":[{"key":"A","letter":"أ","text":"1 و 2"},{"key":"B","letter":"ب","text":"1 و 4"},{"key":"C","letter":"ج","text":"2 و 3"},{"key":"D","letter":"د","text":"3 و 4"}],"bankIndex":252,"setId":"set3"},{"id":"253","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"C","question":"طور مدقق داخلي قائمة بالاعتبارات الداخلية والخارجية للمخاطر عبر عمليات المنظمة، وطور مقياسًا لتقييم كل مخاطرة وخصص الأهمية النسبية لكل مخاطرة. أي من الأساليب التالية اتخذها المدقق؟","options":[{"key":"A","letter":"أ","text":"النهج من أعلى إلى أسفل"},{"key":"B","letter":"ب","text":"منهج مصفوفة العمليات"},{"key":"C","letter":"ج","text":"نهج عوامل المخاطر"},{"key":"D","letter":"د","text":"النهج من أسفل إلى أعلى."}],"bankIndex":253,"setId":"set3"},{"id":"254","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"B","question":"بأي من الطرق التالية يمكن لنشاط التدقيق الداخلي إيجاد فرص جديدة للمهمة؟","options":[{"key":"A","letter":"أ","text":"بتعريف الأنشطة حسب العمليات التجارية."},{"key":"B","letter":"ب","text":"بالنظر إلى العوامل الخارجية مثل  مخاطر كبيرة تهدد سلامتها المالية. طلبت الإدارة العليا من المدير التنفيذي للتدقيق (CAE) الاجتماع معهم لمناقشة المخاطر. أي مما يلي يصف بشكل أفضل مسؤولية المدير التنفيذي للتدقيق في الاجتماع؟","options":[{"key":"A","letter":"أ","text":"إبلاغ الإدارة العليا بالإجراءات المناسبة التي يجب اتخاذها للسيطرة على المخاطر"},{"key":"B","letter":"ب","text":"يوصي بأن تقدم نشاط التدقيق الداخلي خدمات استشارية للمساعدة في تقليل المخاطر"},{"key":"C","letter":"ج","text":"تحمل مسؤولية حل المخاطر الكبيرة التي ستؤثر على المنظمة"},{"key":"D","letter":"د","text":"تحديد ما إذا كانت الإدارة العليا تقبل المخاطر التي قد تُعتبر غير مقبولة للمنظمة."}],"bankIndex":265,"setId":"set3"},{"id":"266","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"A","question":"أي مما يلي هو أحد العناصر (السمات) الخمس التي يدرجها المدققون الداخليون عند توثيق القصور أو الخلل؟","options":[{"key":"A","letter":"أ","text":"المعايير المستخدمة لإجراء التقييم"},{"key":"B","letter":"ب","text":"منهجية تحليل البيانات"},{"key":"C","letter":"ج","text":"اقتراح أعمال المتابعة التي سيتم تنفيذها"},{"key":"D","letter":"د","text":"نطاق العمل المنجز خلال المهمة"}],"bankIndex":266,"setId":"set3"},{"id":"267","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"D","question":"إجراء تحقيق جنائي خاص بقسم المشتريات في غضون شهر (CAE) طلبت لجنة التدقيق من رئيس قسم التدقيق الداخلي بسبب أهمية وضرورة المخاطر المكتشفة حديثًا. لا يوجد حاليًا لدى نشاط التدقيق الداخلي موظفون لديهم الخبرة أو المؤهلات ذات الصلة. أي مما يلي هو أفضل خيار لرئيس قسم التدقيق الداخلي للوفاء بمسؤوليات نشاط التدقيق الداخلي في هذه الحالة؟","options":[{"key":"A","letter":"أ","text":"الاستعانة بمستشارين مهنيين مستقلين للتحقيق"},{"key":"B","letter":"ب","text":"اختيار بعض المدققين الداخليين وإخراجهم من مهامهم الحالية حتى يتمكنوا من بدء دورة تحقيق جنائي."},{"key":"C","letter":"ج","text":"استقدام عدد إضافي من المدققين الداخليين ذوي المؤهلات والخبرة ذات الصلة."},{"key":"D","letter":"د","text":"رفض المشاركة في هذه المرحلة."}],"bankIndex":267,"setId":"set3"},{"id":"268","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"C","question":"ما هي أهداف استخدام استبيانات الرقابة الداخلية؟","options":[{"key":"A","letter":"أ","text":"التأكد من الفعالية التشغيلية للإجراء"},{"key":"B","letter":"ب","text":"التحقق من صحة المعلومات الواردة في التقرير"},{"key":"C","letter":"ج","text":"تقييم الضوابط التي تخفف من المخاطر الرئيسية"},{"key":"D","letter":"د","text":"تحديد ما إذا كانت إجراءات العقود المحددة مطبقة."}],"bankIndex":268,"setId":"set3"},{"id":"269","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"D","question":"يطور الرئيس التنفيذي للتدقيق (CAE) برنامج عمل لمشاركة قادمة ستراجع خدمات التعاقد الصغيرة للمنظمة. ما الذي يحتاج الرئيس التنفيذي للتدقيق (CAE) إلى مراعاته أكثر عند تطوير برنامج العمل؟","options":[{"key":"A","letter":"أ","text":"التغييرات في موظفي قسم التعاقد خلال العام الماضي"},{"key":"B","letter":"ب","text":"الشهادات التي يحملها المدققون الداخليون المخصصون للمشاركة"},{"key":"C","letter":"ج","text":"زيادة نشاط التدقيق الداخلي في الميزانية والتوظيف للعام"},{"key":"D","letter":"د","text":"التغييرات الأخيرة التي طرأت على المنظمة في كيفية معالجة المدفوعات"}],"bankIndex":269,"setId":"set3"},{"id":"270","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"B","question":"يخطط المدقق الداخلي للمشاركة في مؤسسة مالية. هدف المشاركة هو تحديد ما إذا تم منح القروض وفقًا لسياسات المنظمة. أي من النهج التالية ستوفر للمدقق أفضل المعلومات؟","options":[{"key":"A","letter":"أ","text":"اختيار 30 حالة من القروض عشوائيًا والتحقق مما إذا تم سدادها في الوقت المحدد وبكامل المبلغ"},{"key":"B","letter":"ب","text":"اختيار 30 حالة من القروض عشوائيًا ومقارنتها بإرشادات الاكتتاب المعمول بها"},{"key":"C","letter":"ج","text":"اختيار 30 موظفًا بشكل عشوائي لإكمال استطلاع حول ما إذا تم اتباع السياسات والمعايير"},{"key":"D","letter":"د","text":"اختيار عدة أشهر عشوائيًا والحصول على تقارير مبدئية لهذه الأشهر ومقارنتها بالعام السابق"}],"bankIndex":270,"setId":"set3"},{"id":"271","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"D","question":"عند التخطيط لمهمة تدقيق نشاط بطاقة المشتريات، أي من الإجراءات التالية يجب على المدقق الداخلي اتخاذها لتحديد المخاطر والضوابط ذات الصلة؟","options":[{"key":"A","letter":"أ","text":"مقارنة أنواع معاملات البطاقة مع إرشادات سياسة بطاقة المشتريات."},{"key":"B","letter":"ب","text":"تحديد نطاق وأهداف المهمة."},{"key":"C","letter":"ج","text":"تحديد عدد حاملي البطاقات الذين تجاوزوا حدهم اليومي."},{"key":"D","letter":"د","text":"مقابلة مسؤول برنامج بطاقة المشتريات."}],"bankIndex":271,"setId":"set3"},{"id":"272","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"A","question":"كجزء من مساعدة المراجعة الداخلية في التدقيق الخارجي السنوي، يطلب من المراجعين الداخليين إجراء مراجعة تحليلية أولية لرصيد حسابات البنوك. يتضمن ذلك التحقق من أرصدة نهاية السنة الحالية وكذلك مقارنة أرصدة نهاية السنة الحالية بأرصدة نهاية السنة السابقة لتسليط الضوء على التغييرات الكبيرة. أي مما يلي هو المصدر الأكثر موثوقية للتحقق من أرصدة حسابات البنك في نهاية السنة الحالية؟","options":[{"key":"A","letter":"أ","text":"تأكيدات البنك"},{"key":"B","letter":"ب","text":"كشوفات الحسابات البنكية الداخلية"},{"key":"C","letter":"ج","text":"تسويات البنوك اعتبارًا من نهاية العام"},{"key":"D","letter":"د","text":"رصيد دفتر الأستاذ العام لحساب البنك اعتبارًا من نهاية العام"}],"bankIndex":272,"setId":"set3"},{"id":"273","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"D","question":"يشك مدقق داخلي في أن إدارة أحد الأقسام تقوم بتقسيم عدد من عمليات الشراء المخططة لتجنب عملية الموافقة المطلوبة للمشتريات الكبيرة. أي مما يلي سيكون أكثر التقنيات فعالية لمساعدة المدقق على تحديد مدى انتشار هذه الممارسة غير السليمة؟","options":[{"key":"A","letter":"أ","text":"فحص العينة الكاملة."},{"key":"B","letter":"ب","text":"سؤال الإدارة عن الممارسة غير السليمة."},{"key":"C","letter":"ج","text":"اختبار عينة من المعاملات العشوائية."},{"key":"D","letter":"د","text":"استخدام تحليل البيانات."}],"bankIndex":273,"setId":"set3"},{"id":"274","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"D","question":"يخطط مدقق داخلي مهمة استشارية، والهدف هو تحديد فرص تحسين كفاءة عملية الشراء في المنظمة. ويستعد المدقق لإجراء مسح أولي للمنطقة. أي من الأساليب التالية سيكون الأكثر فائدة للحصول على معلومات ذات صلة لدعم هدف المشاركة؟","options":[{"key":"A","letter":"أ","text":"استكمال مراجعة المعاملات التي تركز على تصميم وتشغيل ضوابط الإبلاغ المالي"},{"key":"B","letter":"ب","text":"إجراء مقابلات مع الإدارة العليا للحصول على مدخلاتهم وبصائرهم فيما يتعلق بالضوابط التشغيلية."},{"key":"C","letter":"ج","text":"إجراء مراجعة شاملة لسياسات المنظمة الحالية وإجراءات التشغيل القياسية."},{"key":"D","letter":"د","text":"مراجعة خريطة عملية الشراء مع الموظفين الذين يقومون بالأنشطة الرئيسية للحصول على مدخلاتهم وافكارهم."}],"bankIndex":274,"setId":"set3"},{"id":"275","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"C","question":"أي من أنشطة الإشراف على المهام التالية يجب القيام بها أولاً؟","options":[{"key":"A","letter":"أ","text":"ضمان أن تكون توصيات التدقيق الداخلي عملية وفعالة من حيث التكلفة وقيمة مضافة."},{"key":"B","letter":"ب","text":"ضمان استناد استنتاجات التدقيق الداخلي على أدلة كافية وموثوقة."},{"key":"C","letter":"ج","text":"ضمان تقييم المخاطر المتعلقة بالإنجاز في الوقت المناسب للمهمة."},{"key":"D","letter":"د","text":"ضمان استكمال تقييمات الأداء لأعضاء فريق التدقيق."}],"bankIndex":275,"setId":"set3"},{"id":"276","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"A","question":"وفقًا لإرشادات معهد التدقيق الداخلي (IIA)، أي من الإجراءات التالية يجب على المدقق الداخلي اتخاذها على الفور بعد النظر في سيناريوهات الاحتيال وتحديد أولويات مخاطر الاحتيال؟","options":[{"key":"A","letter":"أ","text":"تحديد الضوابط الموجودة، إن وجدت، للتخفيف من مخاطر الاحتيال"},{"key":"B","letter":"ب","text":"اتباع بروتوكول الإبلاغ الداخلي والتحقيق في مزاعم الاحتيال"},{"key":"C","letter":"ج","text":"البحث عن عمليات الاحتيال التي حدثت في مؤسسات مماثلة"},{"key":"D","letter":"د","text":"دمج تقييم مخاطر الاحتيال في خطة المشاركة"}],"bankIndex":276,"setId":"set3"},{"id":"277","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"C","question":"برنامج عمل المشاركة ذو أكبر قيمة للإدارة عندما يكون أي مما يلي صحيحًا؟","options":[{"key":"A","letter":"أ","text":"يوفر برنامج العمل دعمًا أكثر تفصيلاً لتقرير التدقيق"},{"key":"B","letter":"ب","text":"يساعد برنامج العمل في تحديد كمية الموارد المطلوبة للتدقيق"},{"key":"C","letter":"ج","text":"يساعد برنامج العمل في ضمان تحقيق أهداف المهمة"},{"key":"D","letter":"د","text":"يساعد برنامج العمل المدقق في تطوير وإدارة اختبارات التدقيق"}],"bankIndex":277,"setId":"set3"},{"id":"278","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"A","question":"أن (CAE) أبلغ مدقق داخلي في بنك مدير الفرع بخلل في قفل أحد الخزائن. واعتبر الرئيس التنفيذي للتدقيق الداخلي المخاطر المرتبطة بهذه المشكلة كبيرة، وأوصى باتخاذ إجراءات تصحيحية فورية. ومع ذلك، خلال مشاركة المتابعة، أخبر مدير الفرع الرئيس التنفيذي للتدقيق أن المخاطر في الواقع ليست كبيرة، وبالتالي لم يتم اتخاذ أي إجراء. ما هي الخطوة التالية الأكثر ملاءمة للرئيس التنفيذي للتدقيق؟","options":[{"key":"A","letter":"أ","text":"إبلاغ الإدارة العليا أن مدير الفرع قرر إلغاء خطة العمل الملتزمة دون أي اتصال سابق."},{"key":"B","letter":"ب","text":"مناقشة المسألة مع المجلس الذي يتحمل مسؤولية حل المخاطر في نهاية المطاف."},{"key":"C","letter":"ج","text":"إجراء مناقشة أخرى مع مدير الفرع محاولة لتغيير رأيه وتشجيعه على نقل التوصيات."},{"key":"D","letter":"د","text":"توثيق قرار مدير الفرع بتحمل المخاطر، وإلا فلن تكون هناك حاجة إلى أي مسار آخر للعمل."}],"bankIndex":278,"setId":"set3"},{"id":"279","form":"form4","formTitle":"النموذج 4","lesson":"ز- مجمعة","answer":"D","question":"وفقًا لإرشادات معهد المدققين الداخليين (IIA)، أي مما يلي صحيح فيما يتعلق بالإشراف على التدقيق؟ (1) يجب إجراء الإشراف على مدار مراحل التخطيط والفحص والتقييم والتواصل والمتابعة في مهمة التدقيق. (2) يجب أن يمتد الإشراف إلى التدريب وإبلاغ الوقت والسيطرة على النفقات وكذلك الأمور الإدارية. (3) يجب أن يشمل الإشراف مراجعة أوراق عمل
